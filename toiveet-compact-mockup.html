<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eurorack.fi — Toiveet, compact on desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{--bg:#E7EBF0;--bg2:#DCE2EA;--panel:#FAFBFD;--panel2:#EFF3F8;
 --ink:#0F1722;--ink2:#36435A;--muted:#6A7789;--line:#CAD3DF;--line2:#AFBACB;
 --accent:#0B4F9E;--accent-hi:#083B77;--accent-soft:#D6E3F5;--on:#FAFBFD;
 --shadow:0 1px 2px rgba(15,23,34,.07),0 8px 24px -12px rgba(15,23,34,.22);}
*{box-sizing:border-box}
body{margin:0;padding:36px 40px 70px;background:var(--bg);color:var(--ink);
 font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
h1{font-size:1.35rem;letter-spacing:-.025em;margin:0 0 .5rem}
.sub{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;color:var(--ink2);
 line-height:1.6;max-width:64ch;margin:0 0 1.4rem}
h2{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:2.6rem 0 .3rem}
.scale{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--accent);
 letter-spacing:.1em;text-transform:uppercase;margin:1.4rem 0 .5rem}
.cap{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--muted);
 margin-top:.7rem;line-height:1.7;max-width:80ch}
.stage{border:1px dashed var(--line2);padding:1.2rem 1.4rem;background:var(--panel)}

/* section furniture, shared */
.wishband{padding:.2rem 0}
.bandhead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.wishband h3{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.seeall{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--accent);text-decoration:none}
.wishnote{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);margin-top:.8rem}

/* ---------- A: compact card, link in every card ---------- */
.gridA{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.7rem}
.cardA{background:var(--panel);border:1px solid var(--line);padding:.7rem .9rem;
 display:block;text-decoration:none;color:inherit}
.cardA .nm{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1rem}
.cardA .nm i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.cardA .sub2{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);margin-top:.2rem}
.cardA .lnk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--accent);margin-top:.5rem}

/* ---------- B: compact card, one link for the section ---------- */
.gridB{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem}
.cardB{background:var(--panel);border:1px solid var(--line);padding:.6rem .8rem;
 display:flex;align-items:baseline;gap:.55rem;text-decoration:none;color:inherit}
.cardB i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;align-self:center}
.cardB .n{font-weight:700;font-size:.98rem}
.cardB .c{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);margin-left:auto}

/* ---------- D: items inline as plain text, two lines max ---------- */
.rowD{background:var(--panel);border:1px solid var(--line);padding:.6rem .9rem;
 display:block;text-decoration:none;color:inherit;margin-bottom:.5rem}
.rowD .top{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.rowD i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;align-self:center}
.rowD .n{font-weight:700;font-size:1rem;flex:0 0 auto}
.rowD .c{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--muted);flex:0 0 auto}
/* the wants: plain text, NOT chips. They sit directly above a bar full of
   filter chips, and a bordered pill here reads as another control. */
.rowD .wants{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink2);
 flex:1 1 auto;min-width:0;line-height:1.55;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rowD .wants .sep{color:var(--line2);padding:0 .1rem}
.rowD .wants .more{color:var(--muted)}
.rowD .lnk{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--accent);
 flex:0 0 auto;margin-left:auto}

/* ---------- C: one row of chips ---------- */
.rowC{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chipC{display:inline-flex;align-items:center;gap:.45rem;background:var(--panel);
 border:1px solid var(--line2);padding:.34rem .7rem;text-decoration:none;color:var(--ink2);
 font-family:"IBM Plex Mono",monospace;font-size:.74rem}
.chipC i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chipC b{color:var(--ink);font-weight:600}
.chipC .c{color:var(--muted)}
</style></head>
<body>
<h1>Toiveet, compact on desktop</h1>
<p class="sub">D is the one to look at first. Every card links to the same place — <code>#/wish</code>. There is no per-seller
wish route, so at eight sellers option A is eight identical links. Each option is drawn at
today's three sellers and at a plausible eight.</p>

<div id="out"></div>

<script>
var S=[["Kalle",14,"#4E9E7E"],["Sampo",20,"#C98A2E"],["spongefile",52,"#678cd6"],
       ["Mikko",11,"#9B6BB0"],["Riikka",27,"#C4576B"],["Jussi",18,"#3E8E8E"],
       ["Aino",9,"#B0863E"],["Tero",31,"#5C7BC4"]];
function A(n){var s=S.slice(0,n);return '<div class="wishband"><div class="bandhead"><h3>Toiveet</h3></div>'+
 '<div class="gridA">'+s.map(function(p){return '<a class="cardA" href="#" style="border-left:3px solid '+p[2]+'">'+
 '<div class="nm"><i style="background:'+p[2]+'"></i>'+p[0]+'</div>'+
 '<div class="sub2">'+p[1]+' kohdetta</div>'+
 '<div class="lnk">Katso koko lista &rarr;</div></a>';}).join("")+'</div>'+
 '<div class="wishnote">Myös osavaihto + rahaa</div></div>';}
function B(n){var s=S.slice(0,n);return '<div class="wishband"><div class="bandhead"><h3>Toiveet</h3>'+
 '<a class="seeall" href="#">Katso koko lista &rarr;</a></div>'+
 '<div class="gridB">'+s.map(function(p){return '<a class="cardB" href="#" style="border-left:3px solid '+p[2]+'">'+
 '<i style="background:'+p[2]+'"></i><span class="n">'+p[0]+'</span>'+
 '<span class="c">'+p[1]+'</span></a>';}).join("")+'</div>'+
 '<div class="wishnote">Myös osavaihto + rahaa</div></div>';}
function C(n){var s=S.slice(0,n);return '<div class="wishband"><div class="bandhead"><h3>Toiveet</h3>'+
 '<a class="seeall" href="#">Katso koko lista &rarr;</a></div>'+
 '<div class="rowC">'+s.map(function(p){return '<a class="chipC" href="#">'+
 '<i style="background:'+p[2]+'"></i><b>'+p[0]+'</b><span class="c">'+p[1]+'</span></a>';}).join("")+'</div>'+
 '<div class="wishnote">Myös osavaihto + rahaa</div></div>';}

var W={Kalle:["Fumana","Polygogo","Mindphaser","Versio","Rings","Maths","Plaits"],
 Sampo:["Versio (any model)","Mangrove","Just Friends","Beads","Morphagene"],
 spongefile:["MCO","AXON-1","Mangrove","W/","Dot","Mimetic Digitwolis","PoliMATHS","øchd expander","Neo Trinity"],
 Mikko:["Rings","Clouds"],Riikka:["Pamela's","Disting","Batumi","Zularic"],
 Jussi:["Maths","Optomix","Wogglebug"],Aino:["Plaits"],
 Tero:["Marbles","Stages","Tides","Ripples","Veils","Links"]};
function D(n){var s=S.slice(0,n);return '<div class="wishband"><div class="bandhead"><h3>Toiveet</h3></div>'+
 s.map(function(p){var w=W[p[0]]||[],shown=w.slice(0,5),extra=w.length-shown.length;
  return '<a class="rowD" href="#" style="border-left:3px solid '+p[2]+'">'+
  '<div class="top"><i style="background:'+p[2]+'"></i><span class="n">'+p[0]+'</span>'+
  '<span class="c">'+p[1]+' kohdetta</span>'+
  '<span class="wants">'+shown.join('<span class="sep"> · </span>')+
  (extra>0?'<span class="more"> +'+extra+'</span>':'')+'</span>'+
  '<span class="lnk">Katso koko lista &rarr;</span></div></a>';}).join("")+
 '<div class="wishnote">Myös osavaihto + rahaa</div></div>';}

var defs=[
 ["D — wants inline as plain text, beside the name (your idea)",D,
  "The wants stay visible, which is the point of the section, but they start on the name's own line and flow into at most one more before truncating with +N. No rectangles: these sit directly above a bar full of filter chips, and a bordered pill here reads as another control rather than as something someone wants. One row per seller, so a ninth seller adds one line."],
 ["A — compact card, link in every card",A,
  "Closest to what is there now, and to the literal ask. But the link repeats per seller and every one goes to the same page — at eight sellers that is eight identical calls to action competing with the names."],
 ["B — compact card, one link for the section",B,
  "The link moves up beside the heading, where it reads as \\\"this section continues\\\" rather than eight separate invitations. Cards drop to a single line: dot, name, count. Scales without changing character."],
 ["C — one row of name chips",C,
  "Most compact by a wide margin and it keeps growing gracefully — a ninth seller just wraps. Loses the coloured left edge and the card surface, so Toiveet stops looking like the wish band and starts looking like another filter row, which is a real cost given it sits directly above the filter bar."]
];
var h="";
defs.forEach(function(d){
  h+='<h2>'+d[0]+'</h2>';
  h+='<div class="scale">three sellers — today</div><div class="stage">'+d[1](3)+'</div>';
  h+='<div class="scale">eight sellers — later</div><div class="stage">'+d[1](8)+'</div>';
  h+='<p class="cap">'+d[2]+'</p>';
});
document.getElementById('out').innerHTML=h;
</script>
</body></html>
