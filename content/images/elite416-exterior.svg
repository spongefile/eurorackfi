<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#333338"/>
      <stop offset="1" stop-color="#242428"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222226"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <radialGradient id="latch" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#4a4a4e"/>
      <stop offset="60%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </radialGradient>
  </defs>

  <!-- right side face (recedes up-right) -->
  <polygon points="340,320 340,140 480,70 480,250" fill="url(#side)"/>
  <!-- top face (recedes up-right) -->
  <polygon points="100,140 340,140 480,70 240,70" fill="url(#top)"/>
  <!-- front-left face -->
  <rect x="100" y="140" width="240" height="180" fill="url(#front)"/>

  <!-- ballistic-coating stipple, all three faces -->
  <g opacity=".10" fill="#ffffff">
    <circle cx="130" cy="170" r="1.3"/><circle cx="170" cy="210" r="1.3"/><circle cx="120" cy="260" r="1.3"/>
    <circle cx="200" cy="190" r="1.3"/><circle cx="250" cy="240" r="1.3"/><circle cx="300" cy="180" r="1.3"/>
    <circle cx="160" cy="290" r="1.3"/><circle cx="280" cy="290" r="1.3"/><circle cx="220" cy="150" r="1.3"/>
    <circle cx="370" cy="180" r="1.1"/><circle cx="410" cy="220" r="1.1"/><circle cx="440" cy="150" r="1.1"/>
    <circle cx="390" cy="280" r="1.1"/><circle cx="460" cy="200" r="1.1"/>
    <circle cx="160" cy="100" r="1.1"/><circle cx="260" cy="110" r="1.1"/><circle cx="360" cy="95" r="1.1"/>
  </g>

  <!-- edge outlines -->
  <g fill="none" stroke="#000" stroke-width="1.5" opacity=".7">
    <polygon points="340,320 340,140 480,70 480,250"/>
    <polygon points="100,140 340,140 480,70 240,70"/>
    <rect x="100" y="140" width="240" height="180"/>
  </g>

  <!-- edge rivets, front-left vertical seam -->
  <g fill="#0a0a0b">
    <circle cx="104" cy="160" r="2.2"/><circle cx="104" cy="200" r="2.2"/>
    <circle cx="104" cy="240" r="2.2"/><circle cx="104" cy="280" r="2.2"/><circle cx="104" cy="300" r="2.2"/>
  </g>

  <!-- top-face hardware: handle centred on the front-top edge, latches flanking it -->
  <g>
    <!-- latches: small twist/butterfly clasps -->
    <g>
      <ellipse cx="168" cy="122" rx="15" ry="10" fill="url(#latch)" stroke="#000" stroke-width="1"/>
      <rect x="160" y="116" width="16" height="4" rx="2" fill="#0a0a0b"/>
      <circle cx="168" cy="122" r="2" fill="#000"/>
    </g>
    <g>
      <ellipse cx="290" cy="112" rx="15" ry="10" fill="url(#latch)" stroke="#000" stroke-width="1"/>
      <rect x="282" y="106" width="16" height="4" rx="2" fill="#0a0a0b"/>
      <circle cx="290" cy="112" r="2" fill="#000"/>
    </g>
    <!-- ribbed carry handle -->
    <g>
      <rect x="196" y="98" width="14" height="16" rx="4" fill="#0a0a0b"/>
      <rect x="248" y="90" width="14" height="16" rx="4" fill="#0a0a0b"/>
      <path d="M202 100 Q230 66 256 92" fill="none" stroke="url(#handleGrad)" stroke-width="16" stroke-linecap="round"/>
      <g stroke="#000" stroke-width="1.4" opacity=".6" stroke-linecap="round">
        <path d="M212 92 q10 -18 20 -20"/>
        <path d="M222 90 q9 -16 18 -17"/>
        <path d="M232 90 q8 -13 15 -14"/>
      </g>
    </g>
  </g>

  <!-- embossed wordmark, right side face -->
  <text x="378" y="230" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-weight="800"
        font-size="15" letter-spacing="1.5" fill="#0e0e10" opacity=".8"
        transform="skewY(-25.9) scale(1,0.94)" transform-origin="378 230">ELITE</text>
</svg>
