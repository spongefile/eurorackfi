<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1c1f"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cbd2"/>
      <stop offset="1" stop-color="#8891a0"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b45"/>
      <stop offset="1" stop-color="#1c3a28"/>
    </linearGradient>
    <radialGradient id="latchTop" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9a9a9e"/>
      <stop offset="55%" stop-color="#5c5c60"/>
      <stop offset="100%" stop-color="#2a2a2d"/>
    </radialGradient>
  </defs>

  <!-- case shell, viewed face-on into the open cavity -->
  <rect x="24" y="30" width="552" height="340" rx="24" fill="#141416" stroke="#0a0a0b" stroke-width="2"/>

  <!-- corner protectors, top edge -->
  <g fill="#0a0a0b">
    <path d="M24 56 v-20 a20 20 0 0 1 20 -20 h20 v12 h-18 a9 9 0 0 0 -9 9 v19 z"/>
    <path d="M576 56 v-20 a20 20 0 0 0 -20 -20 h-20 v12 h18 a9 9 0 0 1 9 9 v19 z"/>
  </g>

  <!-- top-edge hardware: latch housings either side, twist-clasp centre -->
  <g>
    <rect x="86" y="26" width="30" height="16" rx="6" fill="#0a0a0b"/>
    <rect x="484" y="26" width="30" height="16" rx="6" fill="#0a0a0b"/>
    <circle cx="300" cy="32" r="13" fill="url(#latchTop)" stroke="#0a0a0b" stroke-width="1.5"/>
    <rect x="292" y="26" width="16" height="5" rx="2" fill="#3a3a40"/>
  </g>

  <!-- cavity: two angled side walls plus a flat back wall, suggesting depth -->
  <polygon points="54,58 130,80 130,320 54,342" fill="url(#wallL)"/>
  <polygon points="546,58 470,80 470,320 546,342" fill="url(#wallR)"/>
  <rect x="130" y="80" width="340" height="240" fill="url(#back)"/>

  <!-- interior stipple, matte lining -->
  <g opacity=".06" fill="#ffffff">
    <circle cx="160" cy="100" r="1.4"/><circle cx="220" cy="130" r="1.4"/><circle cx="380" cy="95" r="1.4"/>
    <circle cx="440" cy="140" r="1.4"/><circle cx="200" cy="290" r="1.4"/><circle cx="400" cy="285" r="1.4"/>
  </g>

  <!-- aluminium rail, full width, screws along it -->
  <rect x="66" y="176" width="468" height="20" rx="2" fill="url(#rail)" stroke="#6f7885" stroke-width="1"/>
  <g fill="#5a626e">
    <circle cx="82" cy="186" r="2.2"/><circle cx="130" cy="186" r="2.2"/><circle cx="178" cy="186" r="2.2"/>
    <circle cx="226" cy="186" r="2.2"/><circle cx="274" cy="186" r="2.2"/><circle cx="322" cy="186" r="2.2"/>
    <circle cx="370" cy="186" r="2.2"/><circle cx="418" cy="186" r="2.2"/><circle cx="466" cy="186" r="2.2"/>
    <circle cx="514" cy="186" r="2.2"/>
  </g>

  <!-- power distribution PCB, mounted just below the rail, near full width -->
  <rect x="80" y="196" width="440" height="60" rx="3" fill="url(#pcb)" stroke="#0f2a1c" stroke-width="1.5"/>
  <!-- header pin row along the PCB's top edge -->
  <g fill="#c9a13b">
    <rect x="92" y="196" width="14" height="7"/><rect x="112" y="196" width="14" height="7"/>
    <rect x="132" y="196" width="14" height="7"/><rect x="152" y="196" width="14" height="7"/>
    <rect x="172" y="196" width="14" height="7"/><rect x="192" y="196" width="14" height="7"/>
    <rect x="212" y="196" width="14" height="7"/><rect x="232" y="196" width="14" height="7"/>
    <rect x="252" y="196" width="14" height="7"/><rect x="272" y="196" width="14" height="7"/>
    <rect x="292" y="196" width="14" height="7"/><rect x="312" y="196" width="14" height="7"/>
    <rect x="332" y="196" width="14" height="7"/><rect x="352" y="196" width="14" height="7"/>
    <rect x="372" y="196" width="14" height="7"/><rect x="392" y="196" width="14" height="7"/>
    <rect x="412" y="196" width="14" height="7"/><rect x="432" y="196" width="14" height="7"/>
    <rect x="452" y="196" width="14" height="7"/><rect x="472" y="196" width="14" height="7"/>
  </g>
  <!-- trace lines + mounting holes -->
  <g stroke="#5a9c72" stroke-width="1" opacity=".6" fill="none">
    <path d="M100 220 h60 v20"/>
    <path d="M240 214 h80"/>
    <path d="M380 220 h60 v24"/>
  </g>
  <g fill="#0f2a1c">
    <circle cx="94" cy="248" r="3"/><circle cx="506" cy="248" r="3"/>
  </g>

  <!-- DC input / fuse module, bottom-left, with its lead dressed up to the rail -->
  <rect x="66" y="268" width="30" height="26" rx="3" fill="#1c1c1f" stroke="#0a0a0b" stroke-width="1.5"/>
  <circle cx="81" cy="278" r="5" fill="#0a0a0b"/>
  <path d="M81 268 q-14 -30 20 -56" fill="none" stroke="#8891a0" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <!-- bottom-edge hardware -->
  <g fill="#0a0a0b">
    <rect x="150" y="336" width="16" height="10" rx="2"/>
    <rect x="290" y="336" width="16" height="10" rx="2"/>
    <rect x="430" y="336" width="16" height="10" rx="2"/>
  </g>
</svg>
