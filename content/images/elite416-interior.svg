<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece5d1"/>
      <stop offset="1" stop-color="#d8ceb3"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b1b9c5"/>
      <stop offset="1" stop-color="#8891a0"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5a3f"/>
      <stop offset="1" stop-color="#1c3a28"/>
    </linearGradient>
  </defs>

  <rect x="30" y="60" width="540" height="300" rx="26" fill="#141416" stroke="#0a0a0b" stroke-width="2"/>

  <!-- birch ply interior walls -->
  <rect x="50" y="80" width="500" height="260" rx="12" fill="url(#ply)"/>
  <g stroke="#a67e4c" stroke-width="1" opacity=".55">
    <line x1="50" y1="86" x2="550" y2="86"/>
    <line x1="50" y1="90" x2="550" y2="90"/>
    <line x1="50" y1="330" x2="550" y2="330"/>
    <line x1="50" y1="334" x2="550" y2="334"/>
  </g>
  <!-- ply edge laminate lines along the left wall -->
  <g stroke="#a67e4c" stroke-width="1.5" opacity=".5">
    <line x1="56" y1="86" x2="56" y2="334"/>
    <line x1="60" y1="86" x2="60" y2="334"/>
    <line x1="64" y1="86" x2="64" y2="334"/>
  </g>

  <!-- power rails, top and bottom -->
  <rect x="66" y="98" width="468" height="16" rx="3" fill="url(#rail)" stroke="#6f7885" stroke-width="1"/>
  <g fill="#6f7885">
    <circle cx="80" cy="106" r="2"/><circle cx="120" cy="106" r="2"/><circle cx="160" cy="106" r="2"/>
    <circle cx="200" cy="106" r="2"/><circle cx="240" cy="106" r="2"/><circle cx="280" cy="106" r="2"/>
    <circle cx="320" cy="106" r="2"/><circle cx="360" cy="106" r="2"/><circle cx="400" cy="106" r="2"/>
    <circle cx="440" cy="106" r="2"/><circle cx="480" cy="106" r="2"/><circle cx="520" cy="106" r="2"/>
  </g>
  <rect x="66" y="304" width="468" height="16" rx="3" fill="url(#rail)" stroke="#6f7885" stroke-width="1"/>
  <g fill="#6f7885">
    <circle cx="80" cy="312" r="2"/><circle cx="120" cy="312" r="2"/><circle cx="160" cy="312" r="2"/>
    <circle cx="200" cy="312" r="2"/><circle cx="240" cy="312" r="2"/><circle cx="280" cy="312" r="2"/>
    <circle cx="320" cy="312" r="2"/><circle cx="360" cy="312" r="2"/><circle cx="400" cy="312" r="2"/>
    <circle cx="440" cy="312" r="2"/><circle cx="480" cy="312" r="2"/><circle cx="520" cy="312" r="2"/>
  </g>

  <!-- power distribution PCB, mounted lower-left -->
  <g>
    <rect x="80" y="200" width="150" height="86" rx="4" fill="url(#pcb)" stroke="#0f2419" stroke-width="1.5"/>
    <!-- trace lines -->
    <g stroke="#4a7a5c" stroke-width="1" opacity=".7" fill="none">
      <path d="M92 214 h40 v14 h20"/>
      <path d="M92 236 h60"/>
      <path d="M92 258 h30 v10 h50"/>
      <path d="M210 220 v40"/>
    </g>
    <!-- mounting holes -->
    <g fill="#0f2419">
      <circle cx="90" cy="208" r="3"/><circle cx="220" cy="208" r="3"/>
      <circle cx="90" cy="278" r="3"/><circle cx="220" cy="278" r="3"/>
    </g>
    <!-- header connectors along the top edge -->
    <g fill="#c9a13b">
      <rect x="100" y="200" width="18" height="8"/>
      <rect x="128" y="200" width="18" height="8"/>
      <rect x="156" y="200" width="18" height="8"/>
      <rect x="184" y="200" width="18" height="8"/>
    </g>
    <!-- a couple of small capacitors -->
    <circle cx="150" cy="250" r="9" fill="#1c1c1f" stroke="#3d3d43" stroke-width="1"/>
    <circle cx="180" cy="250" r="9" fill="#1c1c1f" stroke="#3d3d43" stroke-width="1"/>
  </g>

  <!-- ribbon cable stub running off the PCB toward the rail -->
  <path d="M150 200 q0 -35 60 -46" fill="none" stroke="#8891a0" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M150 200 q0 -35 60 -46" fill="none" stroke="#c9a13b" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>

  <!-- corner protectors, matching the exterior view -->
  <g fill="#0a0a0b">
    <path d="M30 86 v-26 a26 26 0 0 1 26 -26 h26 v14 h-24 a12 12 0 0 0 -12 12 v26 z"/>
    <path d="M570 86 v-26 a26 26 0 0 0 -26 -26 h-26 v14 h24 a12 12 0 0 1 12 12 v26 z"/>
  </g>
</svg>
