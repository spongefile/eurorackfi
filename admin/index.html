<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>eurorack.fi — content admin</title>
  <style>body{margin:0;font-family:system-ui,sans-serif}</style>
</head>
<body>
  <script>
  /* MOBILE LOGIN LANDS HERE, in this tab, rather than in a popup.
     Decap's GitHub login is a popup handshake: the popup posts the token
     back to the tab that opened it. On a phone there is frequently no such
     tab — the browser opens a tab instead of a popup, and GitHub's own
     pages send Cross-Origin-Opener-Policy — so window.opener is null, the
     handshake throws, and the login dead-ends on a page claiming it will
     close itself. The worker now detects that and sends the browser back
     here with a ONE-TIME CODE in the fragment instead.

     This runs BEFORE decap-cms.js on purpose. Decap reads its stored
     session once, at startup, so the session has to be in place before the
     bundle loads — hence the script is injected by hand below rather than
     sitting in a <script src> tag that would race it.

     The code is exchanged for the token over HTTPS and the fragment is
     stripped immediately. The token is never in the URL: a fragment
     survives in browser history, and a GitHub token with repo scope must
     not. */
  (function () {
    var WORKER = "https://eurorackfi-cms-auth.aspiala.workers.dev";
    /* Verified against decap-cms@3's own source rather than assumed: the
       auth store is localStorage["decap-cms-user"], JSON, and currentUser()
       only restores an entry whose backendName matches the configured
       backend. token + backendName is all restoreUser needs; it fetches the
       rest from GitHub itself. */
    var STORE_KEY = "decap-cms-user";

    function loadCms() {
      var s = document.createElement("script");
      s.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
      s.onload = registerWidgets;
      document.body.appendChild(s);
    }

    /* "urlbutton": a string field with an Open link beside it, for the two
       URL fields the admin otherwise has to copy-paste into a new tab
       (seller link, seller's own form). Registered in onload — after the
       bundle evaluates, before the editor renders any field. createClass
       and h are decap's own compat globals for exactly this. */
    function registerWidgets() {
      if (!window.CMS || !window.createClass || !window.h) return;
      var Control = createClass({
        handleChange: function (e) { this.props.onChange(e.target.value); },
        render: function () {
          var value = this.props.value || "";
          var openable = /^https?:\/\//i.test(value);
          return h("div", { style: { display: "flex", gap: "8px", alignItems: "stretch" } },
            h("input", {
              type: "text",
              id: this.props.forID,
              className: this.props.classNameWrapper,
              value: value,
              onChange: this.handleChange,
              style: { flex: "1 1 auto" }
            }),
            /* a disabled-looking span when empty/not-a-URL, a real link
               otherwise — never a button that silently does nothing */
            openable
              ? h("a", {
                  href: value, target: "_blank", rel: "noopener noreferrer",
                  style: { flex: "0 0 auto", display: "flex", alignItems: "center",
                    padding: "0 14px", background: "#798291", color: "#fff",
                    borderRadius: "5px", textDecoration: "none", fontSize: "14px" }
                }, "Avaa →")
              : h("span", {
                  style: { flex: "0 0 auto", display: "flex", alignItems: "center",
                    padding: "0 14px", background: "#eff0f4", color: "#b3b9c4",
                    borderRadius: "5px", fontSize: "14px" }
                }, "Avaa →")
          );
        }
      });
      CMS.registerWidget("urlbutton", Control);
    }

    var m = /[#&]erfi_login=([^&]+)/.exec(location.hash || "");
    if (!m) { loadCms(); return; }

    var code = decodeURIComponent(m[1]);
    /* Cleared before the network call, not after: if anything below fails,
       a reload must not retry a code that has already been spent. */
    history.replaceState(null, "", location.pathname + location.search);

    fetch(WORKER + "/api/login-exchange", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.token) {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify({ token: d.token, backendName: "github" }));
          } catch (e) { /* private mode: fall through to the normal login screen */ }
        }
      })
      /* ALWAYS loads the CMS, whatever happened. A failed exchange should
         leave the ordinary "Login with GitHub" screen, which still works —
         never a blank page, which is the failure this whole change exists
         to remove. */
      .catch(function () {})
      .then(loadCms);
  })();
  </script>
</body>
</html>
