backend:
  name: github
  repo: spongefile/eurorackfi
  branch: main
  base_url: https://eurorackfi-cms-auth.aspiala.workers.dev
  auth_endpoint: auth

# Not wired to a Decap media library on purpose — img stays a plain URL
# string, same shape the secretary and the manual composer already produce
# (manufacturer photo, or a self-hosted ModularGrid fallback under
# content/images/). Switching to a real upload widget is a later step,
# not an oversight now.
media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "items"
    label: "Listings"
    folder: "content/items"
    create: true
    delete: true
    identifier_field: id
    format: json
    # The list view otherwise shows just the raw id (e.g. "neotrellis"),
    # with no way to tell whose listing is whose at a glance. summary adds
    # the owner to every row; view_groups splits the whole list by owner
    # so "my stuff" is one click away. Grouping by the who field itself
    # (not a hardcoded per-seller filter) means a new seller added later
    # gets their own group automatically, same as everywhere else in this
    # site a new seller needs zero further config.
    summary: "{{fields.mfr}} {{fields.name}} — {{fields.who}}"
    view_groups:
      - label: "Owner"
        field: who
    fields:
      # The two switches used most often, so they sit first rather than
      # below every photo and credit field. Both are the kind of edit
      # made repeatedly on an item that already exists.
      - { label: "In negotiation", name: "negotiating", widget: "boolean", required: false, default: false, hint: "Set by hand after a real Buying/Trading message arrives — never for a generic question. Leave off for shop items below — there's no message thread to negotiate in." }
      - { label: "Hidden", name: "hidden", widget: "boolean", required: false, default: false, hint: "Removes this listing from the live site — grid, rack, counts, everything — without deleting it. Use this instead of Delete when a sale falls through or a piece might come back up for sale later: the entry, its photos and any history stay right here, just switch this off again to relist." }
      - { label: "Open to offers", name: "haggle", widget: "boolean", required: false, default: false, hint: "Puts a red \"Saa tinkiä\" sticker on the photo and a line under the price. This is a separate thing from the two above, not a third state — an item can be in negotiation and still open to offers." }
      - { label: "ID", name: "id", widget: "string", hint: "short, lowercase, no spaces — e.g. ph3, bf22. Matches the filename." }
      - { label: "Maker", name: "mfr", widget: "string" }
      - { label: "Model", name: "name", widget: "string" }
      - { label: "Price (€)", name: "price", widget: "number", value_type: "int" }
      - { label: "HP (0 if standalone)", name: "hp", widget: "number", value_type: "int", default: 0 }
      - label: "Format"
        name: "fmt"
        widget: "select"
        options:
          - { label: "Eurorack", value: "eu" }
          - { label: "Standalone / desktop", value: "desk" }
          - { label: "Accessories", value: "acc" }
          - { label: "Other stuff", value: "tools" }
      - label: "Owner"
        name: "who"
        widget: "relation"
        collection: "sellers"
        search_fields: ["name"]
        value_field: "key"
        display_fields: ["name"]
        hint: "Pick from the Sellers list. To add a brand-new seller, create them under Sellers first, then come back here."
      - label: "Primary category"
        name: "cat"
        widget: "select"
        options:
          - { label: "Oscillator", value: "Oscillator" }
          - { label: "Filter", value: "Filter" }
          - { label: "Sequencing", value: "Sequencer" }
          - { label: "Modulation", value: "Modulation" }
          - { label: "Waveshaping", value: "Waveshaper" }
          - { label: "Sampling", value: "Sampler" }
          - { label: "Synths", value: "Synth" }
          - { label: "Effects", value: "FX" }
          - { label: "Out & mixing", value: "Output" }
          - { label: "Control", value: "Controller" }
          - { label: "Other", value: "Other" }
        hint: "Must match one of the site's TYPE filter chips exactly — this drives which chip the listing shows under."
      - { label: "Category tags", name: "cats", widget: "list" }
      - label: "Description"
        name: "blurb"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "text" }
          - { label: "Finnish", name: "fi", widget: "text", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead." }
          - { label: "Swedish", name: "sv", widget: "text", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead." }
      - { label: "ModularGrid slug", name: "mgSlug", widget: "string", required: false }
      - { label: "Manufacturer domain", name: "site", widget: "string", required: false }
      - label: "Panel tone"
        name: "tone"
        widget: "select"
        options: ["black", "alu", "white", "cream", "wood"]
      - label: "Parts (drives the drawn faceplate)"
        name: "parts"
        widget: "object"
        fields:
          - { label: "Knobs", name: "k", widget: "number", value_type: "int", default: 0 }
          - { label: "Jacks", name: "j", widget: "number", value_type: "int", default: 0 }
          - { label: "Sliders", name: "sl", widget: "number", value_type: "int", default: 0 }
          - { label: "LEDs", name: "led", widget: "number", value_type: "int", default: 0 }
          - { label: "Has screen (1 or 0)", name: "sc", widget: "number", value_type: "int", default: 0 }
      - { label: "Photo URL", name: "img", widget: "string", required: false, hint: "Manufacturer's own photo first. ModularGrid only as a self-hosted fallback — never hotlink modulargrid.net." }
      - { label: "Second photo URL (back)", name: "img2", widget: "string", required: false, hint: "Optional. Shows as a second slot in the photo switcher, alongside the first photo and the drawn faceplate." }
      - { label: "Third photo URL (in the rack)", name: "img3", widget: "string", required: false, hint: "Optional — shows as a third switcher slot. Works fine even if the second photo is left blank." }
      - { label: "Photo is a self-hosted ModularGrid fallback", name: "imgIsModularGrid", widget: "boolean", required: false, default: false }
      - { label: "Photo is of a DIY component, not the finished build", name: "imgIsComponent", widget: "boolean", required: false, default: false }
      - { label: "Photo is the seller's own, not the manufacturer's", name: "imgIsOwn", widget: "boolean", required: false, default: false, hint: "Check this when you took the photo yourself — otherwise the credit line says it came from the manufacturer's site, which would be wrong." }
      - { label: "Shop checkout URL", name: "shopUrl", widget: "string", required: false, hint: "Only for items bought straight from a webshop, not traded. Set this and the site swaps the whole Buy/message flow for a plain \"Buy\" button that links straight out to this URL — no in-site message form, no trade panel. Leave blank for every normal listing." }

  - name: "sellers"
    label: "Sellers"
    folder: "content/sellers"
    create: true
    delete: true
    identifier_field: name
    format: json
    fields:
      - { label: "Key", name: "key", widget: "string", hint: "short, lowercase, no spaces — e.g. t, f, sampo2. Referenced by listings' Owner field. Never change this once listings reference it or their link to this seller breaks." }
      - { label: "Display name", name: "name", widget: "string" }
      - label: "Dot color"
        name: "dot"
        widget: "color"
        allowInput: true
        enableAlpha: false
        default: "#2E77C9"
        hint: "Pick a color not already used by another seller, so cards stay easy to tell apart at a glance."
      # Holds only the /token/<key> URL, never the token itself: this file
      # is fetched by every visitor's browser, and the repo is public, so a
      # token written here would be world-readable and anyone could hide
      # anyone's listings. The URL is useless without the collaborator
      # check behind it.
      - { label: "Seller link", name: "tokenUrl", widget: "string", required: false, hint: "Private link that lets this seller mark their own items sold and change their prices. Anyone who has it can change that seller's listings — send it to them directly, do not post it anywhere. Open the URL yourself to see and copy their link, to email it straight to them, or to regenerate it if it leaks. Their email address is entered on that page, not here \u2014 this file is public, so an address written here would be readable by anyone and stay in the history even if removed." }
      - { label: "Own message form (optional)", name: "form", widget: "string", required: false, hint: "Where buyers reach this seller — THE SELLER MAKES IT AND OWNS IT, and just sends you the URL. A Tally form with email notifications on, or honestly any page they can be contacted on, including their own site's contact page. Leave blank and enquiries go to the shared form, which is fine. ASK THEM TO PUT A \"WHICH MODULE?\" QUESTION ON IT — we cannot prefill a form we did not build, so without that the seller gets an enquiry that never says which item it is about. That is exactly what happened to Kalle's and Kari's listings. The site does its half: every listing with a seller form tells the buyer the module name to quote. A tally.so URL opens inside the site; anything else opens in a new tab, because other sites refuse to be embedded. Never put an email address in this field — this file is fetched by every visitor's browser, so anything written in it is public. The seller's address belongs on their token page, not here." }
      # OFF unless someone has LOOKED. Prefill parameters are matched by
      # field NAME, so they only work on a form built to receive them.
      # Kalle's and Kari's had none, and every enquiry about their listings
      # arrived without saying which item it was about. Ticking this
      # without checking recreates exactly that, silently.
      - { label: "Their form has our hidden fields", name: "formFields", widget: "boolean", required: false, default: false, hint: "Tick ONLY after opening their form and seeing four hidden fields named module, seller, price and lang. Leave off if you have not looked, and off is the right answer for anyone who built their own form without them. Either way the listing still tells the buyer to name the module, so an enquiry is never anonymous — this only decides whether the module, price and language are also filled in automatically." }
      - label: "Wishlist"
        name: "wants"
        widget: "list"
        required: false
        hint: "What this seller is looking for in trade. Drag entries by the handle to reorder — the home page only shows the first 5, so put what you want most at the top. The full list, in the same order, always shows on the Toiveet page. Pick \"Real product\" only if you know the actual panel — knob/jack/LED counts and panel color, counted off a real photo — it draws an accurate faceplate on the site, same as a listing. Otherwise use \"Just a note\" for a plain placeholder like \"quad VCA\" — never guess panel details."
        types:
          - label: "Real product"
            name: "product"
            widget: "object"
            fields:
              # Sellers set this themselves from their own page; it appears
              # here so the state is visible and correctable in one place.
              # Safe to edit by hand — the reconcile job only rewrites an
              # entry when the seller's live choice actually differs.
              - { label: "Hidden", name: "hidden", widget: "boolean", required: false, default: false, hint: "Hides this want everywhere on the site. Sellers can set this themselves on their own page — usually because they've now got one." }
              - { label: "Maker", name: "mfr", widget: "string" }
              - { label: "Model", name: "name", widget: "string" }
              - { label: "HP", name: "hp", widget: "number", value_type: "int", default: 0 }
              - { label: "Photo URL", name: "img", widget: "string", required: false, hint: "A real photo, manufacturer's own site first. Leave blank to draw a faceplate from the fields below instead — a drawing is only a fallback for when a real photo isn't available." }
              - label: "Panel tone"
                name: "tone"
                widget: "select"
                options: ["black", "alu", "white", "cream", "wood"]
              - label: "Parts (drives the drawn faceplate)"
                name: "parts"
                widget: "object"
                fields:
                  - { label: "Knobs", name: "k", widget: "number", value_type: "int", default: 0 }
                  - { label: "Jacks", name: "j", widget: "number", value_type: "int", default: 0 }
                  - { label: "Sliders", name: "sl", widget: "number", value_type: "int", default: 0 }
                  - { label: "LEDs", name: "led", widget: "number", value_type: "int", default: 0 }
                  - { label: "Has screen (1 or 0)", name: "sc", widget: "number", value_type: "int", default: 0 }
          - label: "Just a note"
            name: "placeholder"
            widget: "object"
            fields:
              - { label: "Hidden", name: "hidden", widget: "boolean", required: false, default: false, hint: "Hides this want everywhere on the site. Sellers can set this themselves on their own page." }
              - { label: "Text", name: "text", widget: "string", hint: "e.g. \"quad VCA\" or \"drum module\"." }

  - name: "faq"
    label: "FAQ"
    files:
      - name: "faq"
        label: "FAQ"
        file: "content/faq.json"
        fields:
          - label: "Questions"
            name: "questions"
            widget: "list"
            hint: "Order is editorial, not chronological or alphabetical — it runs stranger to participant (what is this → why not Tori/Reverb/eBay → who are you → can I list here too). Drag entries by the handle to set that order; the page reads them top to bottom in the same order."
            fields:
              - { label: "Slug", name: "id", widget: "string", hint: "Short, lowercase, hyphenated — e.g. what-is-this, can-i-join. Becomes the page anchor other pages and messages link to directly. Keep it stable once set, even if the question's wording changes later — it's an address, not a title." }
              - label: "Question"
                name: "q"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Finnish", name: "fi", widget: "string", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead." }
                  - { label: "Swedish", name: "sv", widget: "string", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead." }
              - label: "Answer"
                name: "a"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text", hint: "Plain text, no markdown — no headings, lists or bold. Leave a blank line between paragraphs; the page splits on it. A bare URL (https://...) becomes a link automatically." }
                  - { label: "Finnish", name: "fi", widget: "text", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead. Same plain-text, blank-line-paragraph rule as English." }
                  - { label: "Swedish", name: "sv", widget: "text", required: false, hint: "Leave blank rather than guess — the site shows an honest missing-translation banner instead. Same plain-text, blank-line-paragraph rule as English." }

  # Site copy — the prose strings in index.html's T object, editable in
  # admin. Every field is optional: a blank field means "keep the
  # built-in text", because index.html bundles the same strings as its
  # fallback and only overrides from this file key by key (applyUi).
  # Structural strings stay out of here on purpose — nav labels (order
  # is coupled to routing), format/category/sort names (keys are data
  # values) — so a copy edit can never break navigation or filtering.
  - name: "ui"
    label: "Site copy"
    files:
      - name: "ui"
        label: "Site copy"
        file: "content/ui.json"
        fields:
          - label: "Eyebrow (small line above the headline)"
            name: "eyebrow"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Headline, part 1"
            name: "h1a"
            widget: "object"
            hint: "The headline is three pieces joined together; the middle piece renders in the accent colour. Mind the trailing space."
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Headline, part 2 (the coloured word)"
            name: "h1b"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Headline, part 3 (usually the full stop)"
            name: "h1c"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Front-page lede"
            name: "lede"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Rack caption, left"
            name: "scale"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Rack caption, right"
            name: "hover"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Search box placeholder"
            name: "search"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Wishlist page title"
            name: "wishH"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Wishlist note (partial trades line)"
            name: "wishK"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Empty wishlist message"
            name: "noWishes"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Wishlist tile lead-in (before the module names)"
            name: "swapFor"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Empty state: Other stuff tab"
            name: "emptyTools"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Empty state: no filter matches"
            name: "emptyNone"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Contact button label"
            name: "buyOrTrade"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer intro"
            name: "fIntro"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 1 heading"
            name: "fCollect"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 1 text"
            name: "fCollectBody"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 2 heading"
            name: "fTrade"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 2 text"
            name: "fTradeBody"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 3 heading"
            name: "fContact"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Footer column 3 text"
            name: "fContactBody"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "FAQ page lede"
            name: "faqLede"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "FAQ tail line (before the message link)"
            name: "faqTail"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "FAQ tail link text"
            name: "faqTailLink"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }

  # Generated from content/how.json — see scripts/check-how.mjs, which fails
  # if this config and that file ever disagree. THAT CHECK IS LOAD-BEARING:
  # Decap writes back only the fields it is told about, so a key present in
  # the JSON but missing here is silently DELETED the first time this file
  # is published from admin.
  - name: "how"
    label: "How this works page"
    files:
      - name: "how"
        label: "How this works page"
        file: "content/how.json"
        fields:
          # kept so publishing from admin does not strip it
          - { label: "_comment", name: "_comment", widget: "hidden" }
          # kept so publishing from admin does not strip it
          - { label: "_liveComment", name: "_liveComment", widget: "hidden" }
          - label: "Languages this page is public in"
            name: "live"
            widget: "select"
            multiple: true
            options: ["en", "fi", "sv"]
            default: ["en"]
            hint: "A language appears on the site only if it is ticked here AND fully written. ALWAYS LEAVE ENGLISH TICKED — every other language falls back to it. Ticking a language publishes that whole language at once, so read it through first."
          - label: "Eyebrow (small line above the title)"
            name: "eyebrow"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Page title"
            name: "title"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Finnish", name: "fi", widget: "string", required: false }
              - { label: "Swedish", name: "sv", widget: "string", required: false }
          - label: "Lede (the sentence under the title)"
            name: "lede"
