<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
  <style>
    body { margin:0; }
    .rt{
      --bg:#E9EAE6; --bg2:#DFE2DC; --panel:#FBFBF9; --panel2:#F2F3EF;
      --ink:#14171A; --ink2:#3D4548; --muted:#6B7276;
      --line:#CFD3CC; --line2:#B6BCB4;
      --accent:#0B6E67; --accent-hi:#095A54; --accent-soft:#D8E8E5;
      --signal:#A96B06; --signal-soft:#F5E7CA;
      --rail:#B4B9B2; --rail-ink:#8D938B;
      --sold:#8A3E3E; --sold-soft:#F0DDDA;
      --shadow:0 1px 2px rgba(20,23,26,.06),0 8px 24px -12px rgba(20,23,26,.18);
      --on:#FBFBF9;
    }
    .rt.blue{
      --bg:#E7EBF0; --bg2:#DCE2EA; --panel:#FAFBFD; --panel2:#EFF3F8;
      --ink:#0F1722; --ink2:#36435A; --muted:#6A7789;
      --line:#CAD3DF; --line2:#AFBACB;
      --accent:#0B4F9E; --accent-hi:#083B77; --accent-soft:#D6E3F5;
      --signal:#A9660A; --signal-soft:#F5E6C8;
      --rail:#B1B9C5; --rail-ink:#8891A0;
      --sold:#8A3E4E; --sold-soft:#F0DAE0;
      --shadow:0 1px 2px rgba(15,23,34,.07),0 8px 24px -12px rgba(15,23,34,.22);
      --on:#FAFBFD;
    }
    .rt.dark{
      --bg:#101312; --bg2:#171B1A; --panel:#1B201F; --panel2:#222827;
      --ink:#E9ECE8; --ink2:#C3C9C5; --muted:#8C948F;
      --line:#2A312F; --line2:#3B4340;
      --accent:#3FBFAE; --accent-hi:#7FE0D2; --accent-soft:#12312E;
      --signal:#E0AC53; --signal-soft:#2C2314;
      --rail:#343A38; --rail-ink:#4A524E;
      --sold:#D98A85; --sold-soft:#33211F;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
      --on:#0B0F0E;
    }
    @media (prefers-color-scheme:dark){
      .rt.blue:not(.light){
        --bg:#0C1119; --bg2:#121924; --panel:#161E2A; --panel2:#1D2634;
        --ink:#E6ECF4; --ink2:#BEC9D8; --muted:#8590A1;
        --line:#252F3C; --line2:#364253;
        --accent:#5AA9F0; --accent-hi:#93C8FB; --accent-soft:#0D2A47;
        --signal:#E0AC53; --signal-soft:#2C2314;
        --rail:#323A46; --rail-ink:#47515F;
        --sold:#D98A93; --sold-soft:#331F24;
        --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.75);
        --on:#08111A;
      }
    }
    .rt.blue.dark{
      --bg:#0C1119; --bg2:#121924; --panel:#161E2A; --panel2:#1D2634;
      --ink:#E6ECF4; --ink2:#BEC9D8; --muted:#8590A1;
      --line:#252F3C; --line2:#364253;
      --accent:#5AA9F0; --accent-hi:#93C8FB; --accent-soft:#0D2A47;
      --signal:#E0AC53; --signal-soft:#2C2314;
      --rail:#323A46; --rail-ink:#47515F;
      --sold:#D98A93; --sold-soft:#331F24;
      --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.75);
      --on:#08111A;
    }
    .rt *{box-sizing:border-box}
    .rt{
      background:var(--bg); color:var(--ink);
      font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
      font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased;
    }
    .rt h1,.rt h2,.rt h3,.rt h4{margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.015em; line-height:1.12}
    .rt p{margin:0}
    .rt a{color:var(--accent); text-decoration:none}
    .rt a:hover{color:var(--accent-hi)}
    :where(.rt button){font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}
    .jack{width:.58em; height:.58em; display:inline-block; vertical-align:-.015em; margin-left:.07em; margin-right:0; transform:translate(var(--jack-nudge, -.016em), var(--jack-nudge-y, .015em))}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
    .wrap{width:min(1160px,100% - 3rem); margin-inline:auto}

    .rail{height:9px; background:var(--rail); position:relative; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2)}
    .rail::after{content:""; position:absolute; inset:0;
      background-image:radial-gradient(circle at 5px 4px, var(--rail-ink) 0 1.6px, transparent 1.7px);
      background-size:25.4px 100%; opacity:.85}

    .notice{background:var(--signal-soft); color:var(--signal); border-bottom:1px solid var(--line);
      font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.04em; padding:.5rem 0}
    .notice .wrap{display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap}
    .notice b{color:var(--ink)}

    .site{padding:1.15rem 0; border-bottom:1px solid var(--line); background:var(--bg)}
    .site .wrap{display:flex; align-items:center; gap:1.25rem}
    .brand{display:flex; align-items:baseline; gap:.5rem; text-decoration:none; color:var(--ink)}
    .brand .mark{font-weight:800; font-size:1.15rem; letter-spacing:-.03em}
    .brand .dot{color:var(--accent)}
    .brand .tag{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase}
    .langsw{display:flex; border:1px solid var(--line2); background:var(--panel); margin-left:1rem}
    .lang{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.06em; padding:.34rem .55rem; color:var(--muted); border-right:1px solid var(--line2); min-height:32px; cursor:pointer}
    .lang:last-child{border-right:none}
    .lang:hover{color:var(--accent)}
    .lang[aria-pressed="true"]{background:var(--accent); color:var(--on)}
    .lang[aria-pressed="true"]:hover{background:var(--accent-hi); color:var(--on)}
    .top{margin-left:auto; display:flex; gap:1.4rem; align-items:center}
    .top a{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink2); letter-spacing:.03em; padding-bottom:2px; border-bottom:1px solid transparent}
    .top a:hover{color:var(--accent); border-color:var(--accent)}

    .hero{padding:3.5rem 0 2.75rem; border-bottom:1px solid var(--line)}
    .hero .wrap{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:3rem; align-items:center}
    .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem}
    .hero h1{font-size:3.1rem; letter-spacing:-.035em; font-stretch:96%}
    .hero h1 em{font-style:normal; color:var(--accent)}
    .lede{font-family:"Newsreader",Georgia,serif; font-size:1.12rem; line-height:1.55; color:var(--ink2); margin-top:1.1rem; max-width:38ch}
    .stats{display:flex; gap:1.75rem; margin-top:1.75rem; flex-wrap:wrap}
    .stat .n{font-family:"IBM Plex Mono",monospace; font-size:1.5rem; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
    .stat .l{font-family:"IBM Plex Mono",monospace; font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-top:.15rem}

    .rackfig{margin:0}
    .rackfig figcaption{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-top:.7rem; letter-spacing:.03em; display:flex; justify-content:space-between; gap:1rem}
    .rackcredit{font-family:"IBM Plex Mono",monospace; font-size:.64rem; color:var(--muted); margin:.35rem 0 0; text-align:right}
    .rackcredit a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}
    .rackcredit a:hover{color:var(--accent)}
    .rackbox{background:var(--bg2); border:1px solid var(--line); padding:10px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px}
    .rackrow{display:flex; align-items:stretch}
    .rackrow .mod{position:relative; cursor:pointer; border-right:1px solid rgba(0,0,0,.35)}
    .rackrow .mod:last-child{border-right:none}
    .rackrow .mod .hit{position:absolute; inset:0; background:var(--accent); opacity:0}
    .rackrow .mod:hover .hit{opacity:.22}
    .rackrow .blank{background:repeating-linear-gradient(135deg,#9aa09b 0 3px,#8e948f 3px 6px); opacity:.5}

    .controls{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
    .crow{display:flex; gap:.75rem; align-items:center; padding:.85rem 0 0; flex-wrap:wrap}
    .crow.b{padding:.75rem 0 .85rem; margin-top:.1rem; border-top:1px solid var(--line)}
    .search{display:flex; align-items:center; gap:.5rem; background:var(--panel); border:1px solid var(--line2); padding:.42rem .7rem; min-width:220px; flex:0 1 300px}
    .search input{border:none; background:none; outline:none; font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--ink); width:100%}
    .search input::placeholder{color:var(--muted)}
    .chips{display:flex; gap:.35rem; flex-wrap:wrap}
    .chip{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.02em; padding:.32rem .6rem; border:1px solid var(--line2); color:var(--ink2); background:var(--panel); white-space:nowrap}
    .chip:hover{border-color:var(--accent); color:var(--accent)}
    .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on)}
    .chip[aria-pressed="true"]:hover{background:var(--accent-hi); border-color:var(--accent-hi); color:var(--on)}
    .chip.trade[aria-pressed="true"]{background:var(--signal); border-color:var(--signal); color:var(--on)}
    .chip .c{opacity:.55; margin-left:.35rem; font-size:.66rem}
    .chip.faint{color:var(--muted); border-style:dashed}
    .chip.faint:hover{color:var(--accent); border-color:var(--accent)}
    .chip.faint[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); border-style:solid; color:var(--on)}
    .chip.faint[aria-pressed="true"]:hover{background:var(--accent-hi); border-color:var(--accent-hi); color:var(--on)}
    .sep{width:1px; align-self:stretch; background:var(--line); margin:0 .15rem}
    .sortsel{font-family:"IBM Plex Mono",monospace; font-size:.72rem; padding:.32rem .5rem; background:var(--panel); border:1px solid var(--line2); color:var(--ink2); margin-left:auto}

    .main{padding:2.25rem 0 3rem}
    .count{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--muted); letter-spacing:.04em; margin-bottom:1.1rem; display:flex; gap:.8rem; align-items:baseline}
    .count b{color:var(--ink); font-weight:500}
    .grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1.25rem}
    .grid.compact{grid-template-columns:repeat(5,minmax(0,1fr)); gap:.85rem}
    .card{background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; padding:0; transition:border-color .15s, transform .15s, box-shadow .15s}
    .card:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:var(--shadow)}
    .shot{height:210px; background:var(--bg2); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:center; padding:14px 10px; position:relative; overflow:hidden}
    .grid.compact .shot{height:150px}
    .cbody{padding:.9rem 1rem 1.05rem; display:flex; flex-direction:column; gap:.5rem; flex:1}
    .mfr{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
    .card h3{font-size:1.06rem; letter-spacing:-.02em}
    .blurb{font-family:"Newsreader",Georgia,serif; font-size:.95rem; line-height:1.45; color:var(--ink2)}
    .tags{display:flex; gap:.28rem; flex-wrap:wrap; margin-top:auto; padding-top:.35rem}
    .tag{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.02em; color:var(--muted); border:1px solid var(--line); padding:.14rem .38rem}
    .tag.hp{color:var(--ink2); border-color:var(--line2)}
    .want{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink2); border:1px solid currentColor; padding:.22rem .45rem; background:var(--panel)}
    .wish{border-bottom:1px solid var(--line); background:var(--bg2); padding:1.9rem 0}
    .wishhead{display:flex; align-items:baseline; gap:.8rem; margin-bottom:1.1rem}
    .wishhead h2{font-size:1.15rem; letter-spacing:-.02em}
    .wishhead .k{font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:auto}
    .wishgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem}
    .wishcard{border:1px solid var(--line2); background:var(--panel); padding:1.05rem 1.15rem; display:flex; flex-direction:column; gap:.7rem}

    .wtop{display:flex; align-items:center; gap:.5rem}
    .wtop i{font-style:normal; width:9px; height:9px; border-radius:50%; display:inline-block}
    .wname{font-family:"IBM Plex Mono",monospace; font-size:.85rem; letter-spacing:.02em; color:var(--ink)}
    .wcount{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-left:auto}
    .wlede{font-family:"Newsreader",Georgia,serif; font-size:.98rem; color:var(--ink2); line-height:1.45}
    .wantgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:.6rem}
    .wantitem{display:flex; flex-direction:column; gap:.4rem}
    .wantshot{height:78px; background:var(--bg2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden}
    .wantshot.empty{background:transparent; border-style:dashed; border-color:var(--line2)}
    .wantlabel{font-family:"IBM Plex Mono",monospace; font-size:.64rem; line-height:1.35; color:var(--ink2); letter-spacing:.01em}
    .wantlabel .mk{display:block; color:var(--muted); font-size:.6rem; letter-spacing:.05em; text-transform:uppercase}
    .wantitem.ph .wantlabel{color:var(--muted); font-style:italic}
    .hpstamp{white-space:nowrap; flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-variant-numeric:tabular-nums; color:var(--ink2); padding-left:.6rem; margin-left:.6rem; border-left:1px solid var(--line2)}
    .wishpop{position:absolute; right:0; bottom:calc(100% + 9px); width:236px; background:var(--panel); border:1px solid currentColor; box-shadow:var(--shadow); padding:.65rem .7rem .7rem; display:none; z-index:40; text-align:left}
    .wishpop .wp-h{display:block; font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.5rem}
    .wishpop .wp-l{display:flex; gap:.3rem; flex-wrap:wrap}
    .wishpop .want{font-size:.66rem; padding:.14rem .36rem}
    .haspop{position:relative}
    .haspop:hover .wishpop, .haspop:focus-visible .wishpop{display:block}
    .tags .wishpop{bottom:auto; top:calc(100% + 8px); right:auto; left:0}
    .wishpop.open{display:block}
    .ownerpill.haspop{cursor:pointer}
    .chip .wishpop{color:var(--ink2); left:0; right:auto}
    .chip .wishpop .wp-h{color:var(--muted)}
    .cardcta{display:inline-flex; align-items:center; gap:.35rem; margin-left:auto;
      min-height:30px; padding:0 .6rem; font-family:"IBM Plex Mono",monospace; font-size:.7rem;
      letter-spacing:.02em; white-space:nowrap;
      border:1px solid var(--line2); background:transparent; color:var(--ink2);
      transition:background .14s ease, color .14s ease, border-color .14s ease}
    .card:hover .cardcta{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
    .negchip{display:inline-flex; align-items:center; gap:.42rem; margin-left:auto; min-height:30px;
      padding:0 .6rem; font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:600;
      letter-spacing:.02em; white-space:nowrap;
      border:1px solid var(--accent); background:var(--accent); color:var(--on)}
    .negdot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto;
      background:currentColor; animation:negpulse 2s ease-in-out infinite}
    @keyframes negpulse{0%,100%{opacity:1} 50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){ .negdot{animation:none} }
    .btn{min-height:52px; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      padding:0 1.5rem; font-family:"IBM Plex Mono",monospace; font-size:.82rem; font-weight:600; letter-spacing:.04em;
      border:1px solid var(--accent-hi); background:var(--accent); color:var(--on); cursor:pointer;
      box-shadow:0 2px 0 var(--accent-hi), 0 4px 10px -4px rgba(0,0,0,.35);
      transition:transform .08s ease, box-shadow .08s ease, background .14s ease}
    .btn:hover{background:var(--accent-hi); border-color:var(--accent-hi)}
    .btn:active{transform:translateY(2px); box-shadow:0 0 0 var(--accent-hi), 0 1px 3px rgba(0,0,0,.3)}
    .btn.ghost{background:var(--panel); color:var(--accent); border-color:var(--line2);
      box-shadow:0 2px 0 var(--line2), 0 4px 10px -6px rgba(0,0,0,.25)}
    .btn.ghost:hover{background:var(--accent-soft); color:var(--accent-hi); border-color:var(--accent)}
    .btn.ghost:active{transform:translateY(2px); box-shadow:0 0 0 var(--line2)}
    .btn.block{width:100%}
    .ownerpill{position:relative; display:inline-flex; align-items:center; gap:.38rem; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.02em; padding:.18rem .45rem; border:1px solid currentColor; margin-left:auto}
    .ownerpill i{font-style:normal; width:7px; height:7px; border-radius:50%; display:inline-block; flex:0 0 auto}
    .ownerpill{color:var(--ink2); border-color:var(--line2)}
    .ownerpill i{background:var(--muted)}
    .cardfoot{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; padding:.65rem 1rem; border-top:1px solid var(--line); background:var(--panel2)}
    .price{font-family:"IBM Plex Mono",monospace; font-weight:600; font-variant-numeric:tabular-nums; font-size:.95rem; white-space:nowrap; flex:0 0 auto}
    .who{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:.35rem}
    .who i{font-style:normal; display:inline-block; width:7px; height:7px; border-radius:50%}
    .empty{border:1px dashed var(--line2); padding:3rem; text-align:center; font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--muted); grid-column:1 / -1}

    .foot{border-top:1px solid var(--line); background:var(--bg2); padding:2.25rem 0 2.75rem}
    .foot .wrap{display:flex; gap:3rem; align-items:flex-start; flex-wrap:wrap}
    .foot h4{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:.6rem}
    .foot p, .foot a{font-size:.85rem; color:var(--ink2); line-height:1.7}
    .foot a{display:block; color:var(--accent)}
  </style>

  <style>
    .m-wrap{width:calc(100% - 2rem); margin-inline:auto}
    .m-site{padding:.9rem 0; border-bottom:1px solid var(--line); background:var(--bg)}
    .m-site .m-wrap{display:flex; align-items:center; gap:.6rem}
    .m-nav{margin-left:auto; display:flex; gap:.9rem; align-items:center}
    .m-nav a{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.03em; color:var(--ink2); text-decoration:none; min-height:44px; display:flex; align-items:center}
    .m-nav a:hover{color:var(--accent)}
    .m-hero{padding:1.6rem 0 1.4rem; border-bottom:1px solid var(--line)}
    .m-hero h1{font-size:1.85rem; letter-spacing:-.03em; font-stretch:96%}
    .m-hero h1 em{font-style:normal; color:var(--accent)}
    .m-hero .lede{font-family:"Newsreader",Georgia,serif; font-size:1rem; line-height:1.5; color:var(--ink2); margin-top:.6rem}
    .m-stats{display:flex; gap:1.25rem; margin-top:1.1rem}
    .m-stats .n{font-family:"IBM Plex Mono",monospace; font-size:1.15rem; font-weight:500; font-variant-numeric:tabular-nums}
    .m-stats .l{font-family:"IBM Plex Mono",monospace; font-size:.6rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
    .m-controls{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding:.7rem 0; transition:padding .15s ease}
    .m-controls.collapsed{padding:.55rem 0}
    .m-collapsed-bar{display:none; width:100%; align-items:center; gap:.5rem; min-height:44px; background:var(--panel); border:1px solid var(--line2); box-shadow:var(--shadow); font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink); text-align:left; cursor:pointer; padding:0 .7rem}
    .m-controls.collapsed .m-collapsed-bar{display:flex}
    .m-collapsed-bar svg{width:15px; height:15px; flex:0 0 auto; color:var(--accent)}
    .m-collapsed-bar .m-collapsed-count{margin-left:auto; color:var(--muted)}
    .m-controls.collapsed .m-full{display:none}
    .m-search{display:flex; align-items:center; gap:.5rem; background:var(--panel); border:1px solid var(--line2); padding:.55rem .7rem; min-height:44px; margin-bottom:.55rem}
    .m-search input{border:none; background:none; outline:none; font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--ink); width:100%}
    .m-search input::placeholder{color:var(--muted)}
    .wishpop{width:212px}

    .m-fab .btn.ghost{flex:0 0 auto}
  </style>
</helmet>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system","section":"Theme"},"$preview":{"width":390,"height":2340}}'>
var TONE = {
  black: { bg:"linear-gradient(176deg,#2b2b30,#141416)", line:"#3d3d43", ink:"#DAD9D3", knob:"#f0efe9" },
  alu:   { bg:"linear-gradient(176deg,#dcdfdb,#b4b9b3)", line:"#9ea39d", ink:"#2A2E2C", knob:"#1d1f1e" },
  white: { bg:"linear-gradient(176deg,#f4f2ec,#dedcd3)", line:"#c9c6bb", ink:"#2A2E2C", knob:"#1d1f1e" },
  cream: { bg:"linear-gradient(176deg,#ece5d1,#d8ceb3)", line:"#c2b898", ink:"#33301f", knob:"#26240f" },
  wood:  { bg:"linear-gradient(176deg,#d8b78b,#bb9460)", line:"#a67e4c", ink:"#3a2b16", knob:"#2b2011" }
};

function packGrid(n, x0, y0, w, h, cell){
  var out = [], cols = Math.max(1, Math.min(n, Math.floor(w / cell)));
  var rows = Math.ceil(n / cols), cw = w / cols, ch = h / rows;
  for (var i = 0; i < n; i++){
    var c = i % cols, r = Math.floor(i / cols);
    var inRow = (r === rows - 1) ? (n - r * cols) : cols;
    var off = (w - inRow * cw) / 2;
    out.push({ x: x0 + off + c * cw + cw / 2, y: y0 + ch * (r + 0.5) });
  }
  return out;
}

function abs(x, y, w, h){
  return "position:absolute;left:" + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;width:" + w.toFixed(1) + "px;height:" + h.toFixed(1) + "px;";
}

function buildPanel(m, H, tone){
  var t = TONE[tone] || TONE.black;
  var W = m.hp > 0 ? Math.round(m.hp * 5.08 * (H / 128.5)) : Math.round(H * 1.55);
  var U = H / 128.5;
  var els = [];
  var kd = Math.max(8, Math.round(11 * U));
  var jd = Math.max(5, Math.round(7.4 * U));
  var pad = Math.min(6, W * 0.14);
  var iw = W - pad * 2;
  var top = 6;

  if (W > 30){
    [[pad*0.55, 5],[W - pad*0.55, 5],[pad*0.55, H-5],[W - pad*0.55, H-5]].forEach(function(p){
      els.push({ s: abs(p[0]-2, p[1]-2, 4, 4) + "border-radius:50%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);" });
    });
  }

  if (m.parts.sc){
    var sh = Math.round(H * 0.15), sw = Math.min(iw, Math.round(iw * 0.9));
    els.push({ s: abs(pad + (iw - sw) / 2, top, sw, sh) + "background:linear-gradient(180deg,#0d1413,#050807);border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 0 8px rgba(60,200,180,.22);" });
    top += sh + 5;
  }

  var jRows = Math.ceil(m.parts.j / Math.max(1, Math.floor(iw / (jd + 4))));
  var jH = Math.min(H * 0.46, jRows * (jd + 6) + 2);
  var jY = H - 7 - jH;

  if (m.parts.sl){
    var slH = Math.min(H * 0.34, jY - top - 8);
    var slPts = packGrid(m.parts.sl, pad, top, iw, slH, Math.max(6, iw / m.parts.sl));
    slPts.forEach(function(p){
      els.push({ s: abs(p.x - 1, p.y - slH / 2 + 2, 2, slH - 4) + "background:rgba(0,0,0,.42);border-radius:1px;" });
      els.push({ s: abs(p.x - 3.5, p.y - slH / 2 + 2 + (slH - 10) * 0.35, 7, 5) + "background:" + t.knob + ";border-radius:1px;box-shadow:0 1px 1px rgba(0,0,0,.5);" });
    });
    top += slH + 6;
  }

  if (m.parts.k){
    var kH = Math.max(kd + 2, jY - top - 6);
    packGrid(m.parts.k, pad, top, iw, kH, kd + 4).forEach(function(p, i){
      var ang = 210 + (i * 47) % 260;
      els.push({ s: abs(p.x - kd / 2, p.y - kd / 2, kd, kd) +
        "border-radius:50%;background:conic-gradient(from " + ang + "deg," + t.knob + " 0 8deg,transparent 8deg 360deg)," +
        "radial-gradient(circle at 34% 28%,#77777c,#232326 72%);box-shadow:0 1px 2px rgba(0,0,0,.55);" });
    });
  }

  if (m.parts.led){
    var ln = Math.min(m.parts.led, 16);
    packGrid(ln, pad, jY - 7, iw, 5, Math.max(4, iw / ln)).forEach(function(p, i){
      var on = i % 3 === 0;
      els.push({ s: abs(p.x - 1.5, p.y - 1.5, 3, 3) + "border-radius:50%;background:" + (on ? "#E0623A" : "rgba(0,0,0,.3)") + ";" + (on ? "box-shadow:0 0 4px rgba(224,98,58,.8);" : "") });
    });
  }

  packGrid(m.parts.j, pad, jY, iw, jH, jd + 4).forEach(function(p){
    els.push({ s: abs(p.x - jd / 2, p.y - jd / 2, jd, jd) +
      "border-radius:50%;background:radial-gradient(circle,#08080a 0 " + (jd * 0.3).toFixed(1) + "px,#8d918e " + (jd * 0.32).toFixed(1) + "px 100%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5);" });
  });

  return {
    box: "position:relative;display:block;width:" + W + "px;height:" + H + "px;background:" + t.bg +
         ";border:1px solid " + t.line + ";box-shadow:0 2px 6px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);flex:0 0 auto;",
    els: els, w: W
  };
}


/* mfr, name, price, hp, fmt, who, cat, cats, blurb, tone, parts, trade */
var RAW = [
["Industrial Music Electronics","Piston Honda MK III",420,17,"Oscillator",["Oscillator","Wavetable"],
 "Dual morphing wavetable oscillator with 512 sixteen-bit waves in an 8x8x8 cube.","f","black",{k:4,j:10,sl:8,led:4,sc:0},
 ["Complex VCO","Stereo reverb"]],
["Instruo","Lubadh",440,20,"Sampler",["Looper","Tape"],
 "Two channels of tape looping at 96k, five minutes each, varispeed either way.","t","alu",{k:7,j:13,sl:0,led:4,sc:0}, null],
["Westlicht","PER|FORMER",290,34,"Sequencer",["Sequencer","MIDI","DIY"],
 "Eight-track step sequencer with OLED, MIDI and USB host. DIY build.","f","black",{k:2,j:22,sl:0,led:16,sc:1},
 ["Eurorack sequencer","Part-ex + cash"]],
["Erica Synths","Graphic VCO",200,16,"Oscillator",["Oscillator","Wavetable"],
 "Draw your own waveforms, stack them into tables, then morph and fold the result.","f","black",{k:5,j:9,sl:0,led:4,sc:1},
 ["Sampler module","Reverb"]],
["Modor Music","Formant Filter",200,16,"Filter",["Filter","Stereo"],
 "Stereo vowel morphing lifted from the NF-1, all of it under CV.","f","white",{k:8,j:7,sl:0,led:3,sc:0},
 ["Stereo FX","Granular"]],
["Bastl Instruments","Timber",150,7,"Waveshaper",["Waveshaper","Wavefolder"],
 "Driver and folder circuits with a voltage-controlled crossfade between them.","t","wood",{k:5,j:7,sl:0,led:0,sc:0}, null],
["Cosmotronic","Delta-V",170,10,"Modulation",["Envelope","VCA"],
 "Analogue dual function generator with a VCA per channel, in ten HP.","f","black",{k:6,j:10,sl:0,led:2,sc:0},
 ["Quad VCA","Utilities"]],
["Antimatter Audio","Brain Seed",170,4,"Sequencer",["Sequencer","Random"],
 "Realtime CV step recorder in four HP. A thousand steps and a random generator.","t","black",{k:2,j:5,sl:0,led:2,sc:0}, null]
];

var SELLER_DOTS = { t:"#2E77C9", f:"#C98A2E" };

var NAVITEMS = { fi:["Etusivu","Toiveet","Yhteys"], sv:["Hem","Önskemål","Kontakt"], en:["Home","What we want","Contact"] };

var NEGOTIATING = { "Piston Honda MK III":true, "Lubadh":true };

var NEGSTR = { fi:"Neuvottelussa", sv:"Under förhandling", en:"In negotiation" };

var WANTS = {
  t: ["ALM MCO","ALM AXON-1","Mannequins Mangrove","Mannequins W/","Dnipro Dot"],
  f: ["[e.g. quad VCA]","[e.g. drum module]","[e.g. utilities]","[+ add more]"]
};

var CATS = [["all","All"],["Oscillator","Oscillator"],["Filter","Filter"],["Sequencer","Sequencing"],["Waveshaper","Waveshaping"],["Sampler","Sampling"],["Modulation","Modulation"]];

class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { q: "", cat: "all", sort: "hp-desc", pop: null, lang: "fi", collapsed: false };
    this.lastY = 0;
    this.onScroll = this.onScroll.bind(this);
  }

  componentDidMount(){
    window.addEventListener("scroll", this.onScroll, { passive: true });
  }

  componentWillUnmount(){
    window.removeEventListener("scroll", this.onScroll);
  }

  onScroll(){
    var y = window.scrollY || 0;
    var goingDown = y > this.lastY;
    this.lastY = y;
    if (!this.state.collapsed && goingDown && y > 90){
      this.setState({ collapsed: true });
    }
  }

  renderVals(){
    var self = this, s = this.state;

    var all = RAW.map(function(r){
      var m = { mfr:r[0], name:r[1], price:r[2], hp:r[3], cat:r[4], cats:r[5], blurb:r[6], who:r[7], parts:r[9], trade:r[10] };
      m.size = m.hp + " HP";
      m.whoLabel = m.who === "t" ? "spongefile" : "Sampo";
      m.dotStyle = "background:" + SELLER_DOTS[m.who] + ";";
      m.negotiating = !!NEGOTIATING[m.name];
      m.available = !m.negotiating;
      m.p = buildPanel(m, 152, r[8]);
      return m;
    });

    all.forEach(function(m){
      m.wants = WANTS[m.who];
      m.popCls = (s.pop === m.name) ? "open" : "";
      m.togglePop = function(e){
        if (e && e.stopPropagation) e.stopPropagation();
        self.setState({ pop: s.pop === m.name ? null : m.name });
      };
    });

    var list = all.filter(function(m){
      if (s.cat !== "all" && m.cat !== s.cat) return false;
      if (s.q && (m.name + " " + m.mfr + " " + m.blurb).toLowerCase().indexOf(s.q.toLowerCase()) === -1) return false;
      return true;
    });

    var sort = s.sort;
    list.sort(function(a, b){
      if (sort === "price-asc") return a.price - b.price;
      if (sort === "price-desc") return b.price - a.price;
      if (sort === "hp-desc" || sort === "hp-asc"){
        if (!a.hp !== !b.hp) return a.hp ? -1 : 1;
        if (!a.hp && !b.hp) return a.name.localeCompare(b.name);
        return sort === "hp-asc" ? a.hp - b.hp : b.hp - a.hp;
      }
      return a.name.localeCompare(b.name);
    });

    var cats = CATS.map(function(c){
      return { label: c[1], on: s.cat === c[0] ? "true" : "false", pick: function(){ self.setState({ cat: c[0] }); } };
    });

    var LANGS = ["fi","sv","en"];
    return {
      langs: LANGS.map(function(L){
        return { code: L.toUpperCase(), on: s.lang === L ? "true" : "false",
                 pick: function(){ self.setState({ lang: L }); } };
      }),
      enOnly: s.lang !== "en",
      themeClass: "blue" + (this.props.theme === "dark" ? " dark" : (this.props.theme === "light" ? " light" : "")),
      rootStyle: "",
      items: list,
      shown: list.length,
      q: s.q,
      sort: s.sort,
      negLabel: NEGSTR[s.lang] || NEGSTR.fi,
      navItems: NAVITEMS[s.lang] || NAVITEMS.fi,
      cats: cats,
      controlsCls: s.collapsed ? "collapsed" : "",
      expand: function(){ self.setState({ collapsed: false }); },
      onQ: function(e){ self.setState({ q: e.target.value }); },
      onSort: function(e){ self.setState({ sort: e.target.value }); }
    };
  }
}

</script>
