name: Reconcile seller toggles

# Sellers flip "in negotiation", "hidden" and "open to offers", and edit
# their prices, on their own private page,
# which writes to the worker's KV. The site reads that KV live, so a
# toggle shows up immediately — this job is not what makes it work. Its
# only job is to fold that live state back into content/items/*.json so
# git stays the source of truth and the site keeps working, on the last
# built state, if KV is ever unreachable.
#
# NO CREDENTIALS ARE NEEDED. The worker's /state endpoint is public
# (it's the same data every visitor's browser already fetches), so this
# reads over plain HTTP and commits with the token Actions already has.
# That is the whole point of the split: the public-facing worker holds no
# GitHub write access, so compromising it can only set wrong toggle
# values and prices on existing items, which revert from git — it cannot
# rewrite the repository.
#
# Commits ONLY when a value actually differs, so an idle day produces no
# commits and no Pages rebuilds, and a seller toggling something twice
# back to where it started produces none either.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: seller-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply KV state to content/items
        env:
          STATE_URL: https://eurorackfi-cms-auth.aspiala.workers.dev/state
        run: |
          python3 - <<'PY'
          import json, os, glob, urllib.request

          url = os.environ["STATE_URL"]
          # An explicit User-Agent is REQUIRED, not politeness: Cloudflare
          # answers the default "Python-urllib/3.x" with a 403, so the
          # first version of this job failed every run while reporting
          # success — the graceful-degradation branch made a total failure
          # look exactly like "nothing to do".
          req = urllib.request.Request(url, headers={"User-Agent": "eurorackfi-reconcile"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  state = json.load(r)
          except Exception as e:
              # Still don't fail the run — the site is unaffected and the
              # next one picks it up, and a red cron every five minutes is
              # noise. But annotate it, so a persistent outage shows in the
              # Actions UI instead of hiding behind a green tick.
              print(f"::warning::could not read seller state: {e}")
              raise SystemExit(0)

          if not isinstance(state, dict) or not state:
              print("no overrides set — nothing to do")
              raise SystemExit(0)

          changed = []
          for item_id, override in state.items():
              path = f"content/items/{item_id}.json"
              if not os.path.exists(path):
                  # item deleted since the toggle; the override is stale
                  continue
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              diff = {}
              # Every field a seller can set from their own page must be
              # listed here, or that toggle works on the live site and then
              # silently reverts the next time Pages rebuilds from git.
              for field in ("hidden", "negotiating", "haggle"):
                  if field in override and isinstance(override[field], bool):
                      if bool(data.get(field, False)) != override[field]:
                          diff[field] = override[field]

              # Price is the one NON-BOOLEAN a seller can set, so it needs
              # its own branch and its own validation. isinstance(True, int)
              # is True in Python, so bool must be excluded explicitly or a
              # stray {"price": true} would land in git as a price of 1.
              # Bounds match the worker's on purpose: this job must never
              # widen what the write endpoint already refused, or a value
              # rejected at the door gets written by the back one.
              if "price" in override:
                  p_new = override["price"]
                  if isinstance(p_new, int) and not isinstance(p_new, bool) and 0 <= p_new <= 100000:
                      if data.get("price") != p_new:
                          diff["price"] = p_new
                  else:
                      print(f"::warning::ignoring out-of-range price for {item_id}: {p_new!r}")
              if not diff:
                  continue

              data.update(diff)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              changed.append(f"{item_id}: " + ", ".join(f"{k}={v}" for k, v in diff.items()))

          # ---- wishlist visibility, from a SEPARATE endpoint ----
          # Folded into content/sellers/*.json for the same reason item
          # toggles are folded into content/items: without this, hiding a
          # want lives only in KV, and any KV loss silently un-hides
          # everything a seller deliberately pruned. Git stays the truth.
          #
          # Matched on the CONTENT KEY, never the array index — the CMS
          # invites the user to drag wants into priority order, and an
          # index would follow the position and hide the wrong entry.
          # This must compute the key EXACTLY as index.html and worker.js
          # do; scripts/check-wantkey.mjs guards those two against each
          # other, and this is the third implementation, so keep it in
          # step by hand.
          def want_key(w):
              if isinstance(w, str):
                  return w
              if not isinstance(w, dict):
                  return str(w)
              t = w.get("text")
              if t is not None and t != "":
                  return str(t)
              return f"{w.get('mfr', '') or ''}|{w.get('name', '') or ''}"

          try:
              wreq = urllib.request.Request(
                  url.replace("/state", "/wants"),
                  headers={"User-Agent": "eurorackfi-reconcile"})
              with urllib.request.urlopen(wreq, timeout=20) as r:
                  wantstate = json.load(r)
          except Exception as e:
              print(f"::warning::could not read want state: {e}")
              wantstate = {}

          if isinstance(wantstate, dict):
              for seller_key, hidden_map in wantstate.items():
                  spath = f"content/sellers/{seller_key}.json"
                  if not os.path.exists(spath) or not isinstance(hidden_map, dict):
                      continue
                  with open(spath, encoding="utf-8") as f:
                      sdata = json.load(f)
                  touched = False
                  for w in sdata.get("wants", []):
                      if not isinstance(w, dict):
                          # a bare string want can't carry a flag; skip rather
                          # than rewrite it into an object behind the user's back
                          continue
                      want_hidden = bool(hidden_map.get(want_key(w), False))
                      if bool(w.get("hidden", False)) != want_hidden:
                          if want_hidden:
                              w["hidden"] = True
                          else:
                              w.pop("hidden", None)
                          touched = True
                  if touched:
                      with open(spath, "w", encoding="utf-8") as f:
                          json.dump(sdata, f, indent=2, ensure_ascii=False)
                          f.write("\n")
                      changed.append(f"{seller_key}: wishlist visibility")

          if changed:
              print("changed:\n  " + "\n  ".join(changed))
          else:
              print("already in sync — nothing to commit")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CHANGED_COUNT={len(changed)}\n")
          PY

      - name: Commit if changed
        run: |
          if [ "${CHANGED_COUNT:-0}" = "0" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/items content/sellers
          git diff --cached --quiet || git commit -m "Seller toggles: sync $CHANGED_COUNT item(s) from live state"
          # another run may have pushed between checkout and here
          git pull --rebase --autostash origin main
          git push
