name: Update content manifest

# The site's normal page load used to discover which item/seller files
# exist via the GitHub Contents API directory listing, which is capped
# at 60 unauthenticated requests/hour per IP — shared across every
# visitor on that IP. Under any real burst (site testing, admin use,
# a few people on the same network) that blanks the whole site with no
# error a visitor could explain. This workflow keeps a plain filename
# manifest (content/items-index.json, content/sellers-index.json)
# up to date instead; index.html fetches that from raw.githubusercontent.com,
# which is not subject to the same limit, and only falls back to the
# rate-limited directory listing if the manifest itself is unreachable.
#
# Manifests live as siblings of content/items/ and content/sellers/, NOT
# inside them — Decap's folder collections scan every .json file in a
# collection's folder, so a manifest placed inside would show up in
# admin as a broken listing. Path filters below also exclude the
# manifest files themselves, since without that this workflow's own
# commit would retrigger itself indefinitely.
on:
  push:
    branches: [main]
    paths:
      - 'content/items/**.json'
      - 'content/sellers/**.json'
      - '!content/items-index.json'
      - '!content/sellers-index.json'
      - '!content/items-added.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the added-dates manifest below reads each item's
          # FIRST commit, and a shallow clone would date everything to the
          # day of the checkout
          fetch-depth: 0

      - name: Regenerate manifests
        run: |
          for name in items sellers; do
            ( cd "content/$name" && ls -1 *.json 2>/dev/null | sort ) \
              | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()], indent=2))" \
              > "content/${name}-index.json"
          done

          # When each item was ADDED, from git rather than from a field in
          # the data: no item carries a date, the CMS would need a field
          # nobody should have to fill, and git already knows. The date of
          # the FIRST commit touching the file — follow renames so a
          # re-id'd item keeps its original arrival date. Drives the
          # "newest first" sort; the site degrades to shipping without it.
          python3 - <<'PY'
          import json, subprocess, glob, os
          added = {}
          for f in sorted(glob.glob("content/items/*.json")):
              out = subprocess.run(
                  ["git", "log", "--follow", "--diff-filter=A", "--format=%aI", "--", f],
                  capture_output=True, text=True).stdout.strip().split("\n")
              # --follow lists newest first; the LAST line is the true addition
              if out and out[-1]:
                  added[os.path.basename(f)[:-5]] = out[-1]
          with open("content/items-added.json", "w", encoding="utf-8") as fh:
              json.dump(added, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(f"dated {len(added)} items")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/items-index.json content/sellers-index.json content/items-added.json
          git diff --cached --quiet || git commit -m "Update content manifest [skip ci]"
          git push
