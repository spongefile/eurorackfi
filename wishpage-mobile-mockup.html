<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eurorack.fi — Toiveet page on mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{--bg:#E7EBF0;--bg2:#DCE2EA;--panel:#FAFBFD;--panel2:#EFF3F8;
 --ink:#0F1722;--ink2:#36435A;--muted:#6A7789;--line:#CAD3DF;--line2:#AFBACB;
 --accent:#0B4F9E;--shadow:0 1px 2px rgba(15,23,34,.07),0 8px 24px -12px rgba(15,23,34,.22);}
*{box-sizing:border-box}
body{margin:0;padding:32px 36px 60px;background:var(--bg);color:var(--ink);
 font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
h1{font-size:1.35rem;letter-spacing:-.025em;margin:0 0 .5rem}
.sub{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;color:var(--ink2);
 line-height:1.6;max-width:66ch;margin:0 0 1.6rem}
.row{display:flex;gap:1.6rem;flex-wrap:wrap;align-items:flex-start}
.col h2{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.13em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 .5rem}
.col .cap{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--muted);
 line-height:1.65;margin:.6rem 0 0;width:390px}
/* a real 390px phone viewport you can scroll */
.phone{width:390px;height:600px;overflow-y:auto;border:1px solid var(--line2);
 background:var(--bg);position:relative;-webkit-overflow-scrolling:touch}
.pin{font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--accent);
 letter-spacing:.1em;text-transform:uppercase;margin:0 0 .35rem}

.page{padding:0 14px 40px}
.ph1{font-size:1.7rem;letter-spacing:-.03em;margin:16px 0 14px}
.sec{margin-bottom:22px}
.nm{display:flex;align-items:center;gap:.45rem;font-size:1rem;margin:0 0 10px}
.nm i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tile{background:var(--bg2);border:1px solid var(--line);padding:12px 10px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:8px}
.tile .art{width:110px;height:74px;background:linear-gradient(160deg,#3d434b,#23272d);margin-bottom:8px}
.tile .lb{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink2);text-align:center;line-height:1.4}

/* ---- B: sticky owner header ---- */
.vB .nm{position:sticky;top:0;z-index:5;background:var(--bg);
 padding:9px 0;margin:0 0 8px;font-weight:700}
/* ---- C: sticky header + the section carries the owner's colour ---- */
.vC .sec{border-left:3px solid var(--oc);padding-left:10px}
.vC .nm{position:sticky;top:0;z-index:5;background:var(--bg);
 padding:9px 0;margin:0 0 8px;font-weight:700}
/* ---- D: two columns + sticky header ---- */
.vD .sec{border-left:3px solid var(--oc);padding-left:10px}
.vD .nm{position:sticky;top:0;z-index:5;background:var(--bg);
 padding:9px 0;margin:0 0 8px;font-weight:700}
.vD .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vD .tile{margin-bottom:0}
.vD .tile .art{width:100%;height:58px}
</style></head>
<body>
<h1>Toiveet page, 390px</h1>
<p class="sub">Measured on the live site: tiles go one per row, spongefile's section runs
<b>2400px — 2.7 screens</b>, and the owner's name appears once at the top at 16px regular
weight. One swipe in and there is nothing left saying whose list you are reading. Scroll each
phone below.</p>
<div class="row" id="out"></div>
<script>
var S=[["Kalle","#3E9E82",[["Frap Tools","Fumana"],["E-RM","Polygogo"],["Hexinverter","Mindphaser"]]],
 ["Sampo","#C98A2E",[["Noise Engineering","Versio (any model)"]]],
 ["spongefile","#678cd6",[["ALM Busy Circuits","MCO"],["ALM Busy Circuits","AXON-1"],
  ["Mannequins","Mangrove"],["Mannequins","W/"],["Dnipro Modular","Dot"],
  ["Noise Engineering","Mimetic Digitwolis"],["Make Noise","PoliMATHS"],
  ["Instruo","øchd expander"],["Bastl","Neo Trinity"],["Dnipro Modular","Krait"],
  ["Instruo","Tš-L"],["Mannequins","THREE SISTERS"]]]];
function page(v){
  return '<div class="phone"><div class="page '+v+'">'+
   '<h1 class="ph1">Toiveet</h1>'+
   S.map(function(p){
     var tiles=p[2].map(function(m){return '<div class="tile"><div class="art"></div>'+
       '<div class="lb">'+m[0]+'<br>'+m[1]+'</div></div>';}).join("");
     if(v==='vD') tiles='<div class="grid">'+tiles+'</div>';
     return '<div class="sec" style="--oc:'+p[1]+'">'+
      '<div class="nm"><i style="background:'+p[1]+'"></i>'+p[0]+'</div>'+tiles+'</div>';
   }).join("")+'</div></div>';
}
var defs=[
 ["A — as it is now","vA","The name scrolls away with everything else. Twelve tiles later you are still in spongefile's list with no way to know it."],
 ["B — the owner's name pins while you are in their section","vB","One change: the name sticks to the top of the viewport for exactly as long as that person's tiles are on screen, then the next name pushes it out. Whose list you are in becomes impossible to lose. Also bold, which it was not."],
 ["C — pinned name plus the owner's colour down the section (recommended)","vC","The pinned name answers it when you look up; the coloured rule answers it without looking up. Same 3px edge the wish cards used and the filter bar uses, so the colour already means \\\"this belongs to this person\\\" everywhere else on the site."],
 ["D — same, but two columns","vD","Halves the scroll: spongefile drops from about 2.7 screens to roughly 1.4. The tiles get smaller, which matters more here than on the home page because these are wants — a taste, not merchandise. Worth comparing against C on whether the art is still worth looking at."]
];
document.getElementById('out').innerHTML=defs.map(function(d){
 return '<div class="col"><h2>'+d[0]+'</h2><div class="pin">scroll me</div>'+page(d[1])+
  '<p class="cap">'+d[2]+'</p></div>';}).join("");
</script>
</body></html>
