<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eurorack.fi — Toiveet as a flowing row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{--bg:#E7EBF0;--bg2:#DCE2EA;--panel:#FAFBFD;--ink:#0F1722;--ink2:#36435A;
 --muted:#6A7789;--line:#CAD3DF;--line2:#AFBACB;--accent:#0B4F9E;}
*{box-sizing:border-box}
body{margin:0;padding:36px 40px 70px;background:var(--bg);color:var(--ink);
 font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
h1{font-size:1.35rem;letter-spacing:-.025em;margin:0 0 .5rem}
.sub{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;color:var(--ink2);
 line-height:1.6;max-width:66ch;margin:0 0 1.6rem}
h2{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:2.4rem 0 .3rem}
.scale{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--accent);
 letter-spacing:.1em;text-transform:uppercase;margin:1.2rem 0 .45rem}
.cap{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--muted);
 margin-top:.7rem;line-height:1.7;max-width:82ch}
.stage{border:1px dashed var(--line2);padding:1.3rem 1.4rem;background:var(--panel)}

.band .bandhead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.85rem}
.band h3{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.seeall{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--accent);text-decoration:none}
.note{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--muted);margin-top:.9rem}

/* the flow: no boxes at all. Each person is one inline group that will not
   break across a line, so a name never separates from its own wants. */
.flow{line-height:2.05}
.who{display:inline;white-space:normal}
.who + .who{margin-left:.2rem}
/* dot and name are ONE unbreakable unit — otherwise a line can end on a bare
   coloured circle with its name starting the next line, which reads as a
   stray mark rather than as a person. */
.tag{white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;
 margin-right:.4rem;vertical-align:.02em}
/* Names in --ink2, not --ink: gentler than full black and it clears 4.5 in
   BOTH themes (8.32 light / 11.29 dark) with no per-seller computation at all.
   The circle carries the identity colour; the name only has to read. */
.nm{font-weight:700;font-size:1rem}
/* Same ink as the name. They do not need a colour difference — bold 16px
   Archivo against regular 12px mono is already two different voices, and
   --muted would fail contrast in the light theme (3.80). */
.wants{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink2);
 margin-left:.45rem}
/* tight: the literal spaces around the middot are gone, the padding carries
   it. Names sit close so each person's wants read as one phrase; the wide
   .gap between people is what separates one person from the next. */
.wants .sep{color:var(--line2);padding:0 .26rem}
.wants .more{color:var(--muted)}
/* a wider gap is the only separator between people, so it has to be decisive */
.gap{display:inline-block;width:2.1rem}
</style></head>
<body>
<h1>Toiveet — flowing row, final</h1>
<p class="sub">No rectangles. Circle in the seller's colour, name bold in the site's softer
ink, wants in mono. Module names sit tight so each person reads as one phrase; the wide gap
between people is the only separator, and it does all the work the boxes used to.</p>
<div id="out"></div>
<script>
var S=[["Kalle",14,"#4E9E7E","#39745D"],["Sampo",20,"#C98A2E","#8E6120"],
 ["spongefile",52,"#678cd6","#4D69A0"],["Mikko",11,"#9B6BB0","#6E4A80"],
 ["Riikka",27,"#C4576B","#8B3D4C"],["Jussi",18,"#3E8E8E","#2C6666"],
 ["Aino",9,"#B0863E","#7C5F2C"],["Tero",31,"#5C7BC4","#42598E"]];
var W={Kalle:["Fumana","Polygogo","Mindphaser","Versio","Rings","Maths","Plaits"],
 Sampo:["Versio (any model)","Mangrove","Just Friends","Beads","Morphagene"],
 spongefile:["MCO","AXON-1","Mangrove","W/","Dot","Mimetic Digitwolis","PoliMATHS","øchd expander","Neo Trinity"],
 Mikko:["Rings","Clouds"],Riikka:["Pamela's","Disting","Batumi","Zularic"],
 Jussi:["Maths","Optomix","Wogglebug"],Aino:["Plaits"],
 Tero:["Marbles","Stages","Tides","Ripples","Veils","Links"]};
function band(n,mode){
  var s=S.slice(0,n);
  return '<div class="band"><div class="bandhead"><h3>Toiveet</h3>'+
   '<a class="seeall" href="#">Katso koko lista &rarr;</a></div><div class="flow">'+
   s.map(function(p,i){
     var col = 'var(--ink2)';
     var w=W[p[0]]||[],shown=w.slice(0,4),extra=w.length-shown.length;
     return (i?'<span class="gap"></span>':'')+
      '<span class="who"><span class="tag"><span class="dot" style="background:'+p[2]+'"></span>'+
      '<span class="nm" style="color:'+col+'">'+p[0]+'</span></span>'+
      '<span class="wants">'+shown.join('<span class="sep">·</span>')+
      (extra>0?'<span class="more"> +'+extra+'</span>':'')+'</span></span>';
   }).join("")+'</div><div class="note">Myös osavaihto + rahaa</div></div>';
}
var defs=[
 ["Toiveet — final",'ink2',
  "Names in --ink2 — the site's softer ink, gentler than full black. It clears 4.5 in both themes (8.32 light, 11.29 dark), so there is no per-seller colour computation and nothing that can silently fail when a new seller picks their own colour. The circle carries the identity; the name only has to read."],
];
var h="";
defs.forEach(function(d){
  h+='<h2>'+d[0]+'</h2>';
  h+='<div class="scale">three sellers — today</div><div class="stage">'+band(3,d[1])+'</div>';
  h+='<div class="scale">eight sellers — later</div><div class="stage">'+band(8,d[1])+'</div>';
  h+='<p class="cap">'+d[2]+'</p>';
});
document.getElementById('out').innerHTML=h;
</script>
</body></html>
