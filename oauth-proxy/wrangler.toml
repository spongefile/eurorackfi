name = "eurorackfi-cms-auth"
main = "worker.js"
compatibility_date = "2025-01-01"

# workers_dev IS EXPLICIT AND LOAD-BEARING, not a default worth trimming.
# Declaring any [[routes]] entry flips this to false, which unpublishes the
# workers.dev hostname — and because every seller link, the Decap OAuth
# base_url and the site's /state fetch all point there, that takes the
# whole worker offline with Cloudflare error 1042. It happened once. If you
# add a route, keep this line.
workers_dev = true

# PREVIEW URLS ARE OFF DELIBERATELY, and this is a security setting, not
# tidiness. With workers.dev enabled and this unset, Cloudflare publishes
# EVERY deployed version at its own permanent public URL
# (<version>-<worker>.<subdomain>.workers.dev), each with the same KV
# binding and secrets as production. Verified: three past versions were
# answering /state with 200. That means any version that ever shipped with
# a weaker check stays reachable and exploitable forever, and a fix
# deployed to production does not retire the flawed one. Nothing here needs
# them - previewing is done locally against a stubbed KV.
preview_urls = false

# NO CUSTOM DOMAIN. linkki.eurorack.fi was investigated and dropped: a
# Workers custom domain requires the zone and the worker in the SAME
# Cloudflare account, and eurorack.fi's zone belongs to Sampo while this
# worker is in spongefile's. Closing that gap meant either moving the zone
# or moving the worker, and moving the worker would change the workers.dev
# hostname - killing every seller link already sent. Not worth it: the
# mail's opening sentence, not its hostname, is what separates it from a
# phishing message.
# If this is ever revisited, note that adding [[routes]] flips workers_dev
# to false. That is what caused the outage above.

# Live seller toggle state. The worker writes ONLY here — it holds no
# GitHub credential — and a scheduled Action folds this back into
# content/items/*.json so git stays the source of truth.
[[kv_namespaces]]
binding = "SELLER_STATE"
id = "ba3db7c44a7946618b64c12d7cf0593c"
