<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root{
  --bg:#E7EBF0; --ink:#0F1722; --ink2:#36435A; --muted:#6A7789;
  --line:#CAD3DF; --line2:#AFBACB; --accent:#0B4F9E;
  --rail:#B1B9C5; --rail-ink:#8891A0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--bg);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;justify-content:space-between}
.rail{height:14px;background:var(--rail);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
  background-image:radial-gradient(circle at 8px 6px,var(--rail-ink) 0 2.4px,transparent 2.5px);
  background-size:38px 100%;flex:0 0 auto}
.mid{flex:1 1 auto;display:flex;align-items:center;padding:0 84px;gap:64px}
.left{flex:1 1 auto;min-width:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.brand{font-weight:800;font-size:96px;letter-spacing:-.035em;font-stretch:96%;
  color:var(--ink);line-height:1;display:flex;align-items:center}
.brand .jack{width:.58em;height:.58em;display:inline-block;
  transform:translate(-.016em,.015em);margin-left:.07em}
.brand .dot{color:var(--accent)}
.tag{font-family:"Newsreader",Georgia,serif;font-size:40px;line-height:1.3;
  color:var(--ink2);margin-top:30px;max-width:20ch}
/* a nod to the rack: wood cheek + rails, the site's own motif */
.case{flex:0 0 300px;height:330px;display:flex;align-self:center;
  box-shadow:0 1px 2px rgba(15,23,34,.07),0 8px 24px -12px rgba(15,23,34,.22)}
.cheek{flex:0 0 22px;background:linear-gradient(90deg,#dcb98d,#b98f5c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(0,0,0,.26);
  position:relative}
.cheek::before,.cheek::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:#5c421f}
.cheek::before{top:16px} .cheek::after{bottom:16px}
.cheek.right{background:linear-gradient(90deg,#b98f5c,#dcb98d)}
.inner{flex:1 1 auto;background:linear-gradient(176deg,#31363c,#1c2025);
  display:flex;flex-direction:column}
.r{height:13px;background:#8f959d;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.22);
  background-image:radial-gradient(circle at 7px 6px,#5c6169 0 2.2px,transparent 2.3px);
  background-size:36px 100%;flex:0 0 auto}
.slot{flex:1 1 auto;display:flex;align-items:stretch}
.m{background:linear-gradient(168deg,#3d434b,#23272d);border-right:1px solid rgba(0,0,0,.45);
  position:relative}
.m::before{content:"";position:absolute;left:6px;right:6px;top:9px;height:5px;border-radius:3px;
  background:rgba(255,255,255,.13)}
.m::after{content:"";position:absolute;left:7px;bottom:9px;width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.16);box-shadow:14px 0 0 rgba(255,255,255,.16),28px 0 0 rgba(255,255,255,.10)}
.blank{flex:1 1 auto;background:linear-gradient(176deg,#2f343a,#1d2126)}
</style></head>
<body>
  <div class="rail"></div>
  <div class="mid">
    <div class="left">
      <div class="eyebrow">Helsinki · naapureita</div>
      <div class="brand">eur<svg class="jack" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="18"/><circle cx="50" cy="50" r="14" fill="currentColor"/></svg>rack<span class="dot">.</span>fi</div>
      <div class="tag">Tavaraa naapurista.</div>
    </div>
    <div class="case">
      <div class="cheek"></div>
      <div class="inner">
        <div class="r"></div>
        <div class="slot"><i class="m" style="flex:0 0 62px"></i><i class="m" style="flex:0 0 40px"></i><i class="blank"></i></div>
        <div class="r"></div>
        <div class="slot"><i class="m" style="flex:0 0 48px"></i><i class="m" style="flex:0 0 78px"></i><i class="m" style="flex:0 0 34px"></i><i class="blank"></i></div>
        <div class="r"></div>
        <div class="slot"><i class="m" style="flex:0 0 54px"></i><i class="blank"></i></div>
        <div class="r"></div>
      </div>
      <div class="cheek right"></div>
    </div>
  </div>
  <div class="rail"></div>
</body></html>
