/* ---------- routing ---------- */
/* photo is the default view whenever one exists — matches the grid card,
   which already shows the photo first; drawn panel becomes the alternate */
function openDetail(id){ var m=byId(id); S.shot=(m&&m.img)?1:0; location.hash="#/m/"+id; }
/* the nav's "Everything" link used to be a plain href="#grid-top" same-
   page anchor, which raced this: an onclick fires first, but the
   anchor's own href navigation fires right after and would overwrite
   whatever hash closeDetail() just computed. #grid-top isn't one of
   this app's own routes, so that native jump did the scrolling but
   silently destroyed the seller URL closeDetail() had just restored —
   invisible in-session (S.who was still correct in memory) and only
   real on reload. Scrolling now happens here instead, after the hash is
   set, so there's nothing left for a stale href to win against. */
function closeDetail(){
  if(location.hash.indexOf("#/m/")===0 || location.hash.indexOf("#/msg/")===0 || location.hash.indexOf("#/admin")===0 || location.hash.indexOf("#/wish")===0 || location.hash.indexOf("#/faq")===0){
    location.hash=S.who!=="all"?"#/s/"+S.who:"#/";
    var gt=el("grid-top"); if(gt) gt.scrollIntoView();
  }
}
/* Marks the current SECTION in the nav, not the exact hash — a module
   page (#/m/<id>) and a seller-filtered grid (#/s/<seller>) are both
   still "Everything" (no page of their own, per the seller-URL
   contract), and the module page's own breadcrumb already says
   "back to Everything", so leaving the nav unmarked there would
   contradict it. #/admin marks nothing: it isn't one of the four nav
   destinations. Order matches the anchors/T2.nav arrays in
   renderChrome() (grid-top, wish, faq, msg) index-for-index — rebuilt
   fresh by renderChrome() on every language switch, so this must be
   re-applied every route() call rather than set once. */
function syncNavCurrent(h){
  var sec = h.indexOf("#/wish")===0 ? 1
    : h.indexOf("#/faq")===0 ? 2
    : h.indexOf("#/msg/")===0 ? 3
    : h.indexOf("#/admin")===0 ? -1
    : 0;
  Array.prototype.forEach.call(el("nav").querySelectorAll("a"),function(a,i){
    if(i===sec) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
}
function route(){
  var h=location.hash;
  syncNavCurrent(h);
  if(h.indexOf("#/wish")===0){
    el("detail").innerHTML=wishHTML();
    document.body.classList.add("detail-open");
    document.title=t().wishH+" — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  /* "#/faq" is the page; "#/faq/<id>" scrolls to one question. The second
     segment has to be part of the route (not a separate "#id" browser
     anchor) — a compound hash like "#/faq#can-i-join" isn't valid. So the
     id on each <section> is the bare slug, used only as a scrollIntoView
     target here; the browser's own native hash-jump never fires because
     location.hash is never literally "#can-i-join". */
  if(h.indexOf("#/faq")===0){
    var fid = h.indexOf("#/faq/")===0 ? h.slice(6) : null;
    el("detail").innerHTML=faqHTML();
    document.body.classList.add("detail-open");
    document.title="FAQ — eurorack.fi";
    var ftarget = fid && el(fid);
    if(ftarget) ftarget.scrollIntoView(); else window.scrollTo(0,0);
    return;
  }
  if(h.indexOf("#/admin")===0){
    el("detail").innerHTML=adminHTML();
    document.body.classList.add("detail-open");
    document.title="Add a listing — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/msg/")===0){
    var m=byId(h.slice(6));
    var backHref = m ? "#/m/"+m.id : "#/";
    el("detail").innerHTML='<div class="wrap msgpage">'+
      '<div class="msgbar"><a class="back" href="'+backHref+'">&larr; '+esc(t().nav[0])+'</a></div>'+
      '<iframe class="msgframe" data-tally-src="'+(m?tallyLink(m):TALLY_URL)+(m?"&":"?")+'transparentBackground=1" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Message eurorack.fi"></iframe>'+
      '</div>';
    document.body.classList.add("detail-open");
    document.title="Message — eurorack.fi";
    /* embed.js only scans the DOM once, on load — a dynamically inserted
       iframe needs an explicit re-scan or it never mounts */
    if(window.Tally) window.Tally.loadEmbeds();
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/m/")===0){
    var m=byId(h.slice(4));
    if(m){
      /* a direct/bookmarked load skips openDetail(), so decide once here —
         but never override a click the user already made on this item */
      if(S.shot===null) S.shot=m.img?1:0;
      el("detail").innerHTML=detailHTML(m);
      document.body.classList.add("detail-open");
      document.title=m.mfr+" "+m.name+" — eurorack.fi";
      /* only the drawn-faceplate slot needs fitting — must not clobber a shown photo */
      if(S.shot===0) fitPanel(m);
      window.scrollTo(0,0); return;
    }
    /* no record survives a delisting, so this is deliberately generic */
    el("detail").innerHTML='<div class="wrap"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(t().nav[0])+'</button></div>'+
      '<div class="gone"><h2>'+esc(GONE[lang].h)+'</h2><p>'+esc(GONE[lang].p)+'</p>'+
      '<button class="btn" onclick="closeDetail()">'+esc(t().nav[0])+'</button></div></div>';
    document.body.classList.add("detail-open"); window.scrollTo(0,0); return;
  }
  /* #/s/<seller> — a shareable link onto the filtered grid, owner only.
     format/type/search/sort are deliberately left untouched: they stay
     session state and never enter the URL, so this promises "you're
     looking at this seller's items", not "this exact screen". An
     unknown/stale key degrades to the plain grid rather than getting
     stuck on a filter nothing can clear. */
  if(h.indexOf("#/s/")===0){
    var sk=h.slice(4), sp=SELLER_BY_KEY[sk];
    S.who=sp?sk:"all";
    renderFilters(); renderGrid();
    document.body.classList.remove("detail-open");
    document.title=sp?(sp.name+" — eurorack.fi"):"eurorack.fi";
    return;
  }
  /* plain "#/" is the one other place the owner filter can be cleared
     from (Everyone chip, browser back/forward past a #/s/ visit,
     closeDetail() with nothing to return to) — only re-render when it
     actually needs clearing, so an ordinary detail-page close doesn't
     rebuild the grid for no reason. */
  if(S.who!=="all"){ S.who="all"; renderFilters(); renderGrid(); }
  document.body.classList.remove("detail-open");
  document.title="eurorack.fi";
}
var GONE={
  fi:{h:"Tätä ei enää ole",p:"Kohde on poistettu listalta. Kaikki myynnissä oleva on etusivulla."},
  sv:{h:"Borta",p:"Objektet är borta från listan. Allt som är till salu finns på förstasidan."},
  en:{h:"That one's gone",p:"This listing has come off the site. Everything still for sale is on the front page."}
};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var vid=e.target.closest(".vid[data-yt]");
  if(vid){ playVid(vid); return; }
  var pop=e.target.closest("[data-pop]");
  if(pop){
    e.stopPropagation();
    S.pop=(S.pop===pop.getAttribute("data-pop"))?null:pop.getAttribute("data-pop");
    /* re-render whatever's actually on screen — the popover also lives on
       the detail page's "you may also like" cards, not just the home grid.
       Re-paint #detail directly rather than going through route(), which
       would scrollTo(0,0) and yank the page back to the top on every tap. */
    if(location.hash.indexOf("#/m/")===0){
      var mp=byId(location.hash.slice(4));
      if(mp) el("detail").innerHTML=detailHTML(mp);
    } else {
      renderGrid();
    }
    return;
  }
  var g=e.target.closest("[data-go]");
  if(g){ openDetail(g.getAttribute("data-go")); return; }
  var L=e.target.closest("[data-lang]");
  if(L){ lang=L.getAttribute("data-lang"); try{localStorage.setItem("erfi-lang",lang);}catch(x){} renderAll(); route(); return; }
  /* owner is hash-driven, not direct state — #/s/<seller> is a shareable,
     bookmarkable, back/forward-correct URL onto the filtered grid
     (owner only; format/type/search/sort stay session state and never
     enter the URL, deliberately). route() applies the actual filter
     reactively off the hash; this click handler only ever navigates. */
  var who=e.target.closest("[data-who]");
  if(who){
    var wv=who.getAttribute("data-who");
    location.hash = wv==="all" ? "#/" : "#/s/"+wv;
    return;
  }
  ["fmt","cat"].forEach(function(k){
    var c=e.target.closest("[data-"+k+"]");
    if(c){ S[k]=c.getAttribute("data-"+k); renderFilters(); renderGrid(); }
  });
  var sh=e.target.closest("[data-shot]");
  if(sh && !sh.disabled){ S.shot=+sh.getAttribute("data-shot"); route(); return; }
  var nav=e.target.closest("[data-shotdir]");
  if(nav){
    var mm=byId(location.hash.slice(4));
    if(mm){
      var avail=shotAvail(mm), idx=avail.indexOf(S.shot);
      if(idx<0) idx=0;
      var dir=nav.getAttribute("data-shotdir")==="next"?1:-1;
      S.shot=avail[(idx+dir+avail.length)%avail.length];
      route();
    }
    return;
  }
  if(e.target.closest("#themeb")){
    var r=document.documentElement;
    var isDark=r.classList.contains("dark")||(!r.classList.contains("light")&&matchMedia("(prefers-color-scheme:dark)").matches);
    r.classList.remove("dark","light"); r.classList.add(isDark?"light":"dark");
    try{ localStorage.setItem("erfi-theme",isDark?"light":"dark"); }catch(x){}
    return;
  }
  if(e.target.closest("#a-copy-raw")){ copyText(adminOutput().json); return; }
});
/* admin fields update AS + only the output blocks, never re-rendering the
   form — a full re-render on every keystroke would drop focus mid-word */
document.addEventListener("input",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); }
});
document.addEventListener("change",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); return; }
  var ac=e.target.closest("[data-acat]");
  if(ac){
    var v=ac.getAttribute("data-acat"), i=AS.cats.indexOf(v);
    if(ac.checked && i<0) AS.cats.push(v);
    if(!ac.checked && i>=0) AS.cats.splice(i,1);
    updateAdminOutput(); return;
  }
  if(e.target.id==="a-sc"){ AS.sc=e.target.checked; updateAdminOutput(); return; }
});
el("q").addEventListener("input",function(e){ S.q=e.target.value; renderGrid(); });
el("sort").addEventListener("change",function(e){ S.sort=e.target.value; renderGrid(); });
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ closeDetail(); return; }
  if(e.key==="Enter"||e.key===" "){
    var vid=e.target.closest&&e.target.closest(".vid[data-yt]");
    if(vid){ e.preventDefault(); playVid(vid); }
  }
});
window.addEventListener("hashchange",route);
/* Only the drawn-faceplate slot needs anything on resize — fitPanel()
   re-measures .bench and redraws at fixed-pixel scale. Used to call the
   full route() instead, which (a) reset scroll to 0 unconditionally,
   even when a photo was showing and there was no panel to refit at all,
   and (b) on iOS Safari specifically, fired mid-scroll: the address bar
   collapsing/expanding as the page scrolls dispatches resize events, so
   scrolling down on a product page kept snapping back to the top. */
var rz; window.addEventListener("resize",function(){
  clearTimeout(rz); rz=setTimeout(function(){
    if(location.hash.indexOf("#/m/")===0 && S.shot===0){
      var m=byId(location.hash.slice(4));
      if(m) fitPanel(m);
    }
  },150); });

/* fold the filter bar into a compact tappable summary row once the user
   scrolls past it, so it stops eating grid space — every width, not just
   mobile. Deliberately one-way — no scroll-up auto-reveal — it only
   unfolds on tap, per the user's explicit ask (originally matched
   design's Mobile.dc.html .m-controls; now applied everywhere).
   Height animates from a measured pixel value (see the CSS above for
   why max-height can't do this), and inert — not visibility — keeps the
   hidden side out of the tab order: visibility needs a delay to stay
   interactive through the transition, which doesn't work when the panel
   has to stay visible for the whole fold. inert has no such requirement,
   so it's applied synchronously the moment the state changes. */
(function(){
  var controls=el("grid-top"), wrap=el("collwrap"), bar=el("collbar");
  var DUR=260, foldTimer=null, lastY=window.scrollY, ticking=false, suppressUntil=0;

  function collapsed(){ return controls.classList.contains("collapsed"); }

  /* >=900px the bar never auto-collapses: it stays open until clicked shut.
     Below that, unchanged — scrolling down folds it away. */
  var DESKTOP=window.matchMedia("(min-width:900px)");

  function syncInert(){
    var c=collapsed();
    wrap.toggleAttribute("inert", c);
    /* inert only while the bar is NOT the live control. On desktop it is
       always the live control — it's the only way to close the panel — so
       it must never be inert there. Marking it inert while expanded made
       that one control unclickable.
       Note this cannot be caught by element.click(), which fires handlers
       on an inert element regardless: inert removes it from HIT-TESTING,
       not from dispatch. Verify with a real click at real coordinates. */
    bar.toggleAttribute("inert", !c && !DESKTOP.matches);
    bar.setAttribute("aria-expanded", c?"false":"true");
  }

  /* back to height:auto once settled, so the panel reflows freely on
     resize, language switch, or chips rewrapping — a stale pixel height
     left behind would clip it. */
  function settle(clearHeight){
    clearTimeout(foldTimer);
    foldTimer=setTimeout(function(){
      wrap.classList.remove("folding");
      if(clearHeight) wrap.style.height="";
    }, DUR+40);
  }

  function collapse(){
    if(collapsed()) return;
    wrap.classList.add("folding");
    wrap.style.height=wrap.scrollHeight+"px";
    void wrap.offsetHeight;
    controls.classList.add("collapsed");
    wrap.style.height="0px";
    syncInert(); settle(false);
  }
  function expand(){
    if(!collapsed()) return;
    wrap.classList.add("folding");
    controls.classList.remove("collapsed");
    var target=wrap.scrollHeight;
    wrap.style.height="0px";
    void wrap.offsetHeight;
    wrap.style.height=target+"px";
    syncInert(); settle(true);
  }

  function onScroll(){
    ticking=false;
    var y=window.scrollY, goingDown=y>lastY;
    lastY=y;
    if(DESKTOP.matches) return; /* desktop closes on click only */
    if(Date.now()<suppressUntil) return; /* see click handler below */
    if(!collapsed() && goingDown && y>90) collapse();
  }
  window.addEventListener("scroll",function(){
    if(!ticking){ requestAnimationFrame(onScroll); ticking=true; }
  },{passive:true});

  bar.addEventListener("click",function(){
    /* toggle: on desktop the bar is permanent, so clicking it is how the
       panel closes as well as opens. Below the breakpoint the bar only
       exists while collapsed, so this still only ever expands there. */
    if(collapsed()) expand(); else collapse();
    lastY=window.scrollY;
    /* a real finger-scroll on a touchscreen keeps drifting for a bit after
       lift-off (momentum/inertia) — tapping to expand mid-drift still reads
       as "genuinely still scrolling down" a moment later even with a fresh
       baseline above, and would instantly re-collapse what was just opened.
       Ignore auto-collapse for a short window so the tap actually sticks. */
    suppressUntil=Date.now()+600;
  });

  /* Crossing into desktop while collapsed must re-expand. Scroll is what
     collapsed it, and on desktop scroll no longer reopens anything — the
     user would land with the panel shut and only the bar to click, which
     works but silently loses the filters they had open. Re-expanding also
     re-syncs inert, which is the difference between the bar being
     clickable and not. */
  function onBreakpoint(){
    if(DESKTOP.matches && collapsed()) expand();
    else syncInert();
  }
  /* Driven from BOTH the media query and plain resize. matchMedia change
     is the precise signal; resize is cheap redundancy for any context
     where it doesn't arrive, and onBreakpoint is idempotent so a double
     call costs nothing.
     Neither fires when an IFRAME element is resized — measured: innerWidth
     and mq.matches both update, but change and resize events stay at zero —
     so an embedded copy can miss the crossing entirely. That's tolerable
     rather than fixed, because the desktop bar is a permanent, never-inert
     control: a user who lands collapsed just clicks it open. This re-expand
     is a convenience, not the thing standing between them and a stuck UI. */
  if(DESKTOP.addEventListener) DESKTOP.addEventListener("change",onBreakpoint);
  else DESKTOP.addListener(onBreakpoint); /* older Safari */

  /* a resize mid-fold would animate toward a height measured at the old
     width; drop to auto and let it re-measure the next time it folds. */
  window.addEventListener("resize",function(){
    if(!collapsed()){ wrap.classList.remove("folding"); wrap.style.height=""; }
    onBreakpoint();
  });

  syncInert();
})();

/* ---------- init ---------- */
function renderAll(){ renderChrome(); renderRack(); renderFilters(); renderWish(); renderGrid(); }
/* chrome (nav, hero copy, language switcher) needs no data and shows instantly;
   everything listing-shaped waits on the round trip to content/items/ and
   content/sellers/, fetched together so nothing renders on partial data */
renderChrome();
el("grid").innerHTML='<p class="mono" style="padding:2rem 0;color:var(--muted)">'+esc(t().loading||"Loading…")+'</p>';
Promise.all([loadItems(), loadSellers(), loadFaq(), loadUi()]).then(function(r){
  /* hidden items stay in content/items/ (data, photos, history all kept
     for a possible relist) but must not exist for the site at all —
     filtering here, before anything else touches ITEMS, means every
     consumer (stats, rack, filter counts, grid, wish band, related-item
     lookups) automatically excludes them with no special-casing needed.
     A direct/bookmarked link to a hidden item's #/m/ page already falls
     through to the existing generic "gone" page, same as a deleted one. */
  ITEMS=r[0].filter(function(m){ return !m.hidden; });
  SELLERS=r[1];
  SELLERS.forEach(function(p,i){ if(!p.dot) p.dot=SELLER_DOTS[i % SELLER_DOTS.length]; p.wants=normalizeWants(p.wants); });
  WANTS={}; SELLER_BY_KEY={};
  SELLERS.forEach(function(p){ WANTS[p.key]=p.wants; SELLER_BY_KEY[p.key]=p; });
  FAQ=(r[2]&&r[2].questions)?r[2]:{questions:[]};
  applyUi(r[3]);
  renderAll();
  route();
}).catch(function(err){
  el("grid").innerHTML='<div class="empty">'+esc(t().loadError||"Could not load listings.")+' ('+esc(err.message)+')</div>';
});
</script>
