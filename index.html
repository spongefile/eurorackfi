  if(W>30){[[pad*0.55,5],[W-pad*0.55,5],[pad*0.55,H-5],[W-pad*0.55,H-5]].forEach(function(p){
    els.push(abs(p[0]-2,p[1]-2,4,4)+"border-radius:50%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);");});}
  if(m.parts.sc){var sh=Math.round(H*0.15),sw=Math.min(iw,Math.round(iw*0.9));
    els.push(abs(pad+(iw-sw)/2,top,sw,sh)+"background:linear-gradient(180deg,#0d1413,#050807);border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 0 8px rgba(60,200,180,.22);");
    top+=sh+5;}
  var jRows=Math.ceil(m.parts.j/Math.max(1,Math.floor(iw/(jd+4))));
  var jH=Math.min(H*0.46,jRows*(jd+6)+2), jY=H-7-jH;
  if(m.parts.sl){var slH=Math.min(H*0.34,jY-top-8);
    packGrid(m.parts.sl,pad,top,iw,slH,Math.max(6,iw/m.parts.sl)).forEach(function(p){
      els.push(abs(p.x-1,p.y-slH/2+2,2,slH-4)+"background:rgba(0,0,0,.42);border-radius:1px;");
      els.push(abs(p.x-3.5,p.y-slH/2+2+(slH-10)*0.35,7,5)+"background:"+t.knob+";border-radius:1px;box-shadow:0 1px 1px rgba(0,0,0,.5);");});
    top+=slH+6;}
  if(m.parts.k){var kH=Math.max(kd+2,jY-top-6);
    packGrid(m.parts.k,pad,top,iw,kH,kd+4).forEach(function(p,i){var ang=210+(i*47)%260;
      els.push(abs(p.x-kd/2,p.y-kd/2,kd,kd)+"border-radius:50%;background:conic-gradient(from "+ang+"deg,"+t.knob+" 0 8deg,transparent 8deg 360deg),radial-gradient(circle at 34% 28%,#77777c,#232326 72%);box-shadow:0 1px 2px rgba(0,0,0,.55);");});}
  if(m.parts.led){var ln=Math.min(m.parts.led,16);
    packGrid(ln,pad,jY-7,iw,5,Math.max(4,iw/ln)).forEach(function(p,i){var on=i%3===0;
      els.push(abs(p.x-1.5,p.y-1.5,3,3)+"border-radius:50%;background:"+(on?"#E0623A":"rgba(0,0,0,.3)")+";"+(on?"box-shadow:0 0 4px rgba(224,98,58,.8);":""));});}
  packGrid(m.parts.j,pad,jY,iw,jH,jd+4).forEach(function(p){
    els.push(abs(p.x-jd/2,p.y-jd/2,jd,jd)+"border-radius:50%;background:radial-gradient(circle,#08080a 0 "+(jd*0.3).toFixed(1)+"px,#8d918e "+(jd*0.32).toFixed(1)+"px 100%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5);");});
  return {w:W, html:'<div style="position:relative;display:block;width:'+W+'px;height:'+H+'px;background:'+t.bg+
    ';border:1px solid '+t.line+';box-shadow:0 2px 6px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);flex:0 0 auto">'+
    els.map(function(s){return '<div style="'+s+'"></div>';}).join("")+'</div>'};
}

function benchHTML(m){

try{ var saved=localStorage.getItem("erfi-lang"); if(saved&&T[saved]) lang=saved; }catch(e){}

<script>
/* Real, verified extras. Only ph3 has them — never fabricate these for the other 28. */
function photoFail(img,id,H,hMm){ var m=byId(id); if(m) img.outerHTML=panelHTML(m,H,hMm); }

/* ---------- state ---------- */
var S={q:"",cat:"all",fmt:"all",who:"all",sort:"hp-desc",shot:null,pop:null};  /* null = not yet decided for this item */

function matches(m){
  if(S.fmt!=="all" && m.fmt!==S.fmt) return false;
  if(S.who!=="all" && m.who!==S.who) return false;
  if(S.cat!=="all" && m.cats.indexOf(S.cat)<0 && m.cat!==S.cat) return false;
  if(S.q){ var h=(m.mfr+" "+m.name+" "+m.cats.join(" ")+" "+blurbOf(m)).toLowerCase();
    if(h.indexOf(S.q.toLowerCase())<0) return false; }
  return true;
}
/* HP-sort tiebreak for the format families that don't carry real HP —
   standalone, accessories, other — so they don't just interleave
   alphabetically once everything's tied at 0. Eurorack (hp>0 almost
   always) sorts first either way; order after that matches the FORMAT
   chip row: standalone, then accessories, then other. */
var FMT_ORDER={eu:0, desk:1, acc:2, tools:3};
function sortList(a){
  var s=S.sort;
  return a.slice().sort(function(x,y){
    if(s==="hp-desc") return (y.hp-x.hp)||(FMT_ORDER[x.fmt]-FMT_ORDER[y.fmt])||x.name.localeCompare(y.name);
    if(s==="hp-asc")  return (x.hp-y.hp)||(FMT_ORDER[x.fmt]-FMT_ORDER[y.fmt])||x.name.localeCompare(y.name);
    if(s==="price-desc") return y.price-x.price;
    if(s==="price-asc")  return x.price-y.price;
    return x.name.localeCompare(y.name);
  });
}
var shown=function(){ return sortList(ITEMS.filter(matches)); };

/* ---------- chrome ---------- */
function renderChrome(){
  var T2=t();
  /* Entries carry their own href rather than relying on a parallel array,
     because "Join" is CONDITIONAL — the how-it-works page only exists in a
     language the user has published, so this list is a different length in
     different languages. Anything keyed on array position would then point
     at the wrong thing in one language and be right in another, which is
     the worst version of this bug: it works when you test it.
     Sits before Contact: join, then get in touch. The user asked for it in
     the nav; design had argued the nav was for buyers only, and this
     overrules that. */
  var navItems=[
    {href:"#grid-top", label:T2.nav[0]},
    {href:"#/wish",    label:T2.nav[1]},
    {href:"#/faq",     label:T2.nav[2]},
  ];
  if(HOW && howHasLang(lang)) navItems.push({href:"#/how", label:T2.navJoin});
  navItems.push({href:"#/msg/", label:T2.nav[3]});
  /* "#grid-top" needs return false: closeDetail() computes the real
     destination (#/s/<seller> or #/), and #grid-top — a plain same-page
     anchor, not one of this app's own routes — must not be left to
     overwrite it via the href's own default navigation. Keyed off the
     destination itself, not array position, so inserting a future nav
     item (FAQ) ahead of "Everything" can't silently move the suppression
     onto the wrong link — the exact shape of the bug this just was.
     The other two hrefs are fine unsuppressed: #/wish and #/msg/ are
     exactly where they should land regardless of what closeDetail()
     sets in between. */
  el("nav").innerHTML=navItems.map(function(n){
    return '<a href="'+n.href+'" onclick="closeDetail()'+(n.href==="#grid-top"?";return false":"")+'">'+esc(n.label)+'</a>'; }).join("");
  el("langseg").innerHTML=LANGS.map(function(l){
    return '<button data-lang="'+l+'" aria-pressed="'+(l===lang)+'">'+l+'</button>'; }).join("");
  document.documentElement.lang=lang;
  el("eyebrow").textContent=T2.eyebrow;
  el("h1").innerHTML=esc(T2.h1a)+'<em>'+esc(T2.h1b)+'</em>'+esc(T2.h1c);
  el("lede").textContent=T2.lede;
  var eu=ITEMS.filter(function(m){return m.fmt==="eu" && !isCase(m);});
  el("stats").innerHTML=
    stat(ITEMS.length,T2.sItems)+stat(eu.reduce(function(a,m){return a+m.hp;},0),T2.sHp)+stat(SELLERS.length,T2.sShelves);
  el("scaleCap").textContent=T2.scale;
  el("hoverCap").textContent=T2.hover;
  el("q").placeholder=T2.search;
  el("fmtLabelEl").textContent=T2.fmtLabel;
  el("shelfLabelEl").textContent=T2.shelfLabel;
  el("typeLabelEl").textContent=T2.typeLabel;
  el("wishH").textContent=T2.wishH;
  el("wishAll").innerHTML=esc(T2.seeFull)+' &rarr;';
  el("fIntro").textContent=T2.fIntro;
  el("fgrid").innerHTML=
    fcol(T2.fCollect,T2.fCollectBody)+fcol(T2.fTrade,T2.fTradeBody)+
    fcol(T2.fContact,'<p>'+esc(T2.fContactBody)+'</p><a class="btn sm" href="#/msg/">'+esc(T2.buyOrTrade)+'</a>');
  el("sort").innerHTML=Object.keys(T2.sort).map(function(k){
    return '<option value="'+k+'"'+(k===S.sort?" selected":"")+'>'+esc(T2.sort[k])+'</option>'; }).join("");
}
function stat(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'; }
function fcol(h,b){ return '<div><h4>'+esc(h)+'</h4>'+(b.charAt(0)==="<"?b:'<p>'+esc(b)+'</p>')+'</div>'; }

/* ---------- hero rack ---------- */
/* Rack slot: real photo if we have one, cropped to fill (object-fit:cover)
   rather than letterboxed — the rack's whole point is true-HP-proportional
   width, so a shrunk-to-fit photo would visually break that comparison.
   Falls back to the drawn faceplate, same as everywhere else. */
function rackHTML(m,H,hMm){
  hMm = hMm || 128.5;
  if(!m.img) return panelHTML(m,H,hMm);
  var W=Math.round(m.hp*5.08*(H/hMm));
  return '<img src="'+m.img+'" alt="'+esc(m.mfr+" "+m.name)+'" loading="lazy" '+
    'style="width:'+W+'px;height:'+H+'px;object-fit:cover;display:block" '+
    'onerror="photoFail(this,\''+m.id+'\','+H+','+hMm+')">';
}
function renderRack(){
  var eu=ITEMS.filter(function(m){return m.fmt==="eu" && !m.oneU && !isCase(m);});
  var oneU=ITEMS.filter(function(m){return m.fmt==="eu" && m.oneU && !isCase(m);});
  var total=eu.reduce(function(a,m){return a+m.hp;},0), half=total/2;
  var rows=[[]], run=0;
  eu.forEach(function(m){
    if(run>=half && rows.length<2){ rows.push([]); run=0; }
    rows[rows.length-1].push(m); run+=m.hp;
  });
  /* H1u (row height in px) uses 44.45mm — the 1U *rack space* (1.75"), which is
     what makes the row visually the right fraction of a 3U row's height.
     The third arg to rackHTML below is a DIFFERENT number on purpose: 39.65mm
     is the actual Intellijel-format 1U *panel* height (rail lip clearance
     accounts for the gap to 44.45), and that's the one width math needs —
     verified against all four 1U photos' true aspect ratios, independently
     landing at ~39.7-40mm each. Mixing these two up is the exact bug that
     shipped twice; keep them named differently if this is ever refactored. */
  var H=109, H1u=38;
  /* every row gets a blanking panel after its modules — flex:1 1 auto fills
     whatever width is left once .rackinner is stretched to the widest row,
     zero-width and invisible on that widest row itself */
  var oneURow = oneU.length ? '<div class="rail"></div><div class="rackrow">'+oneU.map(function(m){
    return '<button class="rackmod" data-go="'+m.id+'" title="'+esc(m.mfr+" "+m.name)+'" aria-label="'+esc(m.mfr+" "+m.name)+'">'+rackHTML(m,H1u,39.65)+'</button>';
  }).join("")+'<span class="blank"></span></div>' : '';
  var rowsHTML = rows.map(function(row){
    return '<div class="rail"></div><div class="rackrow">'+row.map(function(m){
      return '<button class="rackmod" data-go="'+m.id+'" title="'+esc(m.mfr+" "+m.name)+'" aria-label="'+esc(m.mfr+" "+m.name)+'">'+rackHTML(m,H)+'</button>';
    }).join("")+'<span class="blank"></span></div>'; }).join("")+'<div class="rail"></div>';
  el("rack").innerHTML = '<span class="cheek"></span><div class="rackinner">'+oneURow+rowsHTML+'</div><span class="cheek r"></span>';
}

/* ---------- filters ---------- */
/* The header says "Suodattimet" while open and the filter summary while
   collapsed, so its content depends on a class the collapse controller
   owns rather than on filter state alone. Both callers go through here so
   the two can't drift. */
var WISH_SUMMARY="", WISH_SUMMARY_DOT="var(--muted)";
function syncBarLabel(){
  var lab=el("collbarlabel"); if(!lab) return;
  var collapsed=el("grid-top").classList.contains("collapsed");
  lab.innerHTML = collapsed
    ? '<span class="odot" style="background:'+WISH_SUMMARY_DOT+'"></span>'+WISH_SUMMARY
    : esc(t().filtersLabel);
}
function renderFilters(){
  var T2=t();
  var count=function(f){ return ITEMS.filter(function(m){
    if(f.fmt) return m.fmt===f.fmt;
    if(f.who) return m.who===f.who;
    if(f.cat) return m.cats.indexOf(f.cat)>=0||m.cat===f.cat;
    return true; }).length; };
  /* format chips carry an icon (ico ic-<key>) instead of the plain chip()
     shape everything else uses — design's redesign, three visually
     distinct tiers instead of one flat wall of identical chips */
  el("fmtchips").innerHTML=["all","eu","desk","acc","tools"].map(function(k){
    var n=k==="all"?ITEMS.length:count({fmt:k});
    var faint=n===0&&k!=="all";
    return '<button class="chip ico ic-'+k+(faint?" faint":"")+'" data-fmt="'+k+'" aria-pressed="'+(S.fmt===k)+'">'+
      esc(T2.fmt[k])+'<span class="c">'+(faint?"–":n)+'</span></button>'; }).join("");
  /* owner chips: the seller's dot leads the name (no icon — the dot IS the
     marker), plus the same wishpop-on-hover preview the card ownerpill
     already has, using the same WANTS/wantLabel/T2.hunting this reuses
     everywhere else. "All" gets neither dot nor popover — there's no
     single seller's wants to preview. */
  el("whochips").innerHTML=
    '<button class="chip ico ic-all" data-who="all" aria-pressed="'+(S.who==="all")+'">'+esc(T2.who.all)+'<span class="c">'+ITEMS.length+'</span></button>'+
    SELLERS.map(function(p){
      var n=count({who:p.key});
      return '<button class="chip owner haspop" data-who="'+p.key+'" aria-pressed="'+(S.who===p.key)+'">'+
        '<span class="odot" style="background:'+p.dot+'"></span>'+esc(p.name)+'<span class="c">'+n+'</span>'+
        '<span class="wishpop"><span class="wp-h">'+esc(p.name+" "+T2.hunting)+'</span>'+
        '<span class="wp-l">'+wishPopBody(p.key)+'</span></span>'+
        '</button>'; }).join("");
  el("catchips").innerHTML=CATKEYS.map(function(k){
    var n=k==="all"?ITEMS.length:count({cat:k});
    var faint=n===0&&k!=="all";
    var cls=(k==="all"?"ico ic-all":"")+(faint?" faint":"");
    return '<button class="subchip'+(cls?" "+cls.trim():"")+'" data-cat="'+k+'" aria-pressed="'+(S.cat===k)+'">'+
      esc(T2.cat[k]||k)+'<span class="c">'+(faint?"–":n)+'</span></button>'; }).join("");
  /* Summary built from filter STATE (S), not scraped from the chip DOM, so
     it stays correct regardless of how the chips render. No new copy:
     composed from the same translated chip labels used above.

     TWO RULES, which used to be one. While the summary was the only thing
     the bar ever showed, "the dot matches the edge" said everything. The
     open header now shows a word instead, so they come apart:

       THE EDGE says whether an owner is filtered, in BOTH states —
       3px in that owner's colour, or 1px --line when none.
       THE DOT marks WHICH NAME you are reading, so it belongs to the
       summary, which only exists when collapsed. No name, nothing to mark.

     Open, the chips below already name the owner — the same argument that
     took the summary text out of the open state.

     The edge now lives on .controls rather than on .collbar. Under one
     surface it has to underline the whole filter unit, not the strip at
     its top; it also means exactly one element carries a bottom border in
     either state, which is what stops the pale double line coming back. */
  var sellerFilter = S.who!=="all" ? SELLER_BY_KEY[S.who] : null;
  var sumParts=[];
  if(S.fmt!=="all") sumParts.push("<b>"+esc(T2.fmt[S.fmt])+"</b>");
  if(sellerFilter) sumParts.push("<b>"+esc(sellerFilter.name)+"</b>");
  if(S.cat!=="all") sumParts.push("<b>"+esc(T2.cat[S.cat]||S.cat)+"</b>");
  WISH_SUMMARY = sumParts.length ? sumParts.join(" · ") : esc(T2.fmt.all);
  WISH_SUMMARY_DOT = sellerFilter ? sellerFilter.dot : "var(--muted)";
  syncBarLabel();
  var ctl=el("grid-top");
  ctl.style.borderBottomColor = sellerFilter ? sellerFilter.dot : "";
  ctl.style.borderBottomWidth = sellerFilter ? "3px" : "";
}

/* ---------- wish band ---------- */
/* a want entry is either a real-item object (drives the Toiveet faceplate)
   or a placeholder string — Home's teaser only ever needs a text label,
   whichever shape it is */
var wantLabel=function(w){ return typeof w==="string" ? w : (w.mfr+" "+w.name); };
/* Home's teaser chips sit in a half-width card — a real "mfr + name" label
   (e.g. "Noise Engineering Mimetic Digitwolis") eats the full row width and
   wraps one chip per line, reading as a vertical list instead of a spread.
   Model name only here; the Toiveet page has the width for the full label
   and is where being complete is the job. */
var wantLabelShort=function(w){ return typeof w==="string" ? w : w.name; };
/* Body of the hover popovers on owner chips and owner pills. Short labels
   (model only) because .wishpop is 220px and a full "maker + model" like
   "Noise Engineering Mimetic Digitwolis" overflows the panel — the module
   page's trade panel is ~440px and deliberately keeps the full label,
   where being complete is the job. A seller with nothing on their list
   still gets a popover, saying so: someone hovering a named person's chip
   has asked a question, and "nothing right now" answers it where an empty
   box reads as broken. */
function wishPopBody(key){
  var list=WANTS[key]||[];
  if(!list.length) return '<span class="wp-none">'+esc(t().noWishes)+'</span>';
  return list.map(function(w){ return '<span class="want">'+esc(wantLabelShort(w))+'</span>'; }).join("");
}
/* Home is a light teaser, not the full inventory — the complete list is
   what the Toiveet page is for. Cap the chips shown here so a long
   wishlist doesn't eat the space between the filter bar and the grid, and
   so two sellers with very different list lengths don't render at wildly
   different card heights. Takes the first N of p.wants as-is — order is
   whatever the seller dragged it into in the CMS (Decap's list widget
   supports drag-to-reorder natively), so reordering there is how priority
   is set: top of the list shows first here, nothing extra to build. */
var WISH_FLOW_CAP=4;   /* a taste of what someone wants, not their list */
/* The home-page band is a teaser for what people are after, so a seller
   with an empty wishlist is left out of it entirely — they have nothing
   to tease, and a card saying so takes a slot from someone who does.
   They still appear on the Toiveet page itself (at the bottom, with a
   stated empty state), so they aren't hidden from the site, just from
   the shortlist. If nobody has wishes yet the whole band is hidden
   rather than left as a heading over nothing. */
/* The name and the wants both take --ink2, a fixed token, NOT the seller's
   hue. Sellers pick their own colour in admin without either of us seeing
   it, so deriving the name's colour from that choice makes readability
   depend on a stranger's pick — a dark pick would vanish on the dark theme
   with nothing to flag it. A fixed token removes that failure class rather
   than handling it, and --ink2 clears 4.5 in both themes on its own (8.32
   light, 11.29 dark). Not --muted, which fails light at 3.80.
   The circle keeps the RAW seller colour in both themes: colour is
   identity and never carries a word, exactly as the filter bar's owner
   edge works. Bold Archivo against regular mono already separates the
   name from the wants without a second colour. */
function renderWish(){
  var T2=t();
  var withWishes=SELLERS.filter(function(p){ return p.wants.length>0; });
  var band=el("wish");
  if(band) band.hidden=withWishes.length===0;
  /* One flowing row rather than a card each: this sits directly above a bar
     full of filter chips, and anything bordered here reads as another
     control instead of as something a person wants. Wrapping also means a
     ninth seller costs a fraction of a line rather than a whole box.
     The dot and the name are one nowrap unit — without it a line can end on
     a bare coloured circle with its name orphaned onto the next. */
  el("wishgrid").innerHTML=withWishes.map(function(p){
    var shown=p.wants.slice(0,WISH_FLOW_CAP), extra=p.wants.length-shown.length;
    var wants=shown.map(function(w){ return '<span class="w">'+esc(wantLabelShort(w))+'</span>'; })
      .concat(extra>0?['<span class="w more">+'+extra+'</span>']:[])
      /* <wbr> AFTER EACH SEPARATOR, and it is load-bearing. These spans are
         joined with no whitespace between them, so the row had NO BREAK
         OPPORTUNITY anywhere — white-space is normal throughout and it
         would have wrapped happily, but there was nowhere to wrap. The
         whole band sat on one unbreakable line and pushed the PAGE
         sideways: 704px of document against a 358px phone, horizontally
         scrollable, on every listing view.
         <wbr> rather than a space: it is zero-width, so the 16px-between-
         names against 34px-between-people ratio this band was measured to
         is unchanged. A space would have been visible and would have
         altered exactly what that comment says was tuned. */
      .join('<span class="sep">·</span><wbr>');
    return '<span class="wperson">'+
      '<span class="who">'+
        '<i style="background:'+p.dot+'"></i>'+esc(p.name)+'</span>'+
      '<span class="wants">'+wants+'</span></span>'; }).join("<wbr>");
}

/* ---------- grid ---------- */
/* 22-point starburst, radii 50/40.5 on a 100 viewBox — design's geometry,
   pasted from their mockup rather than recomputed, so the shape stays
   identical if this is ever regenerated. */
var TINK_POINTS="50.00,0.00 55.76,9.91 64.09,2.03 66.82,13.16 77.03,7.94 76.52,19.39 87.79,17.26 84.07,28.10 95.48,29.23 88.86,38.59 99.49,42.88 90.50,50.00 99.49,57.12 88.86,61.41 95.48,70.77 84.07,71.90 87.79,82.74 76.52,80.61 77.03,92.06 66.82,86.84 64.09,97.97 55.76,90.09 50.00,100.00 44.24,90.09 35.91,97.97 33.18,86.84 22.97,92.06 23.48,80.61 12.21,82.74 15.93,71.90 4.52,70.77 11.14,61.41 0.51,57.12 9.50,50.00 0.51,42.88 11.14,38.59 4.52,29.23 15.93,28.10 12.21,17.26 23.48,19.39 22.97,7.94 33.18,13.16 35.91,2.03 44.24,9.91";
/* aria-hidden and pointer-events:none: the badge is decoration here. On the
   product page the same fact is stated in text right under the price, and
   on a card the price is a link to that page — so nothing is announced
   twice and nothing is announced only in colour. */
/* MEASURED, not assumed, because the badge is a fixed circle and the
   longest line varies by language: at design's .165 ratio the widest
   string we ship, Swedish "prutbart", renders 50.4px inside a 55.6px inner
   circle on a 60px card badge. Tight but clear, and it is the constraint
   that picked the word. Anything longer than about nine characters will
   NOT fit — measure a new string here before adding it rather than
   trusting the ratio. */
function tinkHTML(m,size){
  if(!m.haggle) return "";
  var T2=t();
  return '<span class="tink" style="--s:'+size+'px" aria-hidden="true">'+
    '<svg viewBox="0 0 100 100"><polygon points="'+TINK_POINTS+'" fill="var(--haggle)"/></svg>'+
    '<span>'+esc(T2.haggle1)+(T2.haggle2?'<br>'+esc(T2.haggle2):'')+'</span></span>';
}
function card(m){
  var T2=t(), p=SELLER_BY_KEY[m.who];
  return '<button class="card" data-go="'+m.id+'">'+
    '<div class="shot">'+shotHTML(m,182)+tinkHTML(m,60)+'</div>'+
    (m.negotiating?'<span class="negribbon"><span>'+esc(T2.negRibbon)+'</span></span>':'')+
    '<div class="cbody"><div class="mfr">'+esc(m.mfr)+'</div><h3>'+esc(m.name)+'</h3>'+
    '<p class="blurb">'+esc(blurbOf(m))+'</p>'+
    '<div class="tags">'+m.cats.slice(0,3).map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join("")+
    '<span class="ownerpill haspop" data-pop="'+m.id+'"><i style="background:'+p.dot+'"></i>'+esc(p.name)+
      '<span class="wishpop'+(S.pop===m.id?" open":"")+'">'+
        '<span class="wp-h">'+esc(p.name+" "+T2.hunting)+'</span>'+
        '<span class="wp-l">'+wishPopBody(p.key)+'</span>'+
      '</span>'+
    '</span></div></div>'+
    '<div class="cardfoot"><span class="price">'+eur(m.price)+'</span>'+
    (m.hp>0?'<span class="hpstamp">'+m.hp+' '+esc(T2.sHp)+'</span>':'')+
    /* no CTA at all when negotiating, not a disabled one — the ribbon is
       the only marker; the item can't be bought so offering the action
       is wrong, per design's spec */
    (m.negotiating?"":'<span class="cta">'+esc(T2.moreInfo)+'</span>')+
    '</div></button>';
}
function renderGrid(){
  var T2=t(), list=shown();
  el("grid").innerHTML=list.map(card).join("");
  var e=el("empty");
  e.hidden=list.length>0;
  e.textContent=(S.fmt==="tools")?T2.emptyTools:T2.emptyNone;
  /* count only — the combined price of everything visible was discouraging
     to read and isn't a number anyone is shopping by. T2.onScreen is left
     defined but unused rather than deleted: it's translated copy, and the
     total may come back somewhere it reads as information. */
  el("countline").innerHTML='<span>'+list.length+' '+esc(String(T2.ofItems).replace(/\d+/,ITEMS.length))+'</span>';
  el("collcount").textContent=list.length+" / "+ITEMS.length;
}
</script>

<script>
/* ---------- module page ---------- */
var SHOTS=[["render","Panel drawing"],["front","Photo — front"],["back","Photo — back"],["rack","Photo — in the rack"]];
/* which of the 4 shot slots this module actually has — 0 is the drawn
   faceplate, 1/2/3 are img/img2/img3, each independently optional. Any
   item can carry between zero (drawing only) and three real photos. */
/* slot 0 is a procedurally-drawn eurorack faceplate — meaningless for a
   shop accessory (no HP, no parts, nothing to draw), so it doesn't exist
   as a slot for fmt:"acc" at all. The >1-shot gate that hides the photo
   switcher already does the rest: an accessory ends up with a bare photo
   and no chrome, same as any single-photo item. */
/* Slot 0 is the DRAWN faceplate, and it exists only when there is no real
   photo of the thing. The drawing is derived from knob/jack/LED counts, so
   it is an approximation and often visibly wrong next to the actual panel —
   offering it as an alternative view of an item we have photographed
   invites the comparison and loses it. It stays as the fallback for items
   with no photo at all, where an approximate panel still tells you the
   width and rough layout. Accessories never get one. */
function shotHasPhoto(m){ return !!(m.img || m.img2 || m.img3); }
function shotHas(m,i){ return (i===0 && m.fmt!=="acc" && !shotHasPhoto(m)) || (i===1 && !!m.img) || (i===2 && !!m.img2) || (i===3 && !!m.img3); }
function shotAvail(m){ return [0,1,2,3].filter(function(i){ return shotHas(m,i); }); }
/* S.shot survives navigation between items, so it can name a slot the new
   item hasn't got — which would render an empty bench. Always land on a
   slot that exists. */
function shotFor(m){ var a=shotAvail(m); return a.indexOf(S.shot)>=0 ? S.shot : (a.length?a[0]:0); }
var CHEVRON_L='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* watch, youtu.be, embed and shorts links all map to the same 11-char id */
/* mechanical "you may also like" for items nobody has hand-picked related
   items for yet — same maker first, then same primary category or any
   shared tag, capped at 3 total. No editorial judgment, just enough to
   not be empty. Two passes so brand matches always win the slots before
   category matches, rather than whichever comes first in ITEMS order. */
function autoRelated(m){
  var T2=t(), out=[], seen={};
  function add(id, label){
    if(seen[id] || out.length>=3) return;
    seen[id]=true; out.push([id, label]);

  ITEMS.forEach(function(o){
    if(o.id===m.id || out.length>=3) return;

  ITEMS.forEach(function(o){
    if(o.id===m.id || out.length>=3) return;
    var shared = o.cat===m.cat ? o.cat : (o.cats||[]).filter(function(c){ return (m.cats||[]).indexOf(c)>=0; })[0];

        : '<a class="btn" href="'+esc(formFor(m))+'" target="_blank" rel="noopener">'+esc(T2.buyOrTrade)+

  if(x.overview) out+='<div class="specrows" style="margin-top:1.5rem;max-width:56ch">'+

    /* shop reviews live on the shop's own product page, not a magazine —

    '<div class="qcards">'+posQuotes.map(function(q){

    if(m.site) links.push({k:m.mfr,v:T2.official,u:"https://"+m.site});
    if(m.mgSlug) links.push({k:"ModularGrid",v:T2.mgNote,u:"https://modulargrid.net/e/"+m.mgSlug});

/* ---------- message form ---------- */
/* The message form lives on Tally, not on this page — the site only opens it
   prefilled, so there is no local "sent" state to fake.
   A seller may have their own form (seller.form), so an enquiry about their
   item reaches them rather than a shared inbox everyone has to read. The
   address itself lives in that form's Tally notification settings, never in
   content/sellers/*.json — seller JSON is fetched by the browser at runtime,
   so anything in it is public by construction.
   No form set = the shared form, which is what everyone had before. */
var TALLY_URL="https://tally.so/r/rjMyQo";
/* Tally hidden fields are addressed by the NAME the form author gave them
   (?module=…&seller=…), and a name survives duplicating the form. These
   used to be the fields' block UUIDs instead — which are minted fresh per
   form, so every per-seller duplicate would have opened blank while Tally
   silently ignored the unrecognised params. Verified against the live
   form's own definition: block 1a5c14a8… is named "module", 2f0d1cb8…
   "seller", ef696402… "price", c55a5b51… "lang".
   Names are case-sensitive and must match the Tally dashboard exactly.
   These four are HIDDEN on the form: the sender doesn't see which item
   they're asking about, and the user settled that they don't need to.
   So don't add visible item fields to a duplicated form — that decision
   was taken deliberately, not left undone. */
var TALLY_FIELDS={ module:"module", seller:"seller", price:"price", lang:"lang" };
/* the form an enquiry about this item should land in */
function formFor(m){
  var p=m?SELLER_BY_KEY[m.who]:null;
  return (p && p.form) ? p.form : TALLY_URL;
}
/* A SELLER'S FORM NEED NOT BE A TALLY FORM. The joining sequence lets a
   seller send any page a buyer can reach them on — their own site's
   contact page counts — and everything below this line is Tally-specific,
   so an arbitrary URL has to take a different path:

   - data-tally-src is mounted by Tally's embed.js, which only recognises
     its own URLs. Anything else never mounts and the panel stays blank.
   - Even mounted, most sites send X-Frame-Options or frame-ancestors and
     refuse to be framed at all.
   - The query string is Tally HIDDEN FIELD NAMES. On someone else's URL
     they are meaningless, and they would push the item and its price into
     a third party's logs for nothing.

   So: Tally forms embed as before; anything else opens in a new tab, the
   same shape shopUrl already uses for an outbound shop. */
function isEmbeddableForm(url){
  return /^https:\/\/([a-z0-9-]+\.)*tally\.so\//i.test(String(url||""));
}
/* PREFILL ONLY WORKS ON THE SHARED FORM, and that is now settled policy
   rather than a limitation to route around.
   The hidden fields are matched by NAME, so they exist only on a form that
   came from ours. Checked against the live forms: the shared form and
   spongefile's carry module/seller/price/lang; Kalle's and Kari's carry
   none — every enquiry about their 22 listings arrived with no indication
   of which item it was about, and nothing on either side reported it.
   THE ANSWER IS NOT TO MAKE SELLERS USE OUR FORM. Sellers make their own,
   the user has confirmed that is how it will keep working, and a Tally
   public template would only have covered the sellers who happen to use
   Tally at all. Instead the seller is asked to put a visible "which
   module?" question on their form, and the note below hands the buyer the
   exact name to put in it. That works for any contact method — Tally, a
   personal site, anything — needs no template to maintain, and has no
   per-seller flag anyone has to keep accurate. */
function sellerOwnsForm(m){
  var p=m?SELLER_BY_KEY[m.who]:null;
  return !!(p && p.form);
}
/* PER SELLER, because not every seller will do a fiddly setup step and
   the design must not require one. Prefill needs four hidden fields named
   module/seller/price/lang, and they exist only on a form built to have
   them — adding them by hand is exact, error-prone work that some sellers
   will do and others reasonably won't.
   So this records what a FORM has, and nothing about whoever owns it. A
   seller who never touches theirs loses nothing: the note below already
   names the module without any setup at all, and prefill is strictly an
   optimisation on top.
   ABSENT MEANS FALSE, and it stays absent until someone has actually
   opened that seller's form and seen the four names. */
function formHasOurFields(m){
  var p=m?SELLER_BY_KEY[m.who]:null;
  if(!p || !p.form) return true;      /* the shared form is ours */
  return p.formFields===true;         /* opt-in, verified by looking */
}
function tallyLink(m){
  var target=formFor(m);
  /* only where there are fields to receive them: the shared form always,
     a seller's own form only once we have looked and ticked the box */
  if(!isEmbeddableForm(target) || !formHasOurFields(m)) return target;
  var p=SELLER_BY_KEY[m.who], q=[];
  q.push(TALLY_FIELDS.module+"="+encodeURIComponent(m.mfr+" — "+m.name));
  q.push(TALLY_FIELDS.seller+"="+encodeURIComponent(p.name));
  q.push(TALLY_FIELDS.price+"="+encodeURIComponent(eur(m.price)));
  q.push(TALLY_FIELDS.lang+"="+encodeURIComponent(lang));
  return target+"?"+q.join("&");
}
</script>

<script>
/* Faceplates are fixed-pixel art, so they cannot fluid-scale on their own.
   Measure the bench and pick the tallest H whose true-scale width still fits. */
/* Re-draws the faceplate smaller when the bench is too narrow for it at
   full height. Targets the shot container, NOT .bench: the prev/next
   buttons are .bench's own children, so writing bench.innerHTML deleted
   them — the arrows vanished on the drawn-panel slot and nowhere else,
   which is exactly where this runs. */
function fitPanel(m){
  var slot=document.querySelector(".bench .benchshot"); if(!slot) return;
  var avail=slot.clientWidth-32;
  var perPx=m.hp>0 ? (m.hp*5.08/128.5) : 1.55;
  var H=Math.max(120,Math.min(282,Math.floor(avail/perPx)));
  if(H<282) slot.innerHTML=panelHTML(m,H);
}

/* ---------- admin composer ---------- */
/* Structural only — no fetching, no publishing. Specs come from typing them
   in, or from asking Claude in chat to research a maker+model first and
   paste the result in here. Output is a paste-ready RAW row + BLURB entry. */
var AS={
  id:"", mfr:"", name:"", fmt:"eu", hp:"", tone:"black",
  k:"",j:"",sl:"",led:"",sc:false,
  cat:"", cats:[], price:"", mgSlug:"", site:"", who:"spongefile",
  blurbEn:"", blurbFi:"", blurbSv:""
};
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,10); }
/* Output matches content/items/<id>.json exactly — the same shape whether a
   listing arrives via this form, a Claude chat that researched it, or a
   direct git commit. One format, three ways to produce it. */
function adminOutput(){
  var id=AS.id||slugify(AS.mfr+AS.name)||"id";
  var cats=AS.cats.length?AS.cats:(AS.cat?[AS.cat]:[]);
  var item={
    id:id, mfr:AS.mfr||"", name:AS.name||"",
    price:+AS.price||0, hp:AS.fmt==="eu"?(+AS.hp||0):0,
    fmt:AS.fmt, who:AS.who, cat:AS.cat||cats[0]||"", cats:cats,
    blurb:{en:AS.blurbEn||"", fi:AS.blurbFi||"", sv:AS.blurbSv||""},
    mgSlug:AS.mgSlug||"", site:AS.site||"", tone:AS.tone,
    parts:{k:+AS.k||0, j:+AS.j||0, sl:+AS.sl||0, led:+AS.led||0, sc:AS.sc?1:0},
    negotiating:false, haggle:false
  };
  return {json:JSON.stringify(item,null,2), id:id};
}
function updateAdminOutput(){
  var out=adminOutput();
  var r=el("aout-raw");
  if(r) r.textContent=out.json;
  var f=el("aout-filename");
  if(f) f.textContent="content/items/"+out.id+".json";
}
function adminField(af,label,type,extra){
  extra=extra||"";
  if(type==="textarea") return '<div class="afld"'+extra+'><label>'+label+'</label><textarea data-af="'+af+'">'+esc(AS[af])+'</textarea></div>';
  return '<div class="afld"'+extra+'><label>'+label+'</label><input data-af="'+af+'" type="'+type+'" value="'+esc(AS[af])+'"></div>';
}
/* Toiveet — one seller section per row, each a single click target back to
   Home with that seller's owner filter preset. A real-item want gets a
   real photo when one's been found (manufacturer's own site — a drawing
   is only ever the fallback, same rule as every listing photo), else the
   drawn faceplate; a placeholder string gets a dashed empty outline and
   no label — the presence/absence of a drawing/photo is the whole signal,
   not a caption. */
var WISH_TILE_H=150;
/* Widest a tile's contents can be in the NARROWEST column the wish grid
   produces: minmax(140px,1fr) less .wishtile's .6rem side padding. */
var WISH_TILE_MAX_W=121;
/* A drawn faceplate is absolutely-positioned pixel children, so max-width
   would crop it rather than scale it — it has to be re-drawn smaller.
   buildPanel derives width from the same hp × 5.08 × (H/hMm) as below, so
   scaling the height by the overflow ratio scales the width with it and
   keeps the panel in proportion. Photos take the opposite route (CSS,
   see wishTileHTML): they scale as one image. Don't unify the two — one
   path would clip the panel. */
function wishPanelHTML(w){
  var ww=w.hp>0?Math.round(w.hp*5.08*(WISH_TILE_H/128.5)):Math.round(WISH_TILE_H*1.55);
  var H=ww>WISH_TILE_MAX_W?Math.round(WISH_TILE_H*(WISH_TILE_MAX_W/ww)):WISH_TILE_H;
  return panelHTML(w,H);
}
/* a dead photo falls back to the drawn panel, so it needs the same clamp —
   otherwise a wide module's broken image overflows the tile instead */
function wishImgFail(img,data){
  var w=JSON.parse(data);
  img.outerHTML=wishPanelHTML(w);
}
function wishTileHTML(w){
  /* a placeholder want is free text (admin: "Just a note") — must render
     it, not just draw an empty dashed box. A seller typing a real want in
     there and seeing nothing back is indistinguishable from "my edit
     didn't save", which is exactly the wrong impression to give someone
     new to the admin (this silently ate three of Sampo's real edits
     before it was caught). aria-hidden dropped for the same reason: the
     tile can carry real content now. */
  if(typeof w==="string") return '<div class="wishtile placeholder"><div class="wl">'+esc(w)+'</div></div>';
  var ww=w.hp>0?Math.round(w.hp*5.08*(WISH_TILE_H/128.5)):Math.round(WISH_TILE_H*1.55);
  /* A photo is sized from HP alone, so a wide module (Fumana is 42HP =
     249px) used to spill out of its ~147px tile. max-width hands the
     tile the final say, and aspect-ratio + height:auto let the height
     follow so the object-fit crop stays true instead of squashing. In a
     tile wider than the natural size nothing changes — still 150px tall.
     Pure CSS, so it stays correct at every column width with no
     measurement. */
  var wf=w.img
    ? '<img src="'+esc(w.img)+'" alt="'+esc(w.mfr+" "+w.name)+'" loading="lazy" '+
      'style="width:'+ww+'px;max-width:100%;aspect-ratio:'+ww+'/'+WISH_TILE_H+';height:auto;object-fit:cover;display:block" '+
      'onerror="wishImgFail(this,\''+esc(JSON.stringify({mfr:w.mfr,name:w.name,hp:w.hp,tone:w.tone,parts:w.parts}))+'\')">'
    : wishPanelHTML(w);
  return '<div class="wishtile"><div class="wf">'+wf+'</div>'+
    '<div class="wl">'+esc(w.mfr)+'<br>'+esc(w.name)+'</div></div>';
}
function wishHTML(){
  var T2=t();
  return '<div class="wrap wishpage"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(T2.nav[0])+'</button></div>'+
    '<h1>'+esc(T2.wishH)+'</h1>'+
    /* sellers with wishes first, empty ones after — the page is a list of
       what people want, so the ones wanting nothing belong at the end
       rather than interrupting it. Stable within each group, so the
       underlying seller order is otherwise preserved. */
    SELLERS.filter(function(p){ return p.wants.length>0; })
      .concat(SELLERS.filter(function(p){ return p.wants.length===0; }))
      .map(function(p){
      return '<a class="wishsection" id="wish-'+esc(p.key)+'" href="#/s/'+p.key+'"'+
        ' style="border-left-color:'+p.dot+'">'+
        '<div class="nm"><i style="background:'+p.dot+'"></i>'+esc(p.name)+'</div>'+
        (p.wants.length
          ? '<div class="wish-imggrid">'+p.wants.map(wishTileHTML).join("")+'</div>'
          : '<p class="wishempty">'+esc(T2.noWishes)+'</p>')+
        '</a>'; }).join("")+
    '<p class="wishnote">'+esc(T2.wishK)+'</p>'+
    '</div>';
}

/* ---------- FAQ page ---------- */
/* Two-column row per question — 64px mono gutter carrying the zero-padded
   index and the deep-link anchor, same gutter idiom as the filter bar's
   labels and the module page's spec rows, so this reads as part of the
   site rather than a bolted-on article (per the handoff). Nav label and
   h1 are the literal string "FAQ" in every language — the user's own
   call, not a missing translation — so unlike everything else on this
   page they're written directly rather than through T. */
/* ---------- How this works (#/how) ---------- */
/* A DELIBERATELY TINY MARKUP SUBSET — **bold**, *italic*, [text](url) —
   applied AFTER escaping, so nothing in the JSON can inject markup. The
   page needs emphasis mid-sentence in about a dozen places and a couple of
   links; anything more and this should become real content blocks rather
   than growing a parser. */
function howMd(str){
  var e=esc(String(str==null?"":str));
  e=e.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_,t,u){
    var ext=/^https?:/i.test(u);
    return '<a href="'+u+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+t+'</a>';
  });
  e=e.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  e=e.replace(/\*([^*]+)\*/g,"<i>$1</i>");
  return e;
}
/* SERVES A LANGUAGE ONLY IF IT IS PUBLISHED, not merely if it is written.
   That distinction became load-bearing the moment real translations landed
   in how.json: before, unpublished meant empty, so falling back on
   emptiness happened to be correct. With the text present but unapproved,
   the same code rendered a fully Finnish page underneath a banner saying
   the page was English only — the banner and the page contradicting each
   other, and unreviewed copy shown anyway.
   So the gate decides the language, and emptiness is only the last-resort
   fallback within a published one. */
function howT(v){
  if(!v) return "";
  var use = howHasLang(lang) ? lang : "en";
  return (v[use] && v[use].trim()) ? v[use] : (v.en||"");
}
function howList(arr){
  return (arr||[]).map(function(x){ return '<li>'+howMd(howT(x))+'</li>'; }).join("");
}
/* TWO SEPARATE CONDITIONS, deliberately, because they are two different
   facts. An earlier version gated purely on "has this language been
   written", which quietly made TRANSLATED and APPROVED the same signal —
   so pasting a draft translation into how.json would have published it in
   that language, in one commit, which is precisely what the review was
   meant to prevent. Translations get handed over routinely; approval is a
   deliberate act by the user after reading.
   So a language goes live only when it is BOTH listed in HOW.live and
   actually written. A draft can now sit in this file safely. Absent or
   malformed live means English only — the failure falls towards not
   publishing. */
function howHasLang(l){
  if(!HOW) return false;
  var live=Array.isArray(HOW.live)&&HOW.live.length?HOW.live:["en"];
  if(live.indexOf(l)<0) return false;
  return !!(HOW.lede && HOW.lede[l] && HOW.lede[l].trim());
}

/* ---------- routing ---------- */
/* photo is the default view whenever one exists — matches the grid card,
   which already shows the photo first; drawn panel becomes the alternate */
function openDetail(id){ var m=byId(id); S.shot=m?shotAvail(m)[0]:0; location.hash="#/m/"+id; }
/* the nav's "Everything" link used to be a plain href="#grid-top" same-
   page anchor, which raced this: an onclick fires first, but the
   anchor's own href navigation fires right after and would overwrite
   whatever hash closeDetail() just computed. #grid-top isn't one of
   this app's own routes, so that native jump did the scrolling but
   silently destroyed the seller URL closeDetail() had just restored —
   invisible in-session (S.who was still correct in memory) and only
   real on reload. Scrolling now happens here instead, after the hash is
   set, so there's nothing left for a stale href to win against. */
function closeDetail(){
  if(location.hash.indexOf("#/m/")===0 || location.hash.indexOf("#/msg/")===0 || location.hash.indexOf("#/admin")===0 || location.hash.indexOf("#/wish")===0 || location.hash.indexOf("#/faq")===0){
    location.hash=S.who!=="all"?"#/s/"+S.who:"#/";
    var gt=el("grid-top"); if(gt) gt.scrollIntoView();
  }
}
/* Marks the current SECTION in the nav, not the exact hash — a module
   page (#/m/<id>) and a seller-filtered grid (#/s/<seller>) are both
   still "Everything" (no page of their own, per the seller-URL
   contract), and the module page's own breadcrumb already says
   "back to Everything", so leaving the nav unmarked there would
   contradict it. #/admin marks nothing: it isn't one of the four nav
   destinations. Order matches the anchors/T2.nav arrays in
   renderChrome() (grid-top, wish, faq, msg) index-for-index — rebuilt
   fresh by renderChrome() on every language switch, so this must be
   re-applied every route() call rather than set once. */
function syncNavCurrent(h){
  /* MATCHED ON HREF, NOT POSITION. This used to compare an index against
     the link's position in the list, which was correct only while the list
     was always the same four items. "Join" is conditional — it is absent in
     a language the how-it-works page has not been published in — so every
     index after it shifts in some languages and not others, and the marker
     would land on the wrong link in exactly the languages nobody tests.
     The file already learned this once, for the #grid-top click
     suppression; the comment there says keyed off the destination itself,
     not array position. Same rule, applied to the other half. */
  var want = h.indexOf("#/wish")===0 ? "#/wish"
    : h.indexOf("#/faq")===0 ? "#/faq"
    : h.indexOf("#/how")===0 ? "#/how"
    : h.indexOf("#/msg/")===0 ? "#/msg/"
    : h.indexOf("#/admin")===0 ? null   /* not a nav destination */
    : "#grid-top";
  Array.prototype.forEach.call(el("nav").querySelectorAll("a"),function(a){
    if(want && a.getAttribute("href")===want) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
}
function route(){
  var h=location.hash;
  syncNavCurrent(h);
  /* "#/wish" is the page; "#/wish/<sellerKey>" scrolls to that seller's
     section. Same constraint as #/faq/<id>: a URL carries one fragment, so
     the seller has to be a route segment rather than a second anchor —
     "#/wish#sampo" isn't expressible. Scrolls rather than filters: the
     other sellers staying visible is the point of this page, and the
     pinned name plus the owner's coloured edge are what keep the reader
     oriented once they're there.
     An unknown or stale key falls through to the top of the page rather
     than to a blank one. */
  if(h.indexOf("#/wish")===0){
    var wkey = h.indexOf("#/wish/")===0 ? h.slice(7) : null;
    el("detail").innerHTML=wishHTML();
    document.body.classList.add("detail-open");
    document.title=t().wishH+" — eurorack.fi";
    var wtarget = wkey && el("wish-"+wkey);
    if(wtarget) wtarget.scrollIntoView(); else window.scrollTo(0,0);
    return;
  }
  /* "#/faq" is the page; "#/faq/<id>" scrolls to one question. The second
     segment has to be part of the route (not a separate "#id" browser
     anchor) — a compound hash like "#/faq#can-i-join" isn't valid. So the
     id on each <section> is the bare slug, used only as a scrollIntoView
     target here; the browser's own native hash-jump never fires because
     location.hash is never literally "#can-i-join". */
  if(h.indexOf("#/faq")===0){
    var fid = h.indexOf("#/faq/")===0 ? h.slice(6) : null;
    el("detail").innerHTML=faqHTML();
    document.body.classList.add("detail-open");
    document.title="FAQ — eurorack.fi";
    var ftarget = fid && el(fid);
    if(ftarget) ftarget.scrollIntoView(); else window.scrollTo(0,0);
    return;
  }
  if(h.indexOf("#/admin")===0){
    el("detail").innerHTML=adminHTML();
    document.body.classList.add("detail-open");
    document.title="Add a listing — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  if(h==="#/how"||h==="#/how/"){
    el("detail").innerHTML=howHTML();
    document.body.classList.add("detail-open");
    document.title=(HOW?howT(HOW.title):"How this works")+" — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/msg/")===0){
    var m=byId(h.slice(6));
    var backHref = m ? "#/m/"+m.id : "#/";
    /* A bookmarked or hand-typed #/msg/<id> can still land here for a
       seller whose form is their own page. Send them to it rather than
       render an iframe that would come back blank — the detail page's
       button already goes straight out, so this only catches direct hits. */
    if(m && !isEmbeddableForm(formFor(m))){
      location.replace(formFor(m)); return;
    }
    el("detail").innerHTML='<div class="wrap msgpage">'+
      '<div class="msgbar"><a class="back" href="'+backHref+'">&larr; '+esc(t().nav[0])+'</a></div>'+
      '<iframe class="msgframe" data-tally-src="'+(m?tallyLink(m):TALLY_URL)+(m?"&":"?")+'transparentBackground=1" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Message eurorack.fi"></iframe>'+
      '</div>';
    document.body.classList.add("detail-open");
    document.title="Message — eurorack.fi";
    /* embed.js only scans the DOM once, on load — a dynamically inserted
       iframe needs an explicit re-scan or it never mounts */
    if(window.Tally) window.Tally.loadEmbeds();
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/m/")===0){
    var m=byId(h.slice(4));
    if(m){
      /* a direct/bookmarked load skips openDetail(), so decide once here —
         but never override a click the user already made on this item */
      S.shot = (S.shot===null) ? shotAvail(m)[0] : shotFor(m);
      el("detail").innerHTML=detailHTML(m);
      document.body.classList.add("detail-open");
      document.title=m.mfr+" "+m.name+" — eurorack.fi";
      /* only the drawn-faceplate slot needs fitting — must not clobber a shown photo */
      if(S.shot===0) fitPanel(m);
      window.scrollTo(0,0); return;
    }
    /* Deliberately generic even though a hidden item's record now DOES
       survive — the user declined naming the module here. Covers both a
       genuinely deleted item and one a seller has just hidden. */
    el("detail").innerHTML='<div class="wrap"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(t().nav[0])+'</button></div>'+
      /* buyer-facing, so it says SOLD — "hide" is the seller's own
         vocabulary and means nothing to someone who followed a link. */
      '<div class="gone"><span class="soldmark">'+esc(t().soldMark)+'</span>'+
      '<h2>'+esc(GONE[lang].h)+'</h2><p>'+esc(GONE[lang].p)+'</p>'+
      '<button class="btn" onclick="closeDetail()">'+esc(t().nav[0])+'</button></div></div>';
    document.body.classList.add("detail-open"); window.scrollTo(0,0); return;
  }
  /* #/s/<seller> — a shareable link onto the filtered grid, owner only.
     format/type/search/sort are deliberately left untouched: they stay
     session state and never enter the URL, so this promises "you're
     looking at this seller's items", not "this exact screen". An
     unknown/stale key degrades to the plain grid rather than getting
     stuck on a filter nothing can clear. */
  if(h.indexOf("#/s/")===0){
    var sk=h.slice(4), sp=SELLER_BY_KEY[sk];
    S.who=sp?sk:"all";
    renderFilters(); renderGrid();
    document.body.classList.remove("detail-open");
    document.title=sp?(sp.name+" — eurorack.fi"):"eurorack.fi";
    return;
  }
  /* plain "#/" is the one other place the owner filter can be cleared
     from (Everyone chip, browser back/forward past a #/s/ visit,
     closeDetail() with nothing to return to) — only re-render when it
     actually needs clearing, so an ordinary detail-page close doesn't
     rebuild the grid for no reason. */
  if(S.who!=="all"){ S.who="all"; renderFilters(); renderGrid(); }
  document.body.classList.remove("detail-open");
  document.title="eurorack.fi";
}
/* Deliberately generic even though a hidden item's record now survives.
   Design proposed naming the module and showing a dimmed photo; the user
   declined — it says what happened and nothing more. English is theirs;
   fi/sv are design's (a953694) and UNREVIEWED, so expect their edit. */
var GONE={
  fi:{h:"Tätä ei enää ole",p:"Omistaja on poistanut tämän moduulin myynnistä."},
  sv:{h:"Borta",p:"Ägaren har tagit bort den här modulen från försäljning."},
  en:{h:"That one's gone",p:"Owner has removed this module from sale."}
};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var vid=e.target.closest(".vid[data-yt]");
  if(vid){ playVid(vid); return; }
  var pop=e.target.closest("[data-pop]");
  if(pop){
    e.stopPropagation();
    S.pop=(S.pop===pop.getAttribute("data-pop"))?null:pop.getAttribute("data-pop");
    /* re-render whatever's actually on screen — the popover also lives on
       the detail page's "you may also like" cards, not just the home grid.
       Re-paint #detail directly rather than going through route(), which
       would scrollTo(0,0) and yank the page back to the top on every tap. */
    if(location.hash.indexOf("#/m/")===0){
      var mp=byId(location.hash.slice(4));
      if(mp) el("detail").innerHTML=detailHTML(mp);
    } else {
      renderGrid();
    }
    return;
  }
  var g=e.target.closest("[data-go]");
  if(g){ openDetail(g.getAttribute("data-go")); return; }
  var L=e.target.closest("[data-lang]");
  if(L){ lang=L.getAttribute("data-lang"); try{localStorage.setItem("erfi-lang",lang);}catch(x){} syncLangInUrl(); renderAll(); route(); return; }
  /* owner is hash-driven, not direct state — #/s/<seller> is a shareable,
     bookmarkable, back/forward-correct URL onto the filtered grid
     (owner only; format/type/search/sort stay session state and never
     enter the URL, deliberately). route() applies the actual filter
     reactively off the hash; this click handler only ever navigates. */
  var who=e.target.closest("[data-who]");
  if(who){
    var wv=who.getAttribute("data-who");
    location.hash = wv==="all" ? "#/" : "#/s/"+wv;
    return;
  }
  ["fmt","cat"].forEach(function(k){
    var c=e.target.closest("[data-"+k+"]");
    if(c){ S[k]=c.getAttribute("data-"+k); renderFilters(); renderGrid(); }
  });
  var sh=e.target.closest("[data-shot]");
  if(sh && !sh.disabled){ S.shot=+sh.getAttribute("data-shot"); route(); return; }
  var nav=e.target.closest("[data-shotdir]");
  if(nav){
    var mm=byId(location.hash.slice(4));
    if(mm){
      var avail=shotAvail(mm), idx=avail.indexOf(S.shot);
      if(idx<0) idx=0;
      var dir=nav.getAttribute("data-shotdir")==="next"?1:-1;
      S.shot=avail[(idx+dir+avail.length)%avail.length];
      route();
    }
    return;
  }
  if(e.target.closest("#themeb")){
    var r=document.documentElement;
    var isDark=r.classList.contains("dark")||(!r.classList.contains("light")&&matchMedia("(prefers-color-scheme:dark)").matches);
    r.classList.remove("dark","light"); r.classList.add(isDark?"light":"dark");
    try{ localStorage.setItem("erfi-theme",isDark?"light":"dark"); }catch(x){}
    return;
  }
  if(e.target.closest("#a-copy-raw")){ copyText(adminOutput().json); return; }
});
/* admin fields update AS + only the output blocks, never re-rendering the
   form — a full re-render on every keystroke would drop focus mid-word */
document.addEventListener("input",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); }
});
document.addEventListener("change",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); return; }
  var ac=e.target.closest("[data-acat]");
  if(ac){
    var v=ac.getAttribute("data-acat"), i=AS.cats.indexOf(v);
    if(ac.checked && i<0) AS.cats.push(v);
    if(!ac.checked && i>=0) AS.cats.splice(i,1);
    updateAdminOutput(); return;
  }
  if(e.target.id==="a-sc"){ AS.sc=e.target.checked; updateAdminOutput(); return; }
});
el("q").addEventListener("input",function(e){ S.q=e.target.value; renderGrid(); });
el("sort").addEventListener("change",function(e){ S.sort=e.target.value; renderGrid(); });
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ closeDetail(); return; }
  if(e.key==="Enter"||e.key===" "){
    var vid=e.target.closest&&e.target.closest(".vid[data-yt]");
    if(vid){ e.preventDefault(); playVid(vid); }
  }
});
window.addEventListener("hashchange",route);
/* Only the drawn-faceplate slot needs anything on resize — fitPanel()
   re-measures .bench and redraws at fixed-pixel scale. Used to call the
   full route() instead, which (a) reset scroll to 0 unconditionally,
   even when a photo was showing and there was no panel to refit at all,
   and (b) on iOS Safari specifically, fired mid-scroll: the address bar
   collapsing/expanding as the page scrolls dispatches resize events, so
   scrolling down on a product page kept snapping back to the top. */
var rz; window.addEventListener("resize",function(){
  clearTimeout(rz); rz=setTimeout(function(){
    if(location.hash.indexOf("#/m/")===0 && S.shot===0){
      var m=byId(location.hash.slice(4));
      if(m) fitPanel(m);
    }
  },150); });

/* fold the filter bar into a compact tappable summary row once the user
   scrolls past it, so it stops eating grid space — every width, not just
   mobile. Deliberately one-way — no scroll-up auto-reveal — it only
   unfolds on tap, per the user's explicit ask (originally matched
   design's Mobile.dc.html .m-controls; now applied everywhere).
   Height animates from a measured pixel value (see the CSS above for
   why max-height can't do this), and inert — not visibility — keeps the
   hidden side out of the tab order: visibility needs a delay to stay
   interactive through the transition, which doesn't work when the panel
   has to stay visible for the whole fold. inert has no such requirement,
   so it's applied synchronously the moment the state changes. */
(function(){
  var controls=el("grid-top"), wrap=el("collwrap"), bar=el("collbar");
  var DUR=260, foldTimer=null, lastY=window.scrollY, ticking=false, suppressUntil=0;

  function collapsed(){ return controls.classList.contains("collapsed"); }

  /* >=900px the bar never auto-collapses: it stays open until clicked shut.
     Below that, unchanged — scrolling down folds it away. */
  var DESKTOP=window.matchMedia("(min-width:900px)");

  function syncInert(){
    var c=collapsed();
    wrap.toggleAttribute("inert", c);
    /* inert only while the bar is NOT the live control. On desktop it is
       always the live control — it's the only way to close the panel — so
       it must never be inert there. Marking it inert while expanded made
       that one control unclickable.
       Note this cannot be caught by element.click(), which fires handlers
       on an inert element regardless: inert removes it from HIT-TESTING,
       not from dispatch. Verify with a real click at real coordinates. */
    bar.toggleAttribute("inert", !c && !DESKTOP.matches);
    bar.setAttribute("aria-expanded", c?"false":"true");
  }

  /* back to height:auto once settled, so the panel reflows freely on
     resize, language switch, or chips rewrapping — a stale pixel height
     left behind would clip it. */
  function settle(clearHeight){
    clearTimeout(foldTimer);
    foldTimer=setTimeout(function(){
      wrap.classList.remove("folding");
      if(clearHeight) wrap.style.height="";
    }, DUR+40);
  }

  function collapse(){
    if(collapsed()) return;
    wrap.classList.add("folding");
    wrap.style.height=wrap.scrollHeight+"px";
    void wrap.offsetHeight;
    controls.classList.add("collapsed");
    wrap.style.height="0px";
    syncInert(); syncBarLabel(); settle(false);
  }
  function expand(){
    if(!collapsed()) return;
    wrap.classList.add("folding");
    controls.classList.remove("collapsed");
    var target=wrap.scrollHeight;
    wrap.style.height="0px";
    void wrap.offsetHeight;
    wrap.style.height=target+"px";
    syncInert(); syncBarLabel(); settle(true);
  }

  function onScroll(){
    ticking=false;
    var y=window.scrollY, goingDown=y>lastY;
    lastY=y;
    if(DESKTOP.matches) return; /* desktop closes on click only */
    if(Date.now()<suppressUntil) return; /* see click handler below */
    if(!collapsed() && goingDown && y>90) collapse();
  }
  window.addEventListener("scroll",function(){
    if(!ticking){ requestAnimationFrame(onScroll); ticking=true; }
  },{passive:true});

  bar.addEventListener("click",function(){
    /* toggle: on desktop the bar is permanent, so clicking it is how the
       panel closes as well as opens. Below the breakpoint the bar only
       exists while collapsed, so this still only ever expands there. */
    if(collapsed()) expand(); else collapse();
    lastY=window.scrollY;
    /* a real finger-scroll on a touchscreen keeps drifting for a bit after
       lift-off (momentum/inertia) — tapping to expand mid-drift still reads
       as "genuinely still scrolling down" a moment later even with a fresh
       baseline above, and would instantly re-collapse what was just opened.
       Ignore auto-collapse for a short window so the tap actually sticks. */
    suppressUntil=Date.now()+600;
  });

  /* Crossing into desktop while collapsed must re-expand. Scroll is what
     collapsed it, and on desktop scroll no longer reopens anything — the
     user would land with the panel shut and only the bar to click, which
     works but silently loses the filters they had open. Re-expanding also
     re-syncs inert, which is the difference between the bar being
     clickable and not. */
  function onBreakpoint(){
    if(DESKTOP.matches && collapsed()) expand();
    else syncInert();
  }
  /* Driven from BOTH the media query and plain resize. matchMedia change
     is the precise signal; resize is cheap redundancy for any context
     where it doesn't arrive, and onBreakpoint is idempotent so a double
     call costs nothing.
     Neither fires when an IFRAME element is resized — measured: innerWidth
     and mq.matches both update, but change and resize events stay at zero —
     so an embedded copy can miss the crossing entirely. That's tolerable
     rather than fixed, because the desktop bar is a permanent, never-inert
     control: a user who lands collapsed just clicks it open. This re-expand
     is a convenience, not the thing standing between them and a stuck UI. */
  if(DESKTOP.addEventListener) DESKTOP.addEventListener("change",onBreakpoint);
  else DESKTOP.addListener(onBreakpoint); /* older Safari */

  /* a resize mid-fold would animate toward a height measured at the old
     width; drop to auto and let it re-measure the next time it folds. */
  window.addEventListener("resize",function(){
    if(!collapsed()){ wrap.classList.remove("folding"); wrap.style.height=""; }
    onBreakpoint();
  });

  syncInert();
})();

/* ---------- init ---------- */
function renderAll(){ renderChrome(); renderRack(); renderFilters(); renderWish(); renderGrid(); }
/* chrome (nav, hero copy, language switcher) needs no data and shows instantly;
   everything listing-shaped waits on the round trip to content/items/ and
   content/sellers/, fetched together so nothing renders on partial data */
renderChrome();
el("grid").innerHTML='<p class="mono" style="padding:2rem 0;color:var(--muted)">'+esc(t().loading||"Loading…")+'</p>';
Promise.all([loadItems(), loadSellers(), loadFaq(), loadUi(), loadSellerState(), loadWantState(), loadHow()]).then(function(r){
  /* hidden items stay in content/items/ (data, photos, history all kept
     for a possible relist) but must not exist for the site at all —
     filtering here, before anything else touches ITEMS, means every
     consumer (stats, rack, filter counts, grid, wish band, related-item
     lookups) automatically excludes them with no special-casing needed.
     A direct/bookmarked link to a hidden item's #/m/ page already falls
     through to the existing generic "gone" page, same as a deleted one. */
  /* seller overrides applied BEFORE the hidden filter, so an item a
     seller has just hidden drops out of everything downstream — grid,
     rack, HP total, counts, wish band — with no special-casing, and one
     they have just un-hidden comes straight back. */
  ITEMS=applySellerState(r[0],r[4]).filter(function(m){ return !m.hidden; });
  SELLERS=r[1];
  HOW=r[6];
  SELLERS.forEach(function(p,i){
    if(!p.dot) p.dot=SELLER_DOTS[i % SELLER_DOTS.length];
    /* normalise first, THEN drop hidden: wantKey handles both shapes, but
       normalising first means the key is computed from the same shape the
       rest of the site sees. */
    p.wants=dropHiddenWants(normalizeWants(p.wants), (r[5]||{})[p.key]);
  });
  WANTS={}; SELLER_BY_KEY={};
  SELLERS.forEach(function(p){ WANTS[p.key]=p.wants; SELLER_BY_KEY[p.key]=p; });
  FAQ=(r[2]&&r[2].questions)?r[2]:{questions:[]};
  applyUi(r[3]);
  renderAll();
  route();
}).catch(function(err){
  el("grid").innerHTML='<div class="empty">'+esc(t().loadError||"Could not load listings.")+' ('+esc(err.message)+')</div>';
});
</script>
