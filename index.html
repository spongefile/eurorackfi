<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eurorack.fi</title>
<!-- Loaded once, up front, so it is already present when the #/msg/ route
     dynamically inserts a data-tally-src iframe. Blocked under the Artifact
     preview's sandbox (external script) — works on the real deployed site. -->
<script async src="https://tally.so/widgets/embed.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
<script>
/* Palette + theme land before paint so there is no flash.
   Finnish blue ships; warm teal stays one class away (drop "blue" to switch). */
(function(){
  var r=document.documentElement;
  r.className="rt blue";
  try{ var t=localStorage.getItem("erfi-theme"); if(t) r.classList.add(t); }catch(e){}
})();
</script>
<style>
/* ---------- palettes: warm teal (.rt) and finnish blue (.rt.blue) ---------- */
.rt{
  --bg:#E9EAE6; --bg2:#DFE2DC; --panel:#FBFBF9; --panel2:#F2F3EF;
  --ink:#14171A; --ink2:#3D4548; --muted:#6B7276;
  --line:#CFD3CC; --line2:#B6BCB4;
  --accent:#0B6E67; --accent-hi:#095A54; --accent-soft:#D8E8E5;
  --signal:#A96B06; --signal-soft:#F5E7CA;
  --rail:#B4B9B2; --rail-ink:#8D938B;
  --sold:#8A3E3E; --sold-soft:#F0DDDA;
  --shadow:0 1px 2px rgba(20,23,26,.06),0 8px 24px -12px rgba(20,23,26,.18);
  --on:#FBFBF9;
}
.rt.blue{
  --bg:#E7EBF0; --bg2:#DCE2EA; --panel:#FAFBFD; --panel2:#EFF3F8;
  --ink:#0F1722; --ink2:#36435A; --muted:#6A7789;
  --line:#CAD3DF; --line2:#AFBACB;
  --accent:#0B4F9E; --accent-hi:#083B77; --accent-soft:#D6E3F5;
  --signal:#A9660A; --signal-soft:#F5E6C8;
  --rail:#B1B9C5; --rail-ink:#8891A0;
  --sold:#8A3E4E; --sold-soft:#F0DAE0;
  --shadow:0 1px 2px rgba(15,23,34,.07),0 8px 24px -12px rgba(15,23,34,.22);
  --on:#FAFBFD;
}
/* system dark, unless the reader has explicitly chosen light */
@media (prefers-color-scheme:dark){
  .rt:not(.light){
    --bg:#101312; --bg2:#171B1A; --panel:#1B201F; --panel2:#222827;
    --ink:#E9ECE8; --ink2:#C3C9C5; --muted:#8C948F;
    --line:#2A312F; --line2:#3B4340;
    --accent:#3FBFAE; --accent-hi:#7FE0D2; --accent-soft:#12312E;
    --signal:#E0AC53; --signal-soft:#2C2314;
    --rail:#343A38; --rail-ink:#4A524E;
    --sold:#D98A85; --sold-soft:#33211F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    --on:#0B0F0E;
  }
  .rt.blue:not(.light){
    --bg:#0C1119; --bg2:#121924; --panel:#161E2A; --panel2:#1D2634;
    --ink:#E6ECF4; --ink2:#BEC9D8; --muted:#8590A1;
    --line:#252F3C; --line2:#364253;
    --accent:#5AA9F0; --accent-hi:#93C8FB; --accent-soft:#0D2A47;
    --signal:#E0AC53; --signal-soft:#2C2314;
    --rail:#323A46; --rail-ink:#47515F;
    --sold:#D98A93; --sold-soft:#331F24;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.75);
    --on:#08111A;
  }
}
/* explicit choice always wins in both directions */
.rt.dark{
  --bg:#101312; --bg2:#171B1A; --panel:#1B201F; --panel2:#222827;
  --ink:#E9ECE8; --ink2:#C3C9C5; --muted:#8C948F;
  --line:#2A312F; --line2:#3B4340;
  --accent:#3FBFAE; --accent-hi:#7FE0D2; --accent-soft:#12312E;
  --signal:#E0AC53; --signal-soft:#2C2314;
  --rail:#343A38; --rail-ink:#4A524E;
  --sold:#D98A85; --sold-soft:#33211F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --on:#0B0F0E;
}
.rt.blue.dark{
  --bg:#0C1119; --bg2:#121924; --panel:#161E2A; --panel2:#1D2634;
  --ink:#E6ECF4; --ink2:#BEC9D8; --muted:#8590A1;
  --line:#252F3C; --line2:#364253;
  --accent:#5AA9F0; --accent-hi:#93C8FB; --accent-soft:#0D2A47;
  --signal:#E0AC53; --signal-soft:#2C2314;
  --rail:#323A46; --rail-ink:#47515F;
  --sold:#D98A93; --sold-soft:#331F24;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -14px rgba(0,0,0,.75);
  --on:#08111A;
}

/* ---------- base ----------
   The reset lives in :where() so it has ZERO specificity and cannot beat
   .btn / .chip / .card. A bare `.rt button` reset (0,1,1) silently won this
   fight once and rendered every button as plain text. Do not unwrap it. */
:where(.rt button){background:none; color:inherit; border:none; font:inherit; padding:0}
.rt *{box-sizing:border-box}
.rt{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-size:1rem; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body{margin:0; background:var(--bg); color:var(--ink)}
.rt h1,.rt h2,.rt h3,.rt h4{margin:0; text-wrap:balance; font-weight:700; letter-spacing:-.015em; line-height:1.12}
.rt p{margin:0}
/* zero-specificity so any component class (.btn, .linkcard, .card…) always wins —
   same trap as the button reset: an unscoped .rt a beat .btn on specificity and put
   accent-on-accent invisible text on the buy button the moment it became an <a>. */
:where(.rt a){color:var(--accent); text-decoration:none}
:where(.rt a:hover){color:var(--accent-hi)}
.rt button{cursor:pointer}
.rt :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.prose{font-family:"Newsreader",Georgia,serif}
.wrap{width:min(1160px,100% - 3rem); margin-inline:auto}
@media(max-width:640px){ .wrap{width:min(1160px,100% - 1.75rem)} }

/* rail — 25.4px is exactly one HP */
.rail{height:9px; background:var(--rail); border-top:1px solid var(--line2); border-bottom:1px solid var(--line2);
  background-image:radial-gradient(circle at 5px 4px, var(--rail-ink) 0 1.6px, transparent 1.7px);
  background-size:25.4px 100%;}

/* ---------- notice ---------- */
.notice{background:var(--signal-soft); color:var(--signal); font-family:"IBM Plex Mono",monospace;
  font-size:.72rem; letter-spacing:.03em; padding:.5rem 0}
.notice .wrap{display:flex; gap:.55rem; flex-wrap:wrap}
.notice b{color:var(--ink)}

/* ---------- header ---------- */
header.site{padding:1rem 0; background:var(--bg)}
header.site .wrap{display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap}
.brand{display:inline-flex; align-items:baseline; font-family:"Archivo",sans-serif; font-weight:800;
  font-size:1.35rem; letter-spacing:-.035em; font-stretch:96%; color:var(--ink)}
.brand:hover{color:var(--ink)}
.jack{width:.58em; height:.58em; display:inline-block; vertical-align:-.015em;
  margin-left:.07em; margin-right:0; transform:translate(var(--jack-nudge,-.016em),var(--jack-nudge-y,.015em))}
.brand .dot{color:var(--accent)}
nav.top{display:flex; gap:1.3rem; align-items:center; flex-wrap:wrap}
nav.top a{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink2); border-bottom:1px solid transparent; padding-bottom:2px}
nav.top a:hover{color:var(--accent); border-color:var(--accent)}
.hgroup{margin-left:auto; display:flex; gap:.5rem; align-items:center}
.seg{display:flex; border:1px solid var(--line2)}
.seg button{font-family:"IBM Plex Mono",monospace; font-size:.7rem; padding:.3rem .5rem; color:var(--ink2); text-transform:uppercase; letter-spacing:.06em}
.seg button+button{border-left:1px solid var(--line2)}
.seg button:hover{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on)}
.themeb{font-family:"IBM Plex Mono",monospace; font-size:.7rem; border:1px solid var(--line2); padding:.3rem .5rem; color:var(--ink2)}
.themeb:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- hero ---------- */
.hero{padding:3rem 0 2.5rem}
.hero .wrap{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:3rem; align-items:center}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.2rem); letter-spacing:-.035em; font-weight:800; font-stretch:96%}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero .lede{font-family:"Newsreader",Georgia,serif; font-size:1.12rem; line-height:1.55; color:var(--ink2); margin-top:1.1rem; max-width:40ch}
.stats{display:flex; gap:1.75rem; margin-top:1.75rem; flex-wrap:wrap}
.stat .n{font-family:"IBM Plex Mono",monospace; font-size:1.5rem; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.stat .l{font-family:"IBM Plex Mono",monospace; font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-top:.15rem}
.rackfig{margin:0}
.rackbox{background:var(--bg2); border:1px solid var(--line); padding:0; box-shadow:var(--shadow); overflow-x:auto}
.rackrow{display:flex; align-items:flex-start}
.rackmod{position:relative; flex:0 0 auto; cursor:pointer; border:none; padding:0; display:block}
.rackmod::after{content:""; position:absolute; inset:0; background:var(--accent); opacity:0; transition:opacity .12s}
.rackmod:hover::after,.rackmod:focus-visible::after{opacity:.22}
.rackfig figcaption{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-top:.7rem; display:flex; justify-content:space-between; gap:1rem}

/* ---------- filter bar ---------- */
.controls{position:sticky; top:0; z-index:30; background:var(--bg); border-top:1px solid var(--line); border-bottom:1px solid var(--line); transition:transform .22s ease}
.controls.hide{transform:translateY(-100%)}
@media (prefers-reduced-motion:reduce){ .controls{transition:none} }
.controls .wrap{display:flex; gap:.7rem; align-items:center; padding:.8rem 0; flex-wrap:wrap}
.search{display:flex; align-items:center; gap:.5rem; background:var(--panel); border:1px solid var(--line2); padding:.4rem .7rem; flex:1 1 210px; max-width:300px}
.search input{border:none; background:none; outline:none; font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink); width:100%}
.search input::placeholder{color:var(--muted)}
.chips{display:flex; gap:.35rem; flex-wrap:wrap; min-width:0}
.chip{font-family:"IBM Plex Mono",monospace; font-size:.72rem; padding:.32rem .6rem; border:1px solid var(--line2);
  color:var(--ink2); background:var(--panel); white-space:nowrap}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on)}
/* pressed + hover must not fall through to the generic hover — that made the text vanish */
.chip[aria-pressed="true"]:hover{background:var(--accent-hi); border-color:var(--accent-hi); color:var(--on)}
.chip .ct{opacity:.65; margin-left:.35rem}
.chip.faint{border-style:dashed; color:var(--muted)}
.chip.faint:hover{border-color:var(--line2); color:var(--muted)}
/* an empty category can still be selected — pressed must beat faint, which sits at
   the same specificity and would otherwise win on source order alone */
.chip.faint[aria-pressed="true"],
.chip.faint[aria-pressed="true"]:hover{border-style:solid; color:var(--on)}
.sep{width:1px; align-self:stretch; background:var(--line2); margin:0 .2rem}
select.sort{font-family:"IBM Plex Mono",monospace; font-size:.72rem; padding:.34rem .5rem; background:var(--panel); border:1px solid var(--line2); color:var(--ink2); margin-left:auto}
/* separates the whole controls row (search/format/owner/sort) from the
   category row below it — a different divider from .sep, which is within
   that top row. Values are the user's own hand-tuned adjustment on top of
   design's first pass, not design's original numbers. */
.catscroll{display:flex; gap:.35rem; min-width:0; flex:1 1 100%;
  border-top:1px solid var(--line); padding-top:.85rem; padding-bottom:.85rem; margin-top:.9rem}

/* ---------- wish band ---------- */
.wishband{padding:1.75rem 0 .5rem}
.wishband h2{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; margin-bottom:.9rem}
.wishgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem}
.wishcard{background:var(--panel); border:1px solid var(--line); padding:1rem 1.1rem;
  display:block; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s, box-shadow .15s}
.wishcard:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:var(--shadow); color:inherit}
@media (prefers-reduced-motion:reduce){ .wishcard,.wishcard:hover{transition:none; transform:none} }
.wishcard .nm{display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:1.05rem}
.wishcard .nm i{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
.wishcard .sub{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-top:.2rem}
.wishcard ul{list-style:none; margin:.75rem 0 0; padding:0; display:flex; flex-wrap:wrap; gap:.3rem}
.wishcard li{font-family:"IBM Plex Mono",monospace; font-size:.72rem; border:1px solid var(--line2); color:var(--ink2); padding:.18rem .42rem}
.wishcard .wishmore{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--accent); margin-top:.8rem}

/* ---------- Toiveet page ---------- */
.wishpage{padding:2.5rem 0 4rem}
.wishpage h1{font-size:1.9rem; letter-spacing:-.03em; margin-bottom:2rem}
.wishsection{display:block; color:inherit; text-decoration:none; padding:1.25rem 0; border-top:1px solid var(--line)}
.wishsection:first-of-type{border-top:none}
.wishsection .nm{display:flex; align-items:center; gap:.55rem; font-weight:700; font-size:1.15rem; margin-bottom:1rem}
.wishsection .nm i{width:10px; height:10px; border-radius:50%; flex:0 0 auto}
.wish-imggrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:1rem}
.wishtile{background:var(--bg2); border:1px solid var(--line); display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:.9rem .6rem; min-height:170px; transition:border-color .15s}
.wishsection:hover .wishtile{border-color:var(--line2)}
.wishtile .wf{display:flex; align-items:center; justify-content:center}
.wishtile .wl{margin-top:.7rem; font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--ink2);
  text-align:center; line-height:1.4}
.wishtile.placeholder{border-style:dashed; border-color:var(--line2); background:transparent; min-height:170px}
.wishnote{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); margin-top:.8rem}

/* ---------- count ---------- */
.countline{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--muted); padding:1.25rem 0 .9rem;
  display:flex; gap:1rem; flex-wrap:wrap; font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
main{padding-bottom:3rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:1.25rem}
.card{background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; text-align:left;
  padding:0; transition:border-color .15s, transform .15s, box-shadow .15s; width:100%}
.card:hover{border-color:var(--line2); transform:translateY(-2px); box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){ .card,.card:hover{transition:none; transform:none} }
.shot{height:210px; background:var(--bg2); border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:center; overflow:hidden; position:relative}
/* grid cards: crop to fill, same reasoning as the rack — a browsing view
   wants consistent, filled tiles, not padded ones for oddly-shaped photos
   (e.g. a 1U module's naturally wide/short photo inside a tall card box).
   Detail-page bench stays object-fit:contain deliberately, see below. */
.shot img{width:100%; height:100%; object-fit:cover}
.bench img{max-width:100%; max-height:100%; object-fit:contain}
.pcredit{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); margin-top:.5rem}
.cbody{padding:.9rem 1rem 1rem; display:flex; flex-direction:column; gap:.45rem; flex:1}
.cbody .mfr{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.cbody h3{font-size:1.05rem; letter-spacing:-.02em}
.cbody .blurb{font-family:"Newsreader",Georgia,serif; font-size:.95rem; line-height:1.45; color:var(--ink2)}
.tags{display:flex; gap:.28rem; flex-wrap:wrap; margin-top:auto; padding-top:.4rem}
.tag{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--muted); border:1px solid var(--line); padding:.14rem .38rem}
.ownerpill{font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--ink2); border:1px solid var(--line2);
  padding:.14rem .4rem; display:inline-flex; align-items:center; gap:.35rem; position:relative}
.ownerpill i{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.cardfoot{display:flex; align-items:center; gap:.6rem; padding:.6rem 1rem; border-top:1px solid var(--line); background:var(--panel2)}
.price{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:.95rem; font-variant-numeric:tabular-nums; white-space:nowrap; flex:0 0 auto}
.hpstamp{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--muted); border-left:1px solid var(--line2); padding-left:.6rem}
.cta{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.68rem; border:1px solid var(--line2);
  color:var(--ink2); padding:.22rem .5rem; background:transparent; white-space:nowrap}
.card:hover .cta{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
/* in negotiation: solid on the card, because the state IS the call to action */
.negchip{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.68rem; background:var(--accent);
  color:var(--on); border:1px solid var(--accent); padding:.22rem .5rem; display:inline-flex; align-items:center; gap:.4rem; white-space:nowrap}
.negchip i,.negbar i{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.negchip i{background:var(--on)}
@media (prefers-reduced-motion:no-preference){
  .negchip i,.negbar i{animation:pulse 2s ease-in-out infinite}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.empty{padding:3.5rem 0; text-align:center; font-family:"IBM Plex Mono",monospace; color:var(--muted); font-size:.85rem}

/* ---------- module page ---------- */
.detail{display:none}
body.detail-open .detail{display:block}
body.detail-open .browse{display:none}
.crumb{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--muted); padding:1.1rem 0;
  display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}
.crumb button{color:var(--accent); text-decoration:underline; text-underline-offset:3px}
/* image column stretches to the buy column, or the shorter one leaves a hole */
.buyarea{display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:2.5rem; align-items:start; padding-bottom:2rem}
/* imgcol (bench + thumbs) is ONE sticky unit, not sticky-bench-alone with a
   plain sibling below it — the earlier version let the two drift apart or
   overlap on scroll, since only the bench was pinned. Moving sticky up to
   the shared wrapper means they scroll together, correct by construction,
   no cap or per-item numbers to keep in sync with content that varies. */
.imgcol{display:flex; flex-direction:column; gap:.6rem; min-width:0; position:sticky; top:24px}
.bench{background:var(--bg2); border:1px solid var(--line); display:flex; align-items:center;
  justify-content:center; flex:0 0 auto; height:400px; overflow:hidden; position:relative}
.thumbs{display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem}
.thumb{height:64px; border:1px solid var(--line); background:var(--bg2); font-family:"IBM Plex Mono",monospace;
  font-size:.6rem; color:var(--muted); display:flex; align-items:center; justify-content:center}
.thumb[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent-soft); color:var(--accent)}
.thumb:disabled{opacity:.4; cursor:default}
.buycol{min-width:0}
.buycol .mfr{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.buycol h2{font-size:clamp(1.8rem,3.2vw,2.5rem); letter-spacing:-.035em; font-weight:800; margin:.35rem 0 .7rem}
.bigprice{font-family:"IBM Plex Mono",monospace; font-size:2rem; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.sellerline{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--muted); margin-top:.5rem; display:flex; align-items:center; gap:.5rem}
.sellerline i{width:8px; height:8px; border-radius:50%}
/* in negotiation: quiet here, so it never competes with the primary button */
.negbar{display:flex; align-items:center; gap:.55rem; width:100%; margin:1.25rem 0 .75rem; padding:.7rem .9rem;
  background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
  font-family:"IBM Plex Mono",monospace; font-size:.76rem}
.negbar i{background:var(--accent)}
.btn{font-family:"IBM Plex Mono",monospace; font-size:.82rem; letter-spacing:.03em; padding:0 1.2rem; height:62px;

<script>
/* ---------- items ---------- */
/* One JSON file per listing in content/items/ — edited via Decap CMS, or by
   committing a file directly (that is the whole point: no inline array to
   hand-edit any more, and no sold state — an item no longer for sale is a
   deleted file, not a flag). "negotiating" lives on the item itself now,
   toggled the same way: Buying/Trading on the message form, never a
   generic question, set by hand after reading the inbox. */
var ITEMS=[];
var byId=function(id){ return ITEMS.filter(function(m){ return m.id===id; })[0]; };
var ITEMS_URL="https://api.github.com/repos/spongefile/eurorackfi/contents/content/items";
function loadItems(){
  return fetch(ITEMS_URL).then(function(r){
    if(!r.ok) throw new Error("directory listing failed: "+r.status);
    return r.json();
  }).then(function(list){
    var files=list.filter(function(f){ return f.name && f.name.slice(-5)===".json"; });

function hashSeed(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}
  return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function packGrid(n,x0,y0,w,h,cell){var out=[],cols=Math.max(1,Math.min(n,Math.floor(w/cell)));
  var rows=Math.ceil(n/cols),cw=w/cols,ch=h/rows;
  for(var i=0;i<n;i++){var c=i%cols,r=Math.floor(i/cols);var inRow=(r===rows-1)?(n-r*cols):cols;var off=(w-inRow*cw)/2;
    out.push({x:x0+off+c*cw+cw/2,y:y0+ch*(r+0.5)});}
  return out;}
function abs(x,y,w,h){return "position:absolute;left:"+x.toFixed(1)+"px;top:"+y.toFixed(1)+"px;width:"+w.toFixed(1)+"px;height:"+h.toFixed(1)+"px;";}
function buildPanel(m,H,tone){
  var t=TONE[tone]||TONE.black;
  var W=m.hp>0?Math.round(m.hp*5.08*(H/128.5)):Math.round(H*1.55);
  var U=H/128.5, els=[];
  var kd=Math.max(8,Math.round(11*U)), jd=Math.max(5,Math.round(7.4*U));
  var pad=Math.min(6,W*0.14), iw=W-pad*2, top=6;
  if(W>30){[[pad*0.55,5],[W-pad*0.55,5],[pad*0.55,H-5],[W-pad*0.55,H-5]].forEach(function(p){
    els.push(abs(p[0]-2,p[1]-2,4,4)+"border-radius:50%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);");});}
  if(m.parts.sc){var sh=Math.round(H*0.15),sw=Math.min(iw,Math.round(iw*0.9));
    els.push(abs(pad+(iw-sw)/2,top,sw,sh)+"background:linear-gradient(180deg,#0d1413,#050807);border:1px solid rgba(0,0,0,.5);box-shadow:inset 0 0 8px rgba(60,200,180,.22);");
    top+=sh+5;}
  var jRows=Math.ceil(m.parts.j/Math.max(1,Math.floor(iw/(jd+4))));
  var jH=Math.min(H*0.46,jRows*(jd+6)+2), jY=H-7-jH;
  if(m.parts.sl){var slH=Math.min(H*0.34,jY-top-8);
    packGrid(m.parts.sl,pad,top,iw,slH,Math.max(6,iw/m.parts.sl)).forEach(function(p){
      els.push(abs(p.x-1,p.y-slH/2+2,2,slH-4)+"background:rgba(0,0,0,.42);border-radius:1px;");
      els.push(abs(p.x-3.5,p.y-slH/2+2+(slH-10)*0.35,7,5)+"background:"+t.knob+";border-radius:1px;box-shadow:0 1px 1px rgba(0,0,0,.5);");});
    top+=slH+6;}
  if(m.parts.k){var kH=Math.max(kd+2,jY-top-6);
    packGrid(m.parts.k,pad,top,iw,kH,kd+4).forEach(function(p,i){var ang=210+(i*47)%260;
      els.push(abs(p.x-kd/2,p.y-kd/2,kd,kd)+"border-radius:50%;background:conic-gradient(from "+ang+"deg,"+t.knob+" 0 8deg,transparent 8deg 360deg),radial-gradient(circle at 34% 28%,#77777c,#232326 72%);box-shadow:0 1px 2px rgba(0,0,0,.55);");});}
  if(m.parts.led){var ln=Math.min(m.parts.led,16);
    packGrid(ln,pad,jY-7,iw,5,Math.max(4,iw/ln)).forEach(function(p,i){var on=i%3===0;
      els.push(abs(p.x-1.5,p.y-1.5,3,3)+"border-radius:50%;background:"+(on?"#E0623A":"rgba(0,0,0,.3)")+";"+(on?"box-shadow:0 0 4px rgba(224,98,58,.8);":""));});}
  packGrid(m.parts.j,pad,jY,iw,jH,jd+4).forEach(function(p){
    els.push(abs(p.x-jd/2,p.y-jd/2,jd,jd)+"border-radius:50%;background:radial-gradient(circle,#08080a 0 "+(jd*0.3).toFixed(1)+"px,#8d918e "+(jd*0.32).toFixed(1)+"px 100%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.5);");});
  return {w:W, html:'<div style="position:relative;display:block;width:'+W+'px;height:'+H+'px;background:'+t.bg+
    ';border:1px solid '+t.line+';box-shadow:0 2px 6px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);flex:0 0 auto">'+
    els.map(function(s){return '<div style="'+s+'"></div>';}).join("")+'</div>'};
}

  out+='</section>';

  if(x.pull) out+='<section class="sect"><h3>'+esc(x.pull.src)+'</h3>'+
    '<blockquote class="pullquote">&ldquo;'+esc(x.pull.q)+'&rdquo;<cite>'+esc(x.pull.src)+' · <a href="'+x.pull.url+'" target="_blank" rel="noopener">read the full review</a></cite></blockquote>'+
    '<div class="qcards">'+x.quotes.map(function(q){
      return '<div class="qcard'+(q.crit?" crit":"")+'"><p>&ldquo;'+esc(q.t)+'&rdquo;</p><cite>'+esc(q.s)+'</cite></div>'; }).join("")+'</div></section>';

  if(x.videos) out+='<section class="sect"><h3>'+esc(T2.video)+'</h3><div class="vids">'+x.videos.map(function(v){
    return '<a class="vid" href="'+v.url+'" target="_blank" rel="noopener"><div class="frame"><span class="play"></span></div>'+
      '<div class="cap">'+esc(v.title)+'</div><div class="sub">'+esc(v.by)+'</div></a>'; }).join("")+'</div></section>';

  var links=[];
  if(m.site) links.push({k:m.mfr,v:T2.official,u:"https://"+m.site});
  if(m.mgSlug) links.push({k:"ModularGrid",v:T2.mgNote,u:"https://modulargrid.net/e/"+m.mgSlug});
  (x.reviews||[]).forEach(function(r){ links.push({k:r.src,v:r.title,u:r.url}); });
  if(links.length) out+='<section class="sect"><h3>'+esc(T2.elsewhere)+'</h3><div class="linkrow">'+links.map(function(l){
    return '<a class="linkcard" href="'+l.u+'" target="_blank" rel="noopener"><div class="k">'+esc(l.k)+'</div>'+
      '<div class="v">'+esc(l.v)+' <span>&rarr;</span></div></a>'; }).join("")+'</div></section>';

  var rel=m.related;
  if(rel){ out+='<section class="sect"><h3>'+esc(T2.alsoLike)+'</h3><div class="alike">'+rel.map(function(r){
      var o=byId(r[0]); if(!o) return "";
      var op=SELLER_BY_KEY[o.who];
      return '<button class="card" data-go="'+o.id+'"><div class="shot">'+shotHTML(o,182)+'</div>'+
        '<div class="cbody"><div class="mfr">'+esc(o.mfr)+'</div><h3>'+esc(o.name)+'</h3>'+
        '<p class="why">'+esc(r[1])+'</p>'+
        '<div class="tags"><span class="ownerpill"><i style="background:'+op.dot+'"></i>'+esc(op.name)+'</span></div></div>'+
        '<div class="cardfoot"><span class="price">'+eur(o.price)+'</span>'+
        (o.hp>0?'<span class="hpstamp">'+o.hp+' HP</span>':'')+'</div></button>'; }).join("")+'</div></section>'; }
  return out+'</div>';
}

/* ---------- message form: one shared inbox, not the owner ---------- */
/* The message form lives on Tally, not on this page — the site only opens it
   prefilled, so there is no local "sent" state to fake. Hidden-field IDs are
   Tally's own block ids, given to us straight from the Tally dashboard. */
var TALLY_URL="https://tally.so/r/rjMyQo";
var TALLY_FIELDS={
  module:"1a5c14a8-5ff4-4b4d-af90-68f6c07bf154",
  seller:"2f0d1cb8-260d-47b2-a7ae-ae5b11696d21",
  price: "ef696402-3271-4bd0-830c-08f6ebaaafa2",
  lang:  "c55a5b51-5079-45d6-88cf-94f727c9d19a"
};
function tallyLink(m){
  var p=SELLER_BY_KEY[m.who], q=[];
  q.push(TALLY_FIELDS.module+"="+encodeURIComponent(m.mfr+" — "+m.name));
  q.push(TALLY_FIELDS.seller+"="+encodeURIComponent(p.name));
  q.push(TALLY_FIELDS.price+"="+encodeURIComponent(eur(m.price)));
  q.push(TALLY_FIELDS.lang+"="+encodeURIComponent(lang));
  return TALLY_URL+"?"+q.join("&");
}
</script>

<script>
/* Faceplates are fixed-pixel art, so they cannot fluid-scale on their own.
   Measure the bench and pick the tallest H whose true-scale width still fits. */
function fitPanel(m){
  var bench=document.querySelector(".bench"); if(!bench) return;
  var avail=bench.clientWidth-32;
  var perPx=m.hp>0 ? (m.hp*5.08/128.5) : 1.55;
  var H=Math.max(120,Math.min(282,Math.floor(avail/perPx)));
  if(H<282) bench.innerHTML=panelHTML(m,H);
}

/* ---------- admin composer ---------- */
/* Structural only — no fetching, no publishing. Specs come from typing them
   in, or from asking Claude in chat to research a maker+model first and
   paste the result in here. Output is a paste-ready RAW row + BLURB entry. */
var AS={
  id:"", mfr:"", name:"", fmt:"eu", hp:"", tone:"black",
  k:"",j:"",sl:"",led:"",sc:false,
  cat:"", cats:[], price:"", mgSlug:"", site:"", who:"t",
  blurbEn:"", blurbFi:"", blurbSv:""
};
function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,10); }
/* Output matches content/items/<id>.json exactly — the same shape whether a
   listing arrives via this form, a Claude chat that researched it, or a
   direct git commit. One format, three ways to produce it. */
function adminOutput(){
  var id=AS.id||slugify(AS.mfr+AS.name)||"id";
  var cats=AS.cats.length?AS.cats:(AS.cat?[AS.cat]:[]);
  var item={
    id:id, mfr:AS.mfr||"", name:AS.name||"",
    price:+AS.price||0, hp:AS.fmt==="eu"?(+AS.hp||0):0,
    fmt:AS.fmt, who:AS.who, cat:AS.cat||cats[0]||"", cats:cats,
    blurb:{en:AS.blurbEn||"", fi:AS.blurbFi||"", sv:AS.blurbSv||""},
    mgSlug:AS.mgSlug||"", site:AS.site||"", tone:AS.tone,
    parts:{k:+AS.k||0, j:+AS.j||0, sl:+AS.sl||0, led:+AS.led||0, sc:AS.sc?1:0},
    negotiating:false
  };
  return {json:JSON.stringify(item,null,2), id:id};
}
function updateAdminOutput(){
  var out=adminOutput();
  var r=el("aout-raw");
  if(r) r.textContent=out.json;
  var f=el("aout-filename");
  if(f) f.textContent="content/items/"+out.id+".json";
}
function adminField(af,label,type,extra){
  extra=extra||"";
  if(type==="textarea") return '<div class="afld"'+extra+'><label>'+label+'</label><textarea data-af="'+af+'">'+esc(AS[af])+'</textarea></div>';
  return '<div class="afld"'+extra+'><label>'+label+'</label><input data-af="'+af+'" type="'+type+'" value="'+esc(AS[af])+'"></div>';
}
/* Toiveet — one seller section per row, each a single click target back to
   Home with that seller's owner filter preset. A real-item want gets its
   actual drawn faceplate (same engine as the inventory); a placeholder
   string gets a dashed empty outline and no label — the presence/absence
   of a drawing is the whole signal, not a caption. */
var WISH_TILE_H=150;
function wishTileHTML(w){
  if(typeof w==="string") return '<div class="wishtile placeholder" aria-hidden="true"></div>';
  return '<div class="wishtile"><div class="wf">'+panelHTML(w,WISH_TILE_H)+'</div>'+
    '<div class="wl">'+esc(w.mfr)+'<br>'+esc(w.name)+'</div></div>';
}
function wishHTML(){
  var T2=t();
  return '<div class="wrap wishpage"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(T2.nav[0])+'</button></div>'+
    '<h1>'+esc(T2.wishH)+'</h1>'+
    SELLERS.map(function(p){
      return '<a class="wishsection" href="#/" data-setwho="'+p.key+'">'+
        '<div class="nm"><i style="background:'+p.dot+'"></i>'+esc(p.name)+'</div>'+
        '<div class="wish-imggrid">'+p.wants.map(wishTileHTML).join("")+'</div>'+
        '</a>'; }).join("")+
    '<p class="wishnote">'+esc(T2.wishK)+'</p>'+
    '</div>';
}

function adminHTML(){
  var toneOpts=Object.keys(TONE).map(function(k){ return '<option value="'+k+'"'+(AS.tone===k?" selected":"")+'>'+k+'</option>'; }).join("");
  var fmtOpts=[["eu","Eurorack"],["desk","Standalone"],["tools","Other stuff (soon)"]].map(function(o){
    return '<option value="'+o[0]+'"'+(AS.fmt===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("");
  var whoOpts=SELLERS.map(function(p){ return '<option value="'+p.key+'"'+(AS.who===p.key?" selected":"")+'>'+p.name+'</option>'; }).join("");
  var catChecks=CATKEYS.filter(function(c){return c!=="all";}).map(function(c){
    return '<label><input type="checkbox" data-acat="'+c+'"'+(AS.cats.indexOf(c)>=0?" checked":"")+'>'+c+'</label>'; }).join("");
  var out=adminOutput();
  return '<div class="wrap admin"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(t().nav[0])+'</button></div>'+
    '<div class="ahead"><h1>Add a listing</h1>'+
    '<p class="anote">No auto-fetch here — nothing on this page reads another site. Ask Claude in chat '+
    'to research a maker + model first if you want real specs and sources, then fill this in with the '+
    'answer. This never publishes anything: it generates a JSON file in the exact shape listings are '+
    'actually stored in (<code>content/items/&lt;id&gt;.json</code>) — save it there and commit, or edit '+
    'the same fields later in Decap CMS once that\'s wired up.</p></div>'+

    '<div class="astep"><div class="astephead"><span class="astepno">1</span><h3>Identify</h3></div>'+
    '<div class="afrow">'+adminField("mfr","Maker","text")+adminField("name","Model","text")+
    adminField("id","ID (auto if blank)","text",' class="sm"')+'</div></div>'+

    '<div class="astep"><div class="astephead"><span class="astepno">2</span><h3>Specs</h3>'+
    '<span class="ahint">drives the drawn faceplate and the filter bar</span></div>'+
    '<div class="afrow">'+
      '<div class="afld sm"><label>Format</label><select data-af="fmt">'+fmtOpts+'</select></div>'+
      adminField("hp","HP (0 if standalone)","number",' class="sm"')+
      '<div class="afld sm"><label>Panel</label><select data-af="tone">'+toneOpts+'</select></div>'+
    '</div>'+
    '<div class="afrow" style="margin-top:.7rem">'+
      adminField("k","Knobs","number",' class="sm"')+adminField("j","Jacks","number",' class="sm"')+
      adminField("sl","Sliders","number",' class="sm"')+adminField("led","LEDs","number",' class="sm"')+
      '<label style="align-self:end; display:flex; gap:.4rem; align-items:center; font-family:\'IBM Plex Mono\',monospace; font-size:.74rem; color:var(--ink2)">'+
      '<input type="checkbox" id="a-sc"'+(AS.sc?" checked":"")+'> has screen</label>'+
    '</div>'+
    '<div style="margin-top:.9rem"><label class="afld"><label>Category tags</label></label><div class="achecks">'+catChecks+'</div></div>'+
    '</div>'+

    '<div class="astep"><div class="astephead"><span class="astepno">3</span><h3>Price &amp; links</h3></div>'+
    '<div class="afrow">'+adminField("price","Price (€)","number",' class="sm"')+
      adminField("site","Manufacturer domain","text",'')+
      adminField("mgSlug","ModularGrid slug (optional)","text",'')+'</div></div>'+

    '<div class="astep"><div class="astephead"><span class="astepno">4</span><h3>Copy</h3>'+
    '<span class="ahint">fi/sv missing = the site shows its honest missing-translation banner, on purpose</span></div>'+
    adminField("blurbEn","English (required — this is the RAW fallback)","textarea")+
    '<div class="afrow" style="margin-top:.7rem">'+adminField("blurbFi","Finnish","textarea")+adminField("blurbSv","Swedish","textarea")+'</div>'+
    '</div>'+

    '<div class="astep"><div class="astephead"><span class="astepno">5</span><h3>Owner</h3></div>'+
    '<div class="afrow"><div class="afld sm"><label>Shelf</label><select data-af="who">'+whoOpts+'</select></div></div></div>'+

    '<div class="aoutput"><h3>Save as a new file</h3>'+
    '<p>Filename: <code id="aout-filename">content/items/'+esc(out.id)+'.json</code></p>'+
    '<div class="acode" id="aout-raw">'+esc(out.json)+'</div>'+
    '<div class="acopybar"><button class="btn sm" id="a-copy-raw">Copy JSON</button></div></div>'+
    '</div>';
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(function(){}); }
}

/* ---------- routing ---------- */
/* photo is the default view whenever one exists — matches the grid card,
   which already shows the photo first; drawn panel becomes the alternate */
function openDetail(id){ var m=byId(id); S.shot=(m&&m.img)?1:0; location.hash="#/m/"+id; }
function closeDetail(){ if(location.hash.indexOf("#/m/")===0 || location.hash.indexOf("#/msg/")===0 || location.hash.indexOf("#/admin")===0 || location.hash.indexOf("#/wish")===0) location.hash="#/"; }
function route(){
  var h=location.hash;
  if(h.indexOf("#/wish")===0){
    el("detail").innerHTML=wishHTML();
    document.body.classList.add("detail-open");
    document.title=t().wishH+" — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/admin")===0){
    el("detail").innerHTML=adminHTML();
    document.body.classList.add("detail-open");
    document.title="Add a listing — eurorack.fi";
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/msg/")===0){
    var m=byId(h.slice(6));
    var backHref = m ? "#/m/"+m.id : "#/";
    el("detail").innerHTML='<div class="wrap msgpage">'+
      '<div class="msgbar"><a class="back" href="'+backHref+'">&larr; '+esc(t().nav[0])+'</a></div>'+
      '<iframe class="msgframe" data-tally-src="'+(m?tallyLink(m):TALLY_URL)+(m?"&":"?")+'transparentBackground=1" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0" title="Message eurorack.fi"></iframe>'+
      '</div>';
    document.body.classList.add("detail-open");
    document.title="Message — eurorack.fi";
    /* embed.js only scans the DOM once, on load — a dynamically inserted
       iframe needs an explicit re-scan or it never mounts */
    if(window.Tally) window.Tally.loadEmbeds();
    window.scrollTo(0,0); return;
  }
  if(h.indexOf("#/m/")===0){
    var m=byId(h.slice(4));
    if(m){
      /* a direct/bookmarked load skips openDetail(), so decide once here —
         but never override a click the user already made on this item */
      if(S.shot===null) S.shot=m.img?1:0;
      el("detail").innerHTML=detailHTML(m);
      document.body.classList.add("detail-open");
      document.title=m.mfr+" "+m.name+" — eurorack.fi";
      /* only the drawn-faceplate slot needs fitting — must not clobber a shown photo */
      if(S.shot===0) fitPanel(m);
      window.scrollTo(0,0); return;
    }
    /* no record survives a delisting, so this is deliberately generic */
    el("detail").innerHTML='<div class="wrap"><div class="crumb"><button onclick="closeDetail()">&larr; '+esc(t().nav[0])+'</button></div>'+
      '<div class="gone"><h2>'+esc(GONE[lang].h)+'</h2><p>'+esc(GONE[lang].p)+'</p>'+
      '<button class="btn" onclick="closeDetail()">'+esc(t().nav[0])+'</button></div></div>';
    document.body.classList.add("detail-open"); window.scrollTo(0,0); return;
  }
  document.body.classList.remove("detail-open");
  document.title="eurorack.fi";
}
var GONE={
  fi:{h:"Tätä ei enää ole",p:"Kohde on poistettu listalta. Kaikki myynnissä oleva on etusivulla."},
  sv:{h:"Borta",p:"Objektet är borta från listan. Allt som är till salu finns på förstasidan."},
  en:{h:"That one's gone",p:"This listing has come off the site. Everything still for sale is on the front page."}
};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){ openDetail(g.getAttribute("data-go")); return; }
  var L=e.target.closest("[data-lang]");
  if(L){ lang=L.getAttribute("data-lang"); try{localStorage.setItem("erfi-lang",lang);}catch(x){} renderAll(); route(); return; }
  ["fmt","who","cat"].forEach(function(k){
    var c=e.target.closest("[data-"+k+"]");
    if(c){ S[k]=c.getAttribute("data-"+k); renderFilters(); renderGrid(); }
  });
  var sh=e.target.closest("[data-shot]");
  if(sh && !sh.disabled){ S.shot=+sh.getAttribute("data-shot"); route(); return; }
  /* Toiveet → Home, that seller's owner filter preset. Runs before the
     anchor's own href="#/" navigation, so S.who is already set by the
     time hashchange fires route(). */
  var sw=e.target.closest("[data-setwho]");
  if(sw){ S.who=sw.getAttribute("data-setwho"); renderFilters(); renderGrid(); }
  if(e.target.closest("#themeb")){
    var r=document.documentElement;
    var isDark=r.classList.contains("dark")||(!r.classList.contains("light")&&matchMedia("(prefers-color-scheme:dark)").matches);
    r.classList.remove("dark","light"); r.classList.add(isDark?"light":"dark");
    try{ localStorage.setItem("erfi-theme",isDark?"light":"dark"); }catch(x){}
    return;
  }
  if(e.target.closest("#a-copy-raw")){ copyText(adminOutput().json); return; }
});
/* admin fields update AS + only the output blocks, never re-rendering the
   form — a full re-render on every keystroke would drop focus mid-word */
document.addEventListener("input",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); }
});
document.addEventListener("change",function(e){
  var f=e.target.closest("[data-af]");
  if(f){ AS[f.getAttribute("data-af")]=f.value; updateAdminOutput(); return; }
  var ac=e.target.closest("[data-acat]");
  if(ac){
    var v=ac.getAttribute("data-acat"), i=AS.cats.indexOf(v);
    if(ac.checked && i<0) AS.cats.push(v);
    if(!ac.checked && i>=0) AS.cats.splice(i,1);
    updateAdminOutput(); return;
  }
  if(e.target.id==="a-sc"){ AS.sc=e.target.checked; updateAdminOutput(); return; }
});
el("q").addEventListener("input",function(e){ S.q=e.target.value; renderGrid(); });
el("sort").addEventListener("change",function(e){ S.sort=e.target.value; renderGrid(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeDetail(); });
window.addEventListener("hashchange",route);
var rz; window.addEventListener("resize",function(){
  clearTimeout(rz); rz=setTimeout(function(){ if(location.hash.indexOf("#/m/")===0) route(); },150); });

/* mobile only: hide the sticky filter bar while scrolling down to give the
   grid room, bring it back on any upward scroll. Desktop has space for it
   parked at top, so this stays scoped to the narrow breakpoint. */
(function(){
  var bar=el("grid-top"), lastY=window.scrollY, ticking=false;
  function onScroll(){
    ticking=false;
    if(window.innerWidth>740){ bar.classList.remove("hide"); lastY=window.scrollY; return; }
    var y=window.scrollY, dy=y-lastY;
    if(y<60){ bar.classList.remove("hide"); }
    else if(dy>4){ bar.classList.add("hide"); }
    else if(dy<-4){ bar.classList.remove("hide"); }
    lastY=y;
  }
  window.addEventListener("scroll",function(){
    if(!ticking){ requestAnimationFrame(onScroll); ticking=true; }
  },{passive:true});
})();

/* ---------- init ---------- */
function renderAll(){ renderChrome(); renderRack(); renderFilters(); renderWish(); renderGrid(); }
/* chrome (nav, hero copy, language switcher) needs no data and shows instantly;
   everything listing-shaped waits on the one round trip to content/items/ */
renderChrome();
el("grid").innerHTML='<p class="mono" style="padding:2rem 0;color:var(--muted)">'+esc(t().loading||"Loading…")+'</p>';
loadItems().then(function(items){
  ITEMS=items;
  renderAll();
  route();
}).catch(function(err){
  el("grid").innerHTML='<div class="empty">'+esc(t().loadError||"Could not load listings.")+' ('+esc(err.message)+')</div>';
});
</script>
