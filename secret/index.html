<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>eurorack.fi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..112,400..800&display=swap">
<style>
  :root{ --bg:#E7EBF0; --ink:#0F1722; --accent:#0B4F9E; --soft:#D6E3F5; --signal:#A9660A; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F1722; --ink:#E6ECF4; --accent:#7FB0EE; --soft:#1C2A40; --signal:#E0A040; }
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:16px;box-sizing:border-box;
    font-family:"Archivo",system-ui,sans-serif}
  h1{margin:0;font-size:clamp(1.5rem,6vw,2.4rem);font-weight:800;font-stretch:90%;letter-spacing:-.01em;text-align:center}
  svg{display:block;width:min(56vw,220px);height:auto}
</style>
</head>
<body>
<h1>Hi, you found a secret!</h1>
<!-- An easter egg, drawn at the weight of the wordmark's jack: the egg's
     own "o" is that jack, ring and dot. -->
<svg viewBox="0 0 200 260" role="img" aria-label="An easter egg">
  <defs>
    <clipPath id="egg"><path d="M100 12 C150 12 186 96 186 156 C186 212 148 248 100 248 C52 248 14 212 14 156 C14 96 50 12 100 12 Z"/></clipPath>
  </defs>
  <g clip-path="url(#egg)">
    <rect width="200" height="260" fill="var(--soft)"/>
    <path d="M0 84 L20 66 L40 84 L60 66 L80 84 L100 66 L120 84 L140 66 L160 84 L180 66 L200 84" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M0 214 L20 196 L40 214 L60 196 L80 214 L100 196 L120 214 L140 196 L160 214 L180 196 L200 214" fill="none" stroke="var(--signal)" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="100" cy="142" r="30" fill="none" stroke="var(--ink)" stroke-width="14"/>
    <circle cx="100" cy="142" r="11" fill="var(--ink)"/>
  </g>
  <path d="M100 12 C150 12 186 96 186 156 C186 212 148 248 100 248 C52 248 14 212 14 156 C14 96 50 12 100 12 Z" fill="none" stroke="var(--ink)" stroke-width="12"/>
</svg>
</body>
</html>
